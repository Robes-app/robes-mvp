# Signed in on Home: every tab and You are reachable (sign-out is in sign-in.yaml). No Create button.
appId: host.exp.Exponent
---
# The first tap after a sheet closes can be lost while the screen settles: try it again.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'wardrobe-tab'
      - extendedWaitUntil:
          visible: 'Your wardrobe is empty'
          timeout: 5000
- tapOn:
    id: 'looks-tab'
# Saved · Suggested (the draft looks-prompt.yaml left may be in progress).
- extendedWaitUntil:
    visible:
      id: 'lookbook-tabs'
    timeout: 10000
- tapOn:
    id: 'plan-tab'
- extendedWaitUntil:
    visible:
      id: 'plan-list'
    timeout: 10000
- assertNotVisible:
    id: 'create-tab'
- tapOn:
    id: 'today-tab'
- assertVisible: '.*, Niall\.'
# Expo Go's floating Tools button sits over the avatar, so You is opened by deep link here;
# the avatar → You path is covered by __tests__/shell.test.tsx.
- openLink: ${EXPO_URL}/--/you
- extendedWaitUntil:
    visible: 'Style DNA'
    timeout: 10000
- tapOn: 'Account'
- assertVisible: 'Privacy and data'
- tapOn: 'Back'
