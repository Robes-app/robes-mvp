# A wish she buys becomes a piece → From pieces makes a draft of it → saved, it goes in the
# diary for today → the Diary shows it. Signed in, from sign-in.yaml.
appId: host.exp.Exponent
---
- tapOn:
    id: 'wardrobe-tab'
- tapOn: 'Wishlist'
- tapOn:
    id: 'wardrobe-add'
- tapOn:
    id: 'add-sheet-link'
- tapOn:
    id: 'add-sheet-url'
- inputText: 'https://example.com/silk-scarf'
- tapOn:
    id: 'add-sheet-read'
# There is no shop page to read here: the wish is filled in by hand.
- extendedWaitUntil:
    visible: 'Fill it in yourself'
    timeout: 20000
- tapOn: 'Fill it in yourself'
- tapOn: 'Name'
- inputText: 'Silk scarf'
- hideKeyboard
- tapOn: 'Category: Add'
- tapOn: 'Accessories'
- tapOn: 'Scarves & wraps'
- tapOn: 'Just scarves & wraps'
- tapOn: 'Add to wishlist →'
- extendedWaitUntil:
    visible: 'It’s on your wishlist.'
    timeout: 10000
- tapOn: 'See your wishlist'
- tapOn: 'Silk scarf'
- scrollUntilVisible:
    element:
      id: 'wish-bought'
- tapOn:
    id: 'wish-bought'
# Bought, it is her piece: its page offers the Hero Rack.
- extendedWaitUntil:
    visible: 'Feature Silk scarf in your Hero Rack'
    timeout: 10000
- tapOn:
    id: 'piece-back'
# The toast sits over the tab bar until it times out.
- extendedWaitUntil:
    notVisible: 'Silk scarf is in your wardrobe now.'
    timeout: 20000
- tapOn:
    id: 'looks-tab'
- tapOn: 'New look'
- tapOn:
    id: 'new-look-pieces'
- tapOn: 'Include Silk scarf'
- tapOn:
    id: 'picker-confirm'
- extendedWaitUntil:
    visible: 'Open Silk scarf'
    timeout: 15000
# Saved, the draft asks for its day; today is already picked.
- tapOn:
    id: 'draft-done'
- extendedWaitUntil:
    visible: 'Put it in the diary'
    timeout: 10000
- tapOn: 'Put it in the diary'
- extendedWaitUntil:
    visible:
      id: 'saved-look'
    timeout: 10000
- tapOn:
    id: 'saved-look-back'
# The diary's toast sits over the tab bar until it times out, and takes a tap meant for a tab.
- extendedWaitUntil:
    notVisible:
      id: 'toast-frame'
    timeout: 20000
- tapOn:
    id: 'plan-tab'
# A hand-built look saves as the day's date, and the Diary's today holds it.
- extendedWaitUntil:
    visible: 'Open Today \d+: .+'
    timeout: 10000
