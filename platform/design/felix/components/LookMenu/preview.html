<!-- @dsCard group="iOS" height=420 subtitle="Long press on a saved look: the peek and iOS's menu" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LookMenu — preview</title>
<style>
  .ph{position:relative;width:360px;height:390px;margin:16px;border-radius:var(--rad-device);overflow:hidden;background:var(--cream)}
  .blur{position:absolute;inset:0;background:rgba(250,248,245,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .grid{position:absolute;inset:0;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;align-content:start}
  .lc{padding:6px 6px 10px;background:var(--white);border-radius:var(--rad-row);box-shadow:var(--shadow-card)}
  .lp{aspect-ratio:4/5;border-radius:var(--rad-xs);background:center/cover}
  .ln{font:400 15px/1.2 var(--font-serif);color:var(--ink);margin-top:9px;padding:0 4px}
  .peek{position:absolute;left:96px;top:24px;width:168px}
  .peek .lc{box-shadow:0 18px 40px -14px rgba(32,32,33,.35)}
  .menu{position:absolute;left:96px;top:282px;width:220px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px -10px rgba(32,32,33,.35)}
  .mi{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;font:400 15px/1 -apple-system,BlinkMacSystemFont,var(--font-sans);color:var(--ink)}
  .mi+.mi{border-top:0.5px solid var(--rule-mid)}
  .mi.del{color:#d0342c}
</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Felix, h = React.createElement;
function Card(p) { return h('div', { className: 'lc' }, h('div', { className: 'lp', style: { backgroundImage: 'url(/_blob/' + p.b + ')' } }), h('div', { className: 'ln' }, p.n)); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ph' },
  h('div', { className: 'grid' }, h(Card, { b: '50391bfc33b632d314a4b7e9c3c3e469', n: 'The Thursday one' }), h(Card, { b: '2ac5e4c0bcc534a7b17c55e7b8c2c856', n: 'Friday in Paris' })),
  h('div', { className: 'blur' }),
  h('div', { className: 'peek' }, h(Card, { b: '50391bfc33b632d314a4b7e9c3c3e469', n: 'The Thursday one' })),
  h('div', { className: 'menu' },
    h('div', { className: 'mi' }, 'Schedule look', h(F.Icon, { name: 'calendar', size: 17 })),
    h('div', { className: 'mi del' }, 'Delete look'))));
</script>
</body>
</html>
