<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/js/posthog.js"></script>
  <title>Welcome — Robes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/tokens.css">
<style>
    :root {
      --background: var(--cream);
      --foreground: var(--ink);
      --primary: var(--ink);
      --accent: var(--mauve);
      --cream-30: var(--cream);
      /* --cream-300 / --cream-400 come from tokens.css — never re-alias a
         name tokens.css already defines (a self-reference cycle once
         removed every hairline in this flow). */
      --cream-500: #C4B8A4;
      --cream-600: var(--ink-faint);
      --fg-2: var(--cream-600);
      --font-serif: 'Cormorant', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--background); }
    body { font-family: var(--font-sans); font-weight: 300; color: var(--foreground); -webkit-font-smoothing: antialiased; }
    body.is-dark { background: var(--primary); }
    button { font-family: inherit; }

    .flow-anim { animation: flowFade .44s var(--ease-default) both; }
    @keyframes flowFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes rbPop { from { opacity: 0; transform: scale(.85) translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes rbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* ── The splash — the one dark screen left (design 1a) ─────────── */
    .dk {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--primary); color: var(--cream-30); overflow: hidden;
    }
    .dk-glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(212,200,196,0.14) 0%, transparent 64%); }
    .dk-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.05; pointer-events: none; }
    .dk-inner { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 64px 24px; }
    .dk-splash { animation: splashFade .8s var(--ease-default) both; }
    @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }
    .dk-wordmark { font-family: var(--font-serif); font-weight: 400; font-size: 22px; letter-spacing: 0.5em; text-indent: 0.5em; text-transform: uppercase; color: var(--cream-30); }
    .dk-body { font-weight: 300; font-size: 16px; line-height: 1.75; color: rgba(250,248,245,0.55); max-width: 400px; margin: 0; text-align: center; }
    .dk-btn {
      padding: 17px 24px; background: rgba(250,248,245,0.08); color: var(--cream-30);
      font-weight: 500; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid rgba(250,248,245,0.14); border-radius: 100px; cursor: pointer;
    }

    /* ── The cream screens: name · first piece (designs 1b/1c) ───────
       One frame for both: a 48px bar (← Back · ROBES · spacer), the
       three-segment rule (progress without a denominator), the body, the
       footer. The frame centres at 600px on a wide viewport — the design
       is a phone; the desktop simply gives it room. */
    .ob-screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--background); color: var(--foreground); }
    .ob-frame { width: 100%; max-width: 600px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
    .ob-top { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex: none; }
    .ob-back {
      background: none; border: none; cursor: pointer; padding: 0; width: 60px; text-align: left;
      font-weight: 400; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint);
      transition: color .2s var(--ease-default);
    }
    .ob-back:hover { color: var(--foreground); }
    .ob-back[hidden] { visibility: hidden; display: block; }
    .ob-wm { font-family: var(--font-serif); font-weight: 400; font-size: 13px; letter-spacing: 0.38em; text-indent: 0.38em; text-transform: uppercase; }
    .ob-top-spacer { width: 60px; flex: none; }
    .ob-segs { display: flex; gap: 4px; padding: 0 24px; flex: none; }
    .ob-seg { flex: 1; height: 1px; background: var(--cream-400); transition: background .3s var(--ease-default); }
    .ob-seg.on { background: var(--foreground); }
    .ob-body { flex: 1; padding: 56px 24px 0; display: flex; flex-direction: column; gap: 16px; }
    .ob-body.tight { padding-top: 22px; }
    .ob-eyebrow { font-weight: 400; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--rose); }
    .ob-title { font-family: var(--font-serif); font-weight: 300; font-size: 40px; line-height: 1.08; margin: 0; color: var(--foreground); }
    .ob-title.sm { font-size: 36px; line-height: 1.05; }
    .ob-title em { font-style: italic; }
    .ob-head { display: flex; flex-direction: column; gap: 8px; }
    .ob-sub { font-weight: 300; font-size: 12px; line-height: 1.5; color: var(--ink-soft); margin: 0; }
    .ob-footer { padding: 16px 24px 40px; flex: none; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: flex-end; }
    .ob-cta {
      width: 100%; height: 50px; background: #fff; color: var(--foreground);
      border: 1px solid var(--cream-400); border-radius: 100px; cursor: pointer;
      font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      transition: border-color .2s var(--ease-default), opacity .2s var(--ease-default);
    }
    .ob-cta:hover { border-color: var(--foreground); }
    .ob-cta:disabled { opacity: .35; cursor: not-allowed; }
    .ob-cta.pop { animation: rbPop .45s var(--ease-default) both; }
    .ob-skip { background: none; border: none; cursor: pointer; padding: 0; font-weight: 300; font-size: 13px; color: var(--ink-faint); transition: color .2s var(--ease-default); }
    .ob-skip:hover { color: var(--foreground); }
    .ob-wait { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 17px; color: var(--ink-faint); animation: rbPulse 1.6s ease-in-out infinite; }

    /* name (1b) */
    .ob-namefield { margin-top: 28px; border-bottom: 1px solid var(--foreground); padding: 0 0 12px; }
    .ob-namein {
      width: 100%; border: none; background: none; outline: none; padding: 0;
      font-family: var(--font-serif); font-weight: 300; font-size: 30px; line-height: 1; color: var(--foreground);
    }
    .ob-namein::placeholder { color: var(--cream-500); }
    .ob-namein:focus-visible { outline: none; }

    /* ── The first piece, read live on one page (1c) ───────────────── */
    .kp-well {
      height: 300px; border-radius: var(--rad-card); position: relative; overflow: hidden; flex: none;
      border: 1px solid var(--cream-400); background: #F1F0EE;
      transition: border-color .2s var(--ease-default), background .2s var(--ease-default);
    }
    .kp-well.empty { border-style: dashed; background: var(--cream-100); }
    .kp-well.drag-over { border-color: var(--foreground); border-style: solid; }
    .kp-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center; }
    .kp-label { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 22px; line-height: 1; color: var(--ink-faint); }
    .kp-pill {
      background: #fff; border: 1px solid var(--cream-400); border-radius: 100px; cursor: pointer;
      padding: 11px 20px; font-weight: 500; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--foreground);
      transition: border-color .2s var(--ease-default);
    }
    .kp-pill:hover { border-color: var(--foreground); }
    .kp-linkdoor { background: none; border: none; cursor: pointer; padding: 0; font-weight: 300; font-size: 12px; line-height: 1.4; color: var(--ink-soft); }
    .kp-linkdoor:hover { color: var(--foreground); text-decoration: underline; }
    /* the link mode lives IN the well — same frame, a field instead of a photo */
    .kp-linkrow { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    .kp-linkin {
      width: 100%; height: 46px; border: 1px solid var(--cream-400); border-radius: 100px; background: #fff;
      padding: 0 18px; font-family: var(--font-sans); font-weight: 300; font-size: 14px; color: var(--foreground); outline: none;
    }
    .kp-linkin:focus { border-color: var(--foreground); }
    .kp-linkin::placeholder { color: var(--cream-500); }
    .kp-img { position: absolute; inset: 0; display: flex; justify-content: center; }
    .kp-img img { height: 100%; width: 100%; object-fit: contain; }
    .kp-scan {
      position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 4;
      background: var(--rose); box-shadow: 0 0 14px 4px rgba(142,112,119,0.35);
      animation: kpScan 1.4s var(--ease-default) infinite alternate;
    }
    @keyframes kpScan { 0% { top: 0; } 100% { top: 100%; } }
    .kp-tags { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .kp-tag {
      position: absolute; display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.94); border: 1px solid var(--rule-mid); border-radius: 100px;
      padding: 7px 11px; font-weight: 500; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--foreground); white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(32,32,33,0.06);
      opacity: 0; animation: rbPop .45s var(--ease-default) both;
    }
    .kp-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--rose); flex: none; }
    .kp-retake {
      position: absolute; top: 10px; right: 10px; z-index: 5; cursor: pointer;
      background: rgba(255,255,255,0.94); border: 1px solid var(--rule-mid); border-radius: 100px;
      padding: 7px 11px; font-weight: 400; font-size: 11px; line-height: 1; color: var(--foreground);
    }
    .kp-banner {
      position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; height: 40px; border-radius: 8px;
      background: rgba(32,32,33,0.78); color: var(--cream-30);
      display: flex; align-items: center; justify-content: center; padding: 0 14px;
      font-family: var(--font-serif); font-weight: 400; font-size: 17px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; animation: rbPop .45s var(--ease-default) both;
    }
    .kp-reading {
      position: absolute; inset: 0; z-index: 2; display: flex; align-items: flex-end; justify-content: center; padding: 18px;
      font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 15px; color: var(--ink-faint);
      pointer-events: none;
    }
    .kp-err { font-weight: 300; font-size: 12.5px; line-height: 1.55; color: #8B3A30; margin: -6px 0 0; display: none; }
    .kp-err.on { display: block; }
    .cap-file { display: none; }

    .kp-ledger { display: flex; flex-direction: column; }
    .kp-row { display: flex; align-items: baseline; gap: 14px; border-top: 1px solid var(--rule-mid); padding: 11px 0; }
    .kp-ledger::after { content: ''; border-top: 1px solid var(--rule-mid); }
    .kp-num { font-family: var(--font-serif); font-weight: 300; font-size: 14px; line-height: 1; color: var(--ink-faint); width: 16px; flex: none; }
    .kp-lab { flex: 1; font-weight: 400; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rose); }
    .kp-val { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 17px; line-height: 1; color: var(--cream-400); text-align: right; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kp-val.is-done { font-style: normal; font-weight: 400; font-size: 18px; color: var(--foreground); }

    /* ── Composing (1e): the wait becomes anticipation ─────────────── */
    .ob-compose { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 32px; text-align: center; }
    .ob-compose-thumb { width: 150px; height: 200px; border-radius: var(--rad); background: #F1F0EE; overflow: hidden; display: flex; justify-content: center; }
    .ob-compose-thumb img { height: 100%; width: 100%; object-fit: contain; }
    .ob-compose h2 { margin: 0; font-family: var(--font-serif); font-weight: 300; font-size: 34px; line-height: 1.1; }
    .ob-compose h2 em { font-style: italic; }
    .ob-lines { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 260px; text-align: left; }
    .ob-line { display: flex; justify-content: space-between; gap: 12px; font-weight: 300; font-size: 13px; line-height: 1; color: var(--ink-faint); }
    .ob-line.dressing, .ob-line.done { color: var(--foreground); }
    .ob-line .s { flex: none; }
    .ob-line.done .s { color: var(--sage); }
    .ob-line.dressing .s { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 14px; color: var(--ink-faint); animation: rbPulse 1.6s ease-in-out infinite; }
    .ob-compose-foot { padding: 0 32px 48px; text-align: center; font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 16px; line-height: 1.4; color: var(--ink-faint); flex: none; }

    @media (max-width: 560px) {
      .ob-title { font-size: 40px; }
      .ob-title.sm { font-size: 36px; }
    }

/* a11y: keyboard focus + no-zoom-needed input sizing (Wave 2) */
:focus-visible{outline:2px solid var(--ink,var(--ink));outline-offset:2px}
@media (max-width:820px){input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea{font-size:16px !important}}

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body>

<div id="root"></div>

<script>
  if (!window.supabase) {
    document.getElementById('root').innerHTML =
      '<div class="dk dk-splash"><div class="dk-glow"></div><div class="dk-inner"><div style="text-align:center">' +
      '<div class="dk-wordmark">Robes</div>' +
      '<p class="dk-body" style="margin-top:18px">That didn’t load quite right.</p>' +
      '<button class="dk-btn" style="margin-top:14px" onclick="window.location.reload()">Try again</button>' +
      '</div></div></div>';
    throw new Error('supabase-js failed to load');
  }
  const sbClient = window.supabase.createClient(
    'https://ayowpaknssulsqqvwpqx.supabase.co',
    'sb_publishable_D_iIPtp_R6kjN_711jfyTg_sFmRdpwJ'
  );

  // Onboarding is four decisions and one wow (design 2026-09-25): splash →
  // name → first piece → composing → home. The Style questions (archetypes,
  // icons and brands) left this flow entirely — they are the Style notes
  // chapters now, opened from home once the three looks exist. Nothing
  // stands between the first piece and the three looks.
  const STEPS = ['keypiece'];

  const st = {
    uid: null,
    stage: 'splash',       // 'splash' | 'name' | 0 | 'compose'
    name: '',
    savedName: '',
    icons: [],             // read from the profile for the prefire only — never asked here
    styleDna: {},
    piece: { img: '', data: '', mimeType: '', busy: false, tag: null, url: '', saved: false, savePromise: null, err: '', link: false, linkOpen: false },
    pieceStyled: false,
    stylePromise: null,
    doneMarked: false,
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function save(patch) {
    if (!st.uid) return;
    const { error } = await sbClient.from('profiles').update(patch).eq('id', st.uid);
    if (error) console.error('Onboarding save failed:', error.message);
  }

  const GRAIN = '<svg class="dk-grain" xmlns="http://www.w3.org/2000/svg"><filter id="dkNoise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#dkNoise)"/></svg>';

  const root = document.getElementById('root');
  let splashTimer = null;

  function go(stage) {
    st.stage = stage;
    clearTimeout(splashTimer);
    render();
    window.scrollTo(0, 0);
  }

  // Product events (four-session funnel brief, slice 1.4 · 2026-09-18): the
  // page has PostHog but no _rbTrack — mirror the dashboard's two planes
  // here so the onboarding insert is separable from an in-app add.
  function obTrack(type, meta) {
    try { if (window.__rbPH) window.__rbPH(function (ph) { ph.capture(type, meta || {}); }); } catch (e) {}
    try {
      if (!st.uid) return;
      const h = location.hostname;
      const env = (h === 'www.byrobes.com' || h === 'byrobes.com') ? 'production' : 'beta';
      sbClient.from('events').insert({ user_id: st.uid, event_type: type, metadata: meta || {}, environment: env })
        .then(function () {}, function () {});
    } catch (e) {}
  }
  // Straight onto the dashboard: the per-user session flag lands
  // synchronously (the dashboard's onboarding gate reads it, so the
  // bounce-back can't fire), and the onboarded_at write gets a capped beat
  // to settle before navigation kills it.
  async function finishToDashboard() {
    if (!st.doneMarked) {
      st.doneMarked = true;
      try { sessionStorage.setItem('rb_onboarded__' + st.uid, '1'); } catch (e) {}
      try {
        await Promise.race([save({ onboarded_at: new Date().toISOString() }), new Promise(r => setTimeout(r, 1500))]);
      } catch (e) {}
    }
    window.location.href = '/dashboard';
  }

  function firstName() { return (st.name || '').trim().split(/\s+/)[0] || ''; }

  function render() {
    document.body.classList.toggle('is-dark', st.stage === 'splash');
    if (st.stage === 'splash') return renderSplash();
    if (st.stage === 'name') return renderName();
    if (st.stage === 'compose') return renderCompose();
    renderKeyPiece(st.stage);
  }

  /* ── Splash ─────────────────────────────────────────────────────── */
  // The black screen with the loading wordmark (1a). No button — it hands
  // straight to the name screen once the app is ready.
  function renderSplash() {
    root.innerHTML = `
      <div class="dk dk-splash">${GRAIN}<div class="dk-glow"></div>
        <div class="dk-inner"><div class="dk-wordmark">Robes</div></div>
      </div>`;
    splashTimer = setTimeout(() => go('name'), 2000);
    root.querySelector('.dk-splash').addEventListener('click', () => {
      clearTimeout(splashTimer);
      if (st.stage === 'splash') go('name');
    });
  }

  /* ── The cream frame (1b/1c): bar · three-segment rule · body · footer ── */
  // segs = how many of the three segments are ink: 1 on the name, 2 on the
  // piece, 3 once it is filed. Progress without a denominator.
  function frame(cfg) {
    root.innerHTML = `
      <div class="flow-anim"><div class="ob-screen"><div class="ob-frame">
        <header class="ob-top">
          <button class="ob-back" id="ob-back" ${cfg.back ? '' : 'hidden'}>← Back</button>
          <span class="ob-wm">Robes</span>
          <span class="ob-top-spacer"></span>
        </header>
        <div class="ob-segs" aria-hidden="true">${[1, 2, 3].map(n => `<span class="ob-seg${n <= cfg.segs ? ' on' : ''}"></span>`).join('')}</div>
        <main class="ob-body${cfg.tight ? ' tight' : ''}" id="ob-body"></main>
        <footer class="ob-footer" id="ob-footer"></footer>
      </div></div></div>`;
    if (cfg.back) document.getElementById('ob-back').onclick = cfg.back;
  }

  /* ── Name (1b) ──────────────────────────────────────────────────── */
  // Its own screen, one field. Nothing stands behind it (the splash), so
  // it carries no Back.
  function renderName() {
    frame({ segs: 1, back: null });
    document.getElementById('ob-body').innerHTML = `
      <span class="ob-eyebrow">Hello</span>
      <h1 class="ob-title">What should Robes<br><em>call you?</em></h1>
      <div class="ob-namefield"><input class="ob-namein" id="ob-name-input" type="text" placeholder="Your name" autocomplete="off" value="${esc(st.name)}"></div>
      <p class="ob-sub">A name for your style notes.</p>`;
    document.getElementById('ob-footer').innerHTML =
      `<button class="ob-cta" id="ob-name-next" ${st.name.trim() ? '' : 'disabled'}>Continue</button>`;
    const input = document.getElementById('ob-name-input');
    const next = document.getElementById('ob-name-next');
    const submit = () => {
      const val = input.value.trim();
      if (!val) return;
      st.name = val;
      const first = val.split(/\s+/)[0];
      if (first && first !== st.savedName) { st.savedName = first; save({ first_name: first }); }
      go(0);
    };
    input.oninput = () => { st.name = input.value; next.disabled = !input.value.trim(); };
    input.onkeydown = e => { if (e.key === 'Enter') submit(); };
    next.onclick = submit;
    setTimeout(() => input.focus(), 360);
  }

  /* ── Photo capture helpers ───────────────────────────────────────── */
  // Wire desktop drag-and-drop onto any drop zone, routing the dropped file
  // through the same handler as the file input.
  function wireDrop(el, onDropFile) {
    if (!el || el._rbDropWired) return;
    el._rbDropWired = true;
    ['dragenter', 'dragover'].forEach(ev => el.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); el.classList.add('drag-over');
    }));
    ['dragleave', 'dragend'].forEach(ev => el.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
    }));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && (/^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name))) onDropFile(f);
    });
  }

  async function fileToPayload(file) {
    // A format the browser can paint in an <img> without transcoding.
    const renderableType = t => /^image\/(jpe?g|png|webp|gif|bmp|avif)$/i.test(t || '');
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
      bmp.close();
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return { mimeType: 'image/jpeg', data: dataUrl.split(',')[1], dataUrl, renderable: true };
    } catch (e) {
      // createImageBitmap can't decode HEIC/HEIF outside Safari — the raw data
      // URL still carries the bytes Gemini needs, but it can't be previewed in
      // an <img>. Flag it so callers show the hosted (transcoded) copy instead.
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const m = String(reader.result).match(/^data:(.+?);base64,(.+)$/);
          if (m) resolve({ mimeType: m[1], data: m[2], dataUrl: reader.result, renderable: renderableType(m[1]) });
          else reject(new Error('unreadable'));
        };
        reader.onerror = () => reject(new Error('unreadable'));
        reader.readAsDataURL(file);
      });
    }
  }

  // Where the four tags land on the well (category · brand · colour · cut),
  // and the five ledger rows.
  const KP_SPOTS = [
    { top: '12%', left: '6%' },
    { top: '50%', left: '7%' },
    { top: '30%', right: '6%' },
    { top: '65%', right: '8%' },
  ];
  const KP_READ = ['The piece', 'Category', 'Brand', 'Colour', 'Cut'];

  /* ── The first piece, read live, one page (1c) ──────────────────── */
  // The photo (or a shop link) lands in the well, a scan line passes over
  // it, each tag pops onto the image as its ledger row fills — Awaiting →
  // Reading… → the value — then the filed banner names the piece and the
  // one CTA appears. The same pattern as filing a piece anywhere else in
  // the app; the mechanics beneath (analyse + upload in parallel, one
  // retry, the row insert, the prefire, the handoff) are unchanged.
  const LINK_ERRS = {
    bad_url: 'That doesn’t look like a link — paste the full address, starting https://',
    unreachable: 'That page wouldn’t open for Robes. Some shops close the door to anything but a browser.',
    not_a_page: 'That link isn’t a page Robes can read.',
    no_item: 'Robes couldn’t find one piece on that page — a product page works best.',
    read_failed: 'Robes couldn’t read that page just now — try again in a moment.',
    off: 'Reading links isn’t switched on here yet — add a photograph instead.',
  };
  function renderKeyPiece(i) {
    const P = st.piece;
    // var, not let: paint() calls syncSkip() before the skip wiring at the
    // foot of this function — a let would be in the temporal dead zone.
    var skipArmed = false;

    frame({ segs: P.tag ? 3 : 2, tight: true, back: () => go('name') });

    function eyebrow() {
      if (P.tag) return 'Filed';
      if (P.busy) return 'Reading';
      const n = firstName();
      return n ? esc(n) + '’s wardrobe' : 'Your wardrobe';
    }

    function kpChips() {
      if (!P.tag) return [];
      const dna = P.tag.item_dna || {};
      const chips = [];
      if (P.tag.category) chips.push(P.tag.category);
      if (P.tag.brand) chips.push(P.tag.brand);
      const colour = (dna.display && dna.display.editorial_color_name) || P.tag.color;
      if (colour) chips.push(colour);
      ((dna.structural_dna && dna.structural_dna.silhouette_fit) || []).forEach(f => {
        if (chips.length < KP_SPOTS.length) chips.push(f);
      });
      return chips;
    }

    function doneVals() {
      const dna = P.tag.item_dna || {};
      const fit = (dna.structural_dna && dna.structural_dna.silhouette_fit) || [];
      return [
        P.tag.label || 'Read',
        P.tag.category || 'Read',
        P.tag.brand || (dna.display && dna.display.brand_raw) || 'Unlabelled',
        (dna.display && dna.display.editorial_color_name) || P.tag.color || 'Read',
        fit.slice(0, 2).join(' · ') || '—',
      ];
    }

    // Row i shows its value once the reveal cursor has passed it, "Reading…"
    // on the row the cursor is on (or every row while the read is in
    // flight), "Awaiting" before anything has landed.
    function rowVals() {
      if (P.busy) return KP_READ.map(() => ({ txt: 'Reading…', done: false }));
      if (P.tag) {
        const finals = doneVals();
        if (P.revealing) return finals.map((v, idx) =>
          idx < P.revealCount ? { txt: v, done: true } : { txt: idx === P.revealCount ? 'Reading…' : 'Awaiting', done: false });
        return finals.map(v => ({ txt: v, done: true }));
      }
      return KP_READ.map(() => ({ txt: 'Awaiting', done: false }));
    }

    function paintRows() {
      const vals = rowVals();
      document.querySelectorAll('#ob-body .kp-val').forEach((sp, idx) => {
        sp.textContent = vals[idx].txt;
        sp.className = 'kp-val' + (vals[idx].done ? ' is-done' : '');
      });
    }

    // Reveal the five filed fields one at a time, the tags popping in step,
    // the banner and the CTA last. Surgical updates — the pop animations
    // are never restarted by a repaint.
    function revealLedger() {
      const stepMs = 480;
      P.revealing = true;
      P.revealCount = 0;
      paintRows();
      const tags = document.getElementById('kp-tags');
      const chips = kpChips();
      const tick = () => {
        if (st.stage !== i) { P.revealing = false; return; }
        P.revealCount++;
        paintRows();
        // the tag for this row (category · brand · colour · cut) pops as it fills
        const ci = P.revealCount - 2;
        if (tags && ci >= 0 && ci < chips.length) {
          const s = KP_SPOTS[ci];
          const pos = `top:${s.top};` + (s.left ? `left:${s.left};` : `right:${s.right};`);
          tags.insertAdjacentHTML('beforeend', `<span class="kp-tag" style="${pos}">${esc(chips[ci])}</span>`);
        }
        if (P.revealCount < KP_READ.length) setTimeout(tick, stepMs);
        else { P.revealing = false; paint(); }
      };
      setTimeout(tick, 280);
    }

    function popTagsStatic() {
      const tags = document.getElementById('kp-tags');
      if (!tags || !P.tag) return;
      tags.innerHTML = kpChips().map((c, idx) => {
        const s = KP_SPOTS[idx];
        const pos = `top:${s.top};` + (s.left ? `left:${s.left};` : `right:${s.right};`);
        return `<span class="kp-tag" style="${pos};animation:none;opacity:1">${esc(c)}</span>`;
      }).join('');
    }

    function paint() {
      const body = document.getElementById('ob-body');
      if (!body) return;
      const filed = !!P.tag && !P.revealing && !P.busy;
      document.querySelectorAll('.ob-seg')[2].classList.toggle('on', !!P.tag);
      const hasImg = !!(P.img || P.url);
      const wellInner = hasImg
        ? `<div class="kp-img"><img src="${esc(P.renderable === false ? (P.url || P.img) : (P.img || P.url))}" alt=""></div>
           ${P.busy ? '<div class="kp-scan"></div>' : ''}
           <div class="kp-tags" id="kp-tags"></div>
           ${!P.busy ? '<button type="button" class="kp-retake" id="kp-retake">↻ Retake</button>' : ''}
           ${filed && P.tag.label ? `<div class="kp-banner">${esc(P.tag.label)}</div>` : ''}`
        : P.busy
          ? `<div class="kp-scan"></div><div class="kp-reading">Reading the page…</div>`
          : P.linkOpen
            ? `<div class="kp-empty"><form class="kp-linkrow" id="kp-linkform">
                 <input class="kp-linkin" id="kp-link" type="text" inputmode="url" placeholder="https://…" autocomplete="off" value="${esc(P.linkVal || '')}">
                 <button type="submit" class="kp-pill" id="kp-linkgo">Read the page</button>
                 <button type="button" class="kp-linkdoor" id="kp-linkback">← A photograph instead</button>
               </form></div>`
            : `<div class="kp-empty">
                 <span class="kp-label">Your key piece</span>
                 <button type="button" class="kp-pill" id="kp-add">Add photo</button>
                 <button type="button" class="kp-linkdoor" id="kp-linkopen">or paste a link from a shop</button>
               </div>`;
      const vals = rowVals();
      body.innerHTML = `
        <div class="ob-head">
          <span class="ob-eyebrow" id="kp-eyebrow">${eyebrow()}</span>
          <h1 class="ob-title sm">Add your <em>first piece.</em></h1>
        </div>
        <div class="kp-well${hasImg || P.busy || P.linkOpen ? '' : ' empty'}" id="kp-well">${wellInner}</div>
        <p class="kp-err${P.err ? ' on' : ''}" id="kp-err">${esc(P.err)}</p>
        <div class="kp-ledger">${KP_READ.map((r, idx) => `
          <div class="kp-row">
            <span class="kp-num">${String(idx + 1).padStart(2, '0')}</span>
            <span class="kp-lab">${r}</span>
            <span class="kp-val${vals[idx].done ? ' is-done' : ''}">${esc(vals[idx].txt)}</span>
          </div>`).join('')}</div>
        <input type="file" accept="image/*" class="cap-file" id="kp-file">`;
      const foot = document.getElementById('ob-footer');
      foot.innerHTML = filed
        ? `<button class="ob-cta pop" id="ob-next">Style it three ways →</button>`
        : P.busy || P.revealing
          ? `<span class="ob-wait" id="ob-wait">Robes is reading your piece…</span>`
          : `<button class="ob-skip" id="ob-skip">Skip for now</button>`;

      const fileInput = document.getElementById('kp-file');
      const pick = () => fileInput.click();
      const addBtn = document.getElementById('kp-add');
      const retake = document.getElementById('kp-retake');
      if (addBtn) addBtn.onclick = pick;
      if (retake) retake.onclick = () => {
        // a retake un-files nothing already written — it only starts the
        // read again on a new photograph (the row, if any, stays hers)
        P.img = ''; P.data = ''; P.url = ''; P.err = ''; P.tag = null; P.renderable = true; P.link = false;
        P.saved = false; P.savePromise = null;
        paint(); pick();
      };
      const linkOpen = document.getElementById('kp-linkopen');
      if (linkOpen) linkOpen.onclick = () => { P.linkOpen = true; P.err = ''; paint(); setTimeout(() => { const el = document.getElementById('kp-link'); if (el) el.focus(); }, 60); };
      const linkBack = document.getElementById('kp-linkback');
      if (linkBack) linkBack.onclick = () => { P.linkOpen = false; P.err = ''; paint(); };
      const linkForm = document.getElementById('kp-linkform');
      if (linkForm) linkForm.onsubmit = e => { e.preventDefault(); readLink(document.getElementById('kp-link').value); };
      fileInput.onchange = () => { handleFile(fileInput.files[0]); fileInput.value = ''; };
      wireDrop(document.getElementById('kp-well'), handleFile);
      if (filed) popTagsStatic();
      const next = document.getElementById('ob-next');
      if (next) next.onclick = onStyle;
      const skip = document.getElementById('ob-skip');
      if (skip) skip.onclick = () => {
        if (P.busy) return;
        if (skipArmed) { skip.style.pointerEvents = 'none'; finishToDashboard(); return; }
        skipArmed = true;
        skip.textContent = 'Skip anyway — Robes styles only what you add';
      };
    }

    async function handleFile(file) {
      if (!file) return;
      let payload;
      try {
        payload = await fileToPayload(file);
      } catch (e) {
        P.err = 'Couldn’t read that image — try another file.';
        if (st.stage === i) paint();
        return;
      }
      P.img = payload.dataUrl;
      P.data = payload.data;
      P.mimeType = payload.mimeType;
      P.renderable = payload.renderable !== false;
      P.url = '';
      P.err = '';
      P.link = false; P.linkOpen = false;
      if (st.stage === i) paint();
      catalogue();
    }

    // "or paste a link from a shop": the retailer page read into the same
    // shape as a photograph (POST /api/wardrobe/read-url — the dashboard's
    // Paste-a-link door). The page's photograph becomes the piece's, and
    // rides the prefire the way an upload would.
    async function readLink(raw) {
      if (P.busy) return;
      const url = (raw || '').trim();
      P.linkVal = url;
      if (!/^https?:\/\/\S+\.\S+/i.test(url)) { P.err = LINK_ERRS.bad_url; paint(); return; }
      P.err = ''; P.busy = true; P.link = true;
      paint();
      let out = null, status = 0;
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 45000);
        const r = await fetch('/api/wardrobe/read-url', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, userId: st.uid || undefined }), signal: ctl.signal,
        });
        clearTimeout(timer);
        status = r.status;
        out = await r.json().catch(() => null);
      } catch (e) { out = null; }
      P.busy = false;
      if (!out || out.error || !out.label) {
        const key = (out && out.error) || (status === 404 ? 'off' : 'read_failed');
        P.err = LINK_ERRS[key] || LINK_ERRS.read_failed;
        P.linkOpen = true;
        if (st.stage === i) paint();
        return;
      }
      P.url = out.image_url || '';
      P.img = '';
      P.data = '';
      P.renderable = true;
      P.linkOpen = false;
      file(out);
    }

    async function catalogue() {
      if (P.busy || P.tag) return;
      if (!P.img || !P.data) return;
      P.err = '';
      P.busy = true;
      paint();

      const analyse = () => fetch('/api/wardrobe/analyse', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: P.data, mimeType: P.mimeType, userId: st.uid || undefined }),
      }).then(r => r.ok ? r.json() : null).catch(() => null);

      let [tag, up] = await Promise.all([
        analyse(),
        fetch('/api/wardrobe/upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: P.data, mimeType: P.mimeType }),
        }).then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      if (!tag || tag.analysisFailed || (!tag.noItemDetected && !tag.label)) {
        await new Promise(r => setTimeout(r, 1500));
        tag = (await analyse()) || tag;
      }

      P.busy = false;

      if (tag && tag.noItemDetected) {
        P.img = ''; P.data = ''; P.url = '';
        P.err = 'Robes couldn’t find a piece in that photo — try a clear shot of the garment.';
        if (st.stage === i) paint();
        return;
      }
      if (!tag || tag.analysisFailed || !tag.label) {
        P.err = 'Robes couldn’t read that piece just now — try again in a moment.';
        if (st.stage === i) paint();
        return;
      }
      if (up && up.url) P.url = up.url;
      file(tag);
    }

    // The piece is read: file it (the row insert in the background), fire
    // the prefire and the handoff NOW, then play the reveal.
    function file(tag) {
      P.tag = tag;
      const row = {
        user_id: st.uid,
        label: tag.label,
        category: tag.category || 'Other',
        category_l2: tag.category_l2 || null,
        category_l3: tag.category_l3 || null,
        color: tag.color || null,
        brand: tag.brand || null,
        notes: tag.notes || null,
        image_url: P.url || null,
        item_dna: tag.item_dna || {},
      };
      const src = P.link ? 'onboarding_link' : 'onboarding';
      P.savePromise = sbClient.from('wardrobe_items').insert(row).then(({ error }) => {
        if (error && /category_l|column/i.test(error.message || '')) {
          // Migration 15 not run — retry without the taxonomy columns.
          delete row.category_l2;
          delete row.category_l3;
          return sbClient.from('wardrobe_items').insert(row).then(({ error: e2 }) => {
            if (e2) { console.warn('Wardrobe save failed:', e2.message); return false; }
            P.saved = true;
            obTrack('wardrobe_added', { source: src, category: row.category || '', batch_n: 1, batch_i: 1 });
            return true;
          });
        }
        if (error) { console.warn('Wardrobe save failed:', error.message); return false; }
        P.saved = true;
        obTrack('wardrobe_added', { source: src, category: row.category || '', batch_n: 1, batch_i: 1 });
        return true;
      }).catch(() => false);

      if (st.stage !== i) return;
      prefireStyle();
      writeHandoff();
      P.revealing = true;
      P.revealCount = 0;
      paint();
      revealLedger();
    }

    // The dashboard handoff payload — written as soon as the piece is filed
    // (and refreshed on the CTA so a late insert still stamps cataloged).
    function writeHandoff() {
      const prompt = (P.tag && P.tag.label) || '';
      const put = cataloged => {
        const payload = { prompt, photo: P.img || P.url || null, cataloged: !!cataloged };
        try {
          sessionStorage.setItem('rb_onboard_piece', JSON.stringify(payload));
          st.pieceStyled = true;
        } catch (e) {
          try {
            sessionStorage.setItem('rb_onboard_piece', JSON.stringify({ prompt, photo: null, cataloged: !!cataloged }));
            st.pieceStyled = true;
          } catch (e2) { st.pieceStyled = false; }
        }
      };
      put(P.saved);
      if (!P.saved && P.savePromise) {
        Promise.race([P.savePromise, new Promise(r => setTimeout(() => r(false), 3000))])
          .then(ok => { if (ok) put(true); })
          .catch(() => {});
      }
    }

    // A hosted photograph (the link path) rides the prefire as a data URL,
    // the way the dashboard's wardrobe pick does — a fetch that fails
    // leaves the prefire on the label alone.
    function pieceDataUrl() {
      if (P.img) return Promise.resolve(P.img);
      if (!P.url) return Promise.resolve(null);
      return fetch(P.url).then(r => r.blob()).then(fileToPayload).then(p => p.dataUrl).catch(() => null);
    }

    // Fire the "style key piece" pipeline the moment the piece is filed —
    // the looks generate while the reveal plays and the composing screen
    // waits on this promise; the dashboard's "Your piece, styled" card
    // picks up the finished result instead of starting from zero.
    function prefireStyle() {
      if (st.stylePrefired) return;
      st.stylePrefired = true;
      const t = P.tag || {};
      const prompt = t.label || '';
      try { sessionStorage.removeItem('rb_onboard_styled'); } catch (e) {}
      st.stylePromise = pieceDataUrl().then(photo => fetch('/api/style', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          photo: photo || null,
          styleDna: (st.styleDna && (st.styleDna.color_harmony || st.styleDna.silhouette_proportions)) ? st.styleDna : null,
          styleIcons: st.icons || [],
          wardrobeCount: 1,
          wardrobeItems: t.label ? [{ label: t.label, category: t.category || '', color: t.color || '', times_worn: 0 }] : [],
          intent: 'style',
          userId: st.uid || undefined,
        }),
      })).then(r => r.ok ? r.json() : null).then(d => {
        if (!d) return null;
        try { sessionStorage.setItem('rb_onboard_styled', JSON.stringify({ prompt, data: d, ts: Date.now() })); } catch (e) {}
        return d;
      }).catch(() => null);
    }

    // "Style it three ways →": the piece is already styling — the tap opens
    // the composing screen, never a second call.
    async function onStyle() {
      if (!P.tag) return;
      if (!P.saved && P.savePromise) {
        const cta = document.getElementById('ob-next');
        if (cta) { cta.disabled = true; cta.textContent = 'Filing your piece…'; }
        try { await Promise.race([P.savePromise, new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
      }
      writeHandoff();
      go('compose');
    }

    paint();
  }

  /* ── Composing (1e) ─────────────────────────────────────────────── */
  // Replaces the Style step: the wait becomes anticipation instead of a
  // form. The screen holds until the three looks' TEXT lands (capped) —
  // the lines then take the real titles and tick off one by one — and
  // hands off to home, where the card carries the frames as they come.
  function renderCompose() {
    const P = st.piece;
    const n = firstName();
    const src = P.img || P.url || '';
    const lines = ['A first look', 'A second look', 'A third look'];
    root.innerHTML = `
      <div class="flow-anim"><div class="ob-screen"><div class="ob-frame">
        <div class="ob-compose">
          <div class="ob-compose-thumb">${src ? `<img src="${esc(src)}" alt="">` : ''}</div>
          <h2>Composing<br><em>three looks${n ? ', ' + esc(n) : ''}.</em></h2>
          <div class="ob-lines" id="ob-lines">${lines.map((l, k) => `<div class="ob-line${k === 0 ? ' dressing' : ''}"><span class="l">${l}</span><span class="s">${k === 0 ? 'dressing…' : ''}</span></div>`).join('')}</div>
        </div>
        <div class="ob-compose-foot">Every look borrows the rest until you photograph your own.</div>
      </div></div></div>`;
    const rows = () => Array.from(document.querySelectorAll('#ob-lines .ob-line'));
    const setLine = (k, state, label) => {
      const r = rows()[k]; if (!r) return;
      r.className = 'ob-line ' + state;
      if (label) r.querySelector('.l').textContent = label;
      r.querySelector('.s').textContent = state === 'done' ? '✓' : state === 'dressing' ? 'dressing…' : '';
    };
    const cap = new Promise(r => setTimeout(() => r(null), 20000));
    const t0 = Date.now();
    Promise.race([st.stylePromise || Promise.resolve(null), cap]).then(async d => {
      if (st.stage !== 'compose') return;
      const ways = (d && Array.isArray(d.ways)) ? d.ways.slice(0, 3) : [];
      // the lines tick 700ms apart — theatre on a result that has landed,
      // the ledger-reveal precedent; a result that never lands still leaves
      // (the card at home carries the wait and the retry)
      for (let k = 0; k < 3; k++) {
        const title = ways[k] && ways[k].title;
        setLine(k, 'dressing', title || null);
        await new Promise(r => setTimeout(r, k === 0 ? Math.max(0, 700 - (Date.now() - t0)) : 700));
        if (st.stage !== 'compose') return;
        setLine(k, ways.length ? 'done' : 'pending', null);
      }
      await new Promise(r => setTimeout(r, 900));
      if (st.stage === 'compose') finishToDashboard();
    });
  }

  /* ── Boot ───────────────────────────────────────────────────────── */
  (async function init() {
    render();

    const session = await new Promise(resolve => {
      let settled = false;
      const finish = s => { if (!settled) { settled = true; resolve(s); } };
      sbClient.auth.onAuthStateChange((_, s) => finish(s));
      sbClient.auth.getSession().then(({ data: { session: s } }) => finish(s));
      setTimeout(() => finish(null), 5000);
    });
    if (!session) { window.location.href = '/signup.html?mode=signin'; return; }
    st.uid = session.user.id;
    if (window.__rbPHUser) window.__rbPHUser(session);

    // Already-onboarded users land here directly (OAuth + email-confirm
    // redirects target /onboarding) — pass them through. The flag is PER
    // USER: an unscoped key let a tab that had onboarded one account skip
    // the flow for the next; purge the legacy global.
    let alreadyOnboarded = false;
    try {
      sessionStorage.removeItem('rb_onboarded');
      alreadyOnboarded = !!sessionStorage.getItem('rb_onboarded__' + st.uid);
    } catch (e) {}
    if (alreadyOnboarded) { window.location.href = '/dashboard'; return; }

    const meta = session.user.user_metadata || {};
    const metaName = meta.first_name || meta.given_name || String(meta.full_name || meta.name || '').split(/\s+/)[0] || '';

    const { data: profile } = await sbClient.from('profiles')
      .select('first_name, style_icons, style_dna, onboarded_at').eq('id', st.uid).single();
    if (profile && profile.onboarded_at) { window.location.href = '/dashboard'; return; }
    if (profile) {
      if (profile.first_name) st.savedName = profile.first_name;
      if (profile.style_icons && profile.style_icons.length) st.icons = profile.style_icons;
      if (profile.style_dna && typeof profile.style_dna === 'object') st.styleDna = profile.style_dna;
    }
    if (!st.name) st.name = st.savedName || metaName;

    // The profile row usually lands after the 2s splash — this re-render is
    // what prefills the field.
    if (st.stage === 'name') render();
  })();
</script>

</body>
</html>
