packages:
  - app
  - mobile
  - workers
  - infra
  - packages/*
  - scripts/migrate

catalog:
  typescript: 6.0.3
  vitest: 5.0.1
  zod: 4.6.5
  jose: 6.2.12
  fast-check: 4.10.2
  tsx: 4.23.15

allowBuilds:
  '@google/genai': false
  # Binary comes from its per-platform optional dependency; the postinstall only re-checks it.
  '@sentry/cli': false
  # posthog-js dependency; its postinstall only prints a funding banner.
  core-js: false
  dbmate: true
  # esbuild's postinstall swaps its JS launcher for the native binary, which breaks pnpm .bin shims.
  esbuild: false
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
  - '@upstash/ratelimit@2.2.0'

# Patched floors for vulnerable transitive deps (pnpm audit, 2026-10-15).
overrides:
  shell-quote@>=1.8.4 <1.11.0: '>=1.11.0'
  source-map-js@>=1.0.0 <1.2.2: '>=1.2.2'
  sharp@<0.35.5: '>=0.35.5'
  # GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr (via posthog-js); GHSA-587h-7wmj-h5pm (via vitest).
  dompurify@<3.4.17: '>=3.4.17'
  vite@>=8.3.0 <8.3.3: '>=8.3.3'

auditConfig:
  # No patched release yet; both run only in the Expo CLI / Metro dev toolchain, never in the app or API.
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge via @expo/code-signing-certificates
    - GHSA-vfj7-8cjw-p6xm # braces via metro-file-map > micromatch
