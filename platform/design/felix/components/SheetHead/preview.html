<!-- @dsCard group="iOS" height=200 subtitle="×, title, action — and a drill's back" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SheetHead — preview</title>
<style>
  .st{display:flex;flex-direction:column;gap:14px;width:360px;padding:16px 20px;background:var(--cream)}
  .hd{display:flex;align-items:center;gap:12px;height:40px}
  .x{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cream-200);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
  .bk{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .t{flex:1;text-align:center;font:600 15px/1.2 var(--font-sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a{flex:none;font:400 13px/1 var(--font-sans);color:var(--ink)}
  .a.off{color:var(--ink-faint)}
  .sp{flex:none;width:36px}
  hr{border:0;border-top:0.5px solid var(--rule);margin:0}
</style></head>
<body>
<div id="root"></div>
<script>
var F = window.Felix, h = React.createElement;
function Head(p) {
  return h('div', { className: 'hd' },
    p.back ? h('span', { className: 'bk' }, h(F.Icon, { name: 'back', size: 17 })) : h('span', { className: 'x' }, h(F.Icon, { name: 'close', size: 14 })),
    h('span', { className: 't' }, p.title),
    p.action ? h('span', { className: 'a' + (p.off ? ' off' : '') }, p.action) : h('span', { className: 'sp' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'st' },
  h(Head, { title: 'Notifications', action: 'Clear all' }), h('hr'),
  h(Head, { title: 'Filter', action: 'Clear', off: true }), h('hr'),
  h(Head, { title: 'Knitwear', back: true, action: 'Done' })));
</script>
</body>
</html>
