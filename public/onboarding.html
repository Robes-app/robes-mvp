<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome — Robes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --background: #FAF8F5;
      --foreground: #202021;
      --primary: #202021;
      --accent: #D4C8C4;
      --muted: #E8D5D2;
      --cream-30: #FAF8F5;
      --cream-300: #E7E0CF;
      --cream-400: #D8CFC0;
      --cream-500: #C4B8A4;
      --cream-600: #A89880;
      --fg-2: var(--cream-600);
      --font-serif: 'Cormorant', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--primary); }
    body { font-family: var(--font-sans); font-weight: 300; color: var(--foreground); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }

    .flow-anim { animation: flowFade .44s var(--ease-default) both; }
    @keyframes flowFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* ── Dark intro shell (splash · intro · name · done) ─────────── */
    .dk {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--primary); color: var(--cream-30); overflow: hidden;
    }
    .dk-glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(212,200,196,0.14) 0%, transparent 64%); }
    .dk-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.05; pointer-events: none; }
    .dk-inner { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 720px; margin: 0 auto; padding: 64px 64px 48px; }

    .dk-splash { animation: splashFade .8s var(--ease-default) both; }
    @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }
    .dk-splash .dk-inner { align-items: center; justify-content: center; }
    .dk-wordmark { font-family: var(--font-serif); font-weight: 300; font-size: 30px; letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase; color: var(--cream-30); }
    .dk-splash-sub { margin-top: 22px; font-weight: 400; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(250,248,245,0.32); }

    .dk-eyebrow { font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(250,248,245,0.34); margin: 0 0 28px; }
    .dk-heading { font-family: var(--font-serif); font-weight: 300; font-size: clamp(40px, 7vw, 60px); line-height: 1.05; letter-spacing: -0.01em; color: var(--cream-30); margin: 0 0 28px; }
    .dk-heading em { font-style: italic; color: var(--accent); display: block; }
    .dk-body { font-weight: 300; font-size: 16px; line-height: 1.75; color: rgba(250,248,245,0.55); max-width: 400px; margin: 0; }
    .dk-sub { font-weight: 400; font-size: 13px; color: rgba(250,248,245,0.34); margin: 0 0 56px; letter-spacing: 0.01em; }

    .dk-input {
      font-family: var(--font-serif); font-weight: 300; font-size: 32px; letter-spacing: -0.01em;
      color: var(--cream-30); background: transparent; border: none;
      border-bottom: 1px solid rgba(250,248,245,0.15); outline: none; width: 100%;
      padding: 8px 0 18px; transition: border-color .2s var(--ease-default);
    }
    .dk-input:focus { border-bottom-color: rgba(250,248,245,0.5); }
    .dk-input::placeholder { color: rgba(212,200,196,0.3); }

    .dk-spacer { flex: 1; min-height: 40px; }
    .dk-cta { margin-top: auto; padding-top: 32px; }
    .dk-btn {
      width: 100%; padding: 19px 24px; background: rgba(250,248,245,0.08); color: var(--cream-30);
      font-weight: 500; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid rgba(250,248,245,0.14); border-radius: 2px; cursor: pointer;
      transition: background .2s var(--ease-default), opacity .15s var(--ease-default);
    }
    .dk-btn:hover { background: rgba(250,248,245,0.16); }
    .dk-btn:disabled { opacity: 0.28; cursor: not-allowed; }
    .dk-back {
      background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 40px;
      display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
      font-weight: 500; font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(250,248,245,0.4); transition: color .2s var(--ease-default);
    }
    .dk-back:hover { color: var(--cream-30); }

    /* ── Completion ──────────────────────────────────────────────── */
    .done-screen {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 64px 28px; background: var(--primary); color: var(--cream-30);
      position: relative; overflow: hidden;
    }
    .done-eyebrow { position: relative; z-index: 2; font-weight: 500; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--accent); margin: 0 0 30px; }
    .done-title { position: relative; z-index: 2; font-family: var(--font-serif); font-weight: 300; font-size: clamp(40px, 8vw, 66px); line-height: 1.04; letter-spacing: -0.01em; margin: 0 0 24px; max-width: 16ch; }
    .done-title em { font-style: italic; color: var(--accent); }
    .done-sub { position: relative; z-index: 2; font-weight: 300; font-size: 16px; line-height: 1.7; color: rgba(250,248,245,0.55); max-width: 420px; margin: 0 0 44px; }
    .done-restart {
      position: relative; z-index: 2; background: none; border: 1px solid rgba(250,248,245,0.18); border-radius: 2px; cursor: pointer;
      font-weight: 500; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--cream-30); padding: 16px 34px; transition: background .2s var(--ease-default), color .2s var(--ease-default);
    }
    .done-restart:hover { background: var(--cream-30); color: var(--primary); }
    .done-dots { position: relative; z-index: 2; display: flex; gap: 8px; margin-top: 52px; }
    .done-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(250,248,245,0.22); }
    .done-dot.on { background: var(--accent); }

    /* ── Working-step chrome (cream) ─────────────────────────────── */
    .ob-screen { background: var(--background); color: var(--foreground); display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    .ob-top { display: flex; align-items: center; justify-content: space-between; padding: 30px 64px 0; }
    .ob-back {
      background: none; border: none; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 500; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);
      transition: color .2s var(--ease-default);
    }
    .ob-back:hover { color: var(--foreground); }
    .ob-arrow { font-size: 15px; }
    .ob-step { font-weight: 500; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--foreground); white-space: nowrap; }
    .ob-count { font-weight: 400; font-size: 11px; letter-spacing: 0.18em; color: var(--cream-500); white-space: nowrap; }
    .ob-progress { height: 1px; background: var(--cream-300); margin: 24px 64px 0; position: relative; }
    .ob-progress-fill { position: absolute; left: 0; top: -1px; height: 3px; background: var(--foreground); transition: width .4s var(--ease-default); }

    .ob-body { flex: 1; padding: 58px 64px 44px; max-width: 860px; width: 100%; margin: 0 auto; }
    .ob-eyebrow { font-weight: 500; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 24px; color: #AE9290; }
    .ob-title { font-family: var(--font-serif); font-weight: 300; font-size: clamp(34px, 5.4vw, 60px); line-height: 1.04; letter-spacing: -0.01em; margin: 0 0 24px; color: var(--foreground); }
    .ob-title em { font-style: italic; }
    .ob-sub { font-weight: 300; font-size: clamp(14px, 1.7vw, 17px); line-height: 1.7; color: var(--fg-2); max-width: 560px; margin: 0 0 52px; }
    .ob-input-zone { margin-top: 4px; }

    .ob-footer { padding: 0 64px 38px; max-width: 860px; width: 100%; margin: 0 auto; }
    .ob-continue {
      width: 100%; background: var(--primary); color: var(--background);
      border: none; border-radius: 2px; cursor: pointer;
      font-weight: 400; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; padding: 23px;
      transition: opacity .2s var(--ease-default);
    }
    .ob-continue:hover { opacity: .9; }
    .ob-skip {
      display: block; margin: 20px auto 0; background: none; border: none; cursor: pointer;
      font-weight: 300; font-size: 13px; color: var(--fg-2);
      transition: color .2s var(--ease-default);
    }
    .ob-skip:hover { color: var(--foreground); }

    .ob-label { font-weight: 500; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-600); white-space: nowrap; }
    .ob-tally { font-family: var(--font-serif); font-weight: 400; font-size: 17px; color: var(--cream-500); }

    /* ── Chips + typeahead (Step 01) ─────────────────────────────── */
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip-ghost {
      font-weight: 400; font-size: 14px; color: var(--foreground); background: var(--cream-30);
      border: 1px solid var(--cream-300); border-radius: 2px;
      padding: 11px 18px; line-height: 1; cursor: pointer;
      transition: background .2s var(--ease-default), color .2s var(--ease-default), border-color .2s var(--ease-default);
    }
    .chip-ghost:hover { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
    .chip-solid {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 400; font-size: 14px; color: var(--cream-30); background: var(--primary);
      border: 1px solid var(--primary); border-radius: 2px;
      padding: 11px 14px 11px 18px; line-height: 1;
    }
    .chip-x {
      background: none; border: none; cursor: pointer; padding: 0;
      width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
      color: rgba(250,248,245,0.5); font-size: 17px; line-height: 1;
      transition: color .2s var(--ease-default);
    }
    .chip-x:hover { color: var(--cream-30); }

    .v1-fieldwrap { position: relative; }
    .v1-field {
      display: flex; align-items: stretch; border: 1px solid var(--cream-300);
      border-radius: 2px; background: var(--cream-30); margin-bottom: 36px;
      transition: border-color .2s var(--ease-default);
    }
    .v1-field:focus-within { border-color: var(--cream-500); }
    .v1-input {
      flex: 1; border: none; background: none; outline: none;
      font-family: var(--font-sans); font-weight: 300; font-size: 16px;
      color: var(--foreground); padding: 19px 20px;
    }
    .v1-input::placeholder { color: var(--cream-500); }
    .v1-hint { align-self: center; padding-right: 18px; font-size: 11px; color: var(--cream-500); white-space: nowrap; }
    .v1-hint kbd { font-family: var(--font-sans); font-size: 10px; border: 1px solid var(--cream-300); border-radius: 2px; padding: 2px 6px; color: var(--fg-2); }
    .v1-selected-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .v1-empty { font-weight: 300; font-size: 13px; color: var(--cream-500); margin: 0 0 4px; }
    .v1-divider { height: 1px; background: var(--cream-300); margin: 30px 0; }
    .v1-pool-head { margin-bottom: 16px; }

    .v2-drop {
      list-style: none; margin: 7px 0 0; padding: 6px; position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
      background: var(--cream-30); border: 1px solid var(--cream-300); border-radius: 2px;
    }
    .v2-opt {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 2px; cursor: pointer;
      font-weight: 300; font-size: 15px; color: var(--foreground);
    }
    .v2-opt.is-active { background: var(--foreground); color: var(--background); }
    .v2-opt-add { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream-500); }
    .v2-opt.is-active .v2-opt-add { color: rgba(250,248,245,0.6); }
    .v2-opt-new { font-family: var(--font-serif); font-style: italic; font-size: 17px; }

    /* ── Photo capture (Steps 02/03) ─────────────────────────────── */
    .cap { display: flex; gap: 48px; align-items: flex-start; }
    .cap-file { display: none; }
    .cap-panel {
      position: relative; width: 300px; flex: none; aspect-ratio: 3 / 4;
      border: 1px solid var(--cream-300); border-radius: 2px;
      background: #F4EEE8; overflow: hidden;
      transition: border-color .2s var(--ease-default);
    }
    .cap-panel:hover { border-color: var(--cream-500); }
    .cap-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .cap-label { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 18px; color: var(--cream-600); }
    .cap-btn {
      background: none; border: 1px solid var(--cream-400); border-radius: 2px; cursor: pointer;
      font-weight: 500; font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--fg-2); padding: 10px 18px;
      transition: background .2s var(--ease-default), color .2s var(--ease-default), border-color .2s var(--ease-default);
    }
    .cap-btn:hover { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
    .cap-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cap-actions {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; gap: 8px; justify-content: center; padding: 14px;
      background: linear-gradient(to top, rgba(32,32,33,0.55), transparent);
    }
    .cap-panel.has-photo .cap-btn { background: rgba(250,248,245,0.92); border-color: transparent; color: var(--primary); }
    .cap-panel.has-photo .cap-btn:hover { background: var(--cream-30); }
    .cap-btn-ghost { background: transparent; border-color: rgba(250,248,245,0.5); color: var(--cream-30); }
    .cap-panel.has-photo .cap-btn-ghost { background: transparent; color: var(--cream-30); }
    .cap-panel.has-photo .cap-btn-ghost:hover { background: rgba(250,248,245,0.14); }
    .cap-scrim {
      position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
      background: rgba(250,248,245,0.82); backdrop-filter: blur(3px);
      font-family: var(--font-serif); font-style: italic; font-size: 17px; color: var(--cream-600);
      animation: rbPulse 1.4s ease-in-out infinite; text-align: center; padding: 20px;
    }
    @keyframes rbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    .cap-err { font-weight: 300; font-size: 13px; line-height: 1.6; color: #8B3A30; margin: 12px 0 0; max-width: 300px; display: none; }
    .cap-err.on { display: block; }

    .cap-read-wrap { flex: 1; min-width: 0; max-width: 380px; padding-top: 6px; }
    .cap-read-head { display: block; margin-bottom: 18px; }
    .cap-read { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--cream-300); }
    .cap-read-row { display: flex; align-items: baseline; gap: 16px; padding: 16px 2px; border-bottom: 1px solid var(--cream-300); }
    .cap-read-num { font-family: var(--font-serif); font-weight: 300; font-size: 17px; color: var(--cream-500); width: 20px; flex: none; }
    .cap-read-label { flex: 1; font-weight: 400; font-size: 14px; color: var(--foreground); }
    .cap-read-val { font-weight: 400; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream-500); text-align: right; }
    .cap-read-val.is-on { color: #AE9290; }
    .cap-read-val.is-done { color: var(--foreground); }

    /* ── Key piece (Step 04) ─────────────────────────────────────── */
    .kp { display: flex; gap: 14px; align-items: stretch; }
    .kp-drop {
      width: 168px; flex: none; overflow: hidden; position: relative;
      border: 1px dashed var(--cream-400); border-radius: 2px;
      background: #F5EFE9;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      cursor: pointer; color: var(--fg-2); padding: 20px;
      transition: border-color .2s var(--ease-default), color .2s var(--ease-default);
    }
    .kp-drop:hover { border-color: var(--cream-600); color: var(--foreground); }
    .kp-drop.has-photo { border-style: solid; padding: 0; }
    .kp-drop-text { font-weight: 400; font-size: 12px; line-height: 1.5; text-align: center; letter-spacing: 0.01em; }
    .kp-thumb { width: 100%; height: 100%; object-fit: cover; }
    .kp-textwrap {
      flex: 1; display: flex; flex-direction: column;
      border: 1px solid var(--cream-300); border-radius: 2px; background: var(--cream-30);
      padding: 18px 20px 14px; transition: border-color .2s var(--ease-default);
    }
    .kp-textwrap:focus-within { border-color: var(--cream-500); }
    .kp-text {
      flex: 1; border: none; background: none; outline: none; resize: none; min-height: 118px;
      font-family: var(--font-sans); font-weight: 300; font-size: 16px; line-height: 1.65; color: var(--foreground);
    }
    .kp-text::placeholder { color: var(--cream-500); }
    .kp-note {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--cream-300);
      font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 14px; color: var(--cream-600);
    }
    .kp-nudge { font-weight: 300; font-size: 13px; color: #8B3A30; margin: 14px 0 0; text-align: center; display: none; }
    .kp-nudge.on { display: block; }

    /* ── Narrow ──────────────────────────────────────────────────── */
    @media (max-width: 720px) {
      .cap { flex-direction: column; gap: 30px; align-items: stretch; }
      .cap > div:first-child { width: 100%; }
      .cap-panel { width: 100%; max-width: 260px; margin: 0 auto; }
      .cap-err { margin-left: auto; margin-right: auto; text-align: center; }
      .cap-read-wrap { max-width: none; width: 100%; }
    }
    @media (max-width: 560px) {
      .dk-inner { padding: 48px 24px 36px; }
      .dk-wordmark { font-size: 26px; }
      .ob-top { padding: 22px 24px 0; }
      .ob-progress { margin: 18px 24px 0; }
      .ob-body { padding: 40px 24px 34px; }
      .ob-footer { padding: 0 24px 30px; }
      .ob-step { letter-spacing: 0.1em; }
      .ob-back span:not(.ob-arrow) { display: none; }
      .ob-sub { margin-bottom: 40px; }
      .v1-hint { display: none; }
      .kp { flex-direction: column; }
      .kp-drop { width: 100%; height: 128px; flex-direction: row; }
      .kp-drop.has-photo { height: auto; aspect-ratio: 4 / 5; max-height: 380px; }
    }
  </style>
</head>
<body>

<div id="root"></div>

<script>
  const sbClient = window.supabase.createClient(
    'https://ayowpaknssulsqqvwpqx.supabase.co',
    'sb_publishable_D_iIPtp_R6kjN_711jfyTg_sFmRdpwJ'
  );

  const ROBES_ICONS = [
    'Carolyn Bessette-Kennedy', 'The Row', 'Hailey Bieber', 'Totême',
    'Jane Birkin', 'Sézane', 'Zoë Kravitz', 'Acne Studios', 'Sienna Miller',
    'Isabel Marant', 'Sofia Loren', 'Jacquemus', 'Phoebe Philo', 'Khaite',
    'The Frankie Shop', 'Audrey Hepburn', 'Lauren Hutton', 'Caroline de Maigret',
    'Charlotte Gainsbourg', 'Lemaire', 'Carolina Herrera', 'Grace Kelly',
    'Lee Radziwill',
  ];

  const STEPS = ['icons', 'colour', 'silhouette', 'keypiece'];

  const st = {
    uid: null,
    stage: 'splash',       // 'splash' | 'intro' | 'name' | 0..3 | 'done'
    name: '',
    savedName: '',
    icons: [],
    styleDna: {},
    colour: { photoUrl: '', busy: false, done: null, err: '' },   // done: {season, undertone, contrast}
    sil: { photoUrl: '', busy: false, done: null, err: '' },      // done: {body_type}
    piece: { img: '', text: '' },
    pieceStyled: false,
    doneMarked: false,
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const normalize = s => s.trim().toLowerCase().replace(/\s+/g, ' ');

  async function save(patch) {
    if (!st.uid) return;
    const { error } = await sbClient.from('profiles').update(patch).eq('id', st.uid);
    if (error) console.error('Onboarding save failed:', error.message);
  }

  const GRAIN = '<svg class="dk-grain" xmlns="http://www.w3.org/2000/svg"><filter id="dkNoise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#dkNoise)"/></svg>';

  const root = document.getElementById('root');
  let splashTimer = null;

  function go(stage) {
    st.stage = stage;
    clearTimeout(splashTimer);
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (st.stage === 'splash') return renderSplash();
    if (st.stage === 'intro') return renderIntro();
    if (st.stage === 'name') return renderName();
    if (st.stage === 'done') return renderDone();
    renderStep(st.stage);
  }

  /* ── Splash ─────────────────────────────────────────────────────── */
  function renderSplash() {
    root.innerHTML = `
      <div class="dk dk-splash">
        ${GRAIN}<div class="dk-glow"></div>
        <div class="dk-inner"><div style="text-align:center"><div class="dk-wordmark">Robes</div></div></div>
      </div>`;
    splashTimer = setTimeout(() => go('intro'), 2000);
  }

  /* ── Intro ──────────────────────────────────────────────────────── */
  function renderIntro() {
    root.innerHTML = `
      <div class="flow-anim"><div class="dk">
        ${GRAIN}<div class="dk-glow"></div>
        <div class="dk-inner">
          <p class="dk-eyebrow">An introduction</p>
          <h1 class="dk-heading">A few questions.<em>Robes builds<br>your style notes.</em></h1>
          <p class="dk-body">Your style has a signature. Robes gathers it, then builds every outfit around it — so getting dressed always feels intentional.</p>
          <div class="dk-spacer"></div>
          <div class="dk-cta"><button class="dk-btn" id="ob-begin">Begin</button></div>
        </div>
      </div></div>`;
    document.getElementById('ob-begin').onclick = () => go('name');
  }

  /* ── Name ───────────────────────────────────────────────────────── */
  function renderName() {
    root.innerHTML = `
      <div class="flow-anim"><div class="dk">
        ${GRAIN}<div class="dk-glow"></div>
        <div class="dk-inner">
          <button class="dk-back" id="ob-name-back"><span>←</span> Back</button>
          <p class="dk-eyebrow">First things first</p>
          <h1 class="dk-heading">What should<br><em>we call you?</em></h1>
          <p class="dk-sub">A name for your style notes.</p>
          <input class="dk-input" id="ob-name-input" type="text" placeholder="Your name" autocomplete="off" value="${esc(st.name)}">
          <div class="dk-spacer"></div>
          <div class="dk-cta"><button class="dk-btn" id="ob-name-next" ${st.name.trim() ? '' : 'disabled'}>Continue</button></div>
        </div>
      </div></div>`;
    const input = document.getElementById('ob-name-input');
    const next = document.getElementById('ob-name-next');
    const submit = () => {
      const val = input.value.trim();
      if (!val) return;
      st.name = val;
      const first = val.split(/\s+/)[0];
      if (first && first !== st.savedName) { st.savedName = first; save({ first_name: first }); }
      go(0);
    };
    input.oninput = () => { st.name = input.value; next.disabled = !input.value.trim(); };
    input.onkeydown = e => { if (e.key === 'Enter') submit(); };
    next.onclick = submit;
    document.getElementById('ob-name-back').onclick = () => go('intro');
    setTimeout(() => input.focus(), 360);
  }

  /* ── Working-step chrome ────────────────────────────────────────── */
  function stepChrome(i, cfg) {
    root.innerHTML = `
      <div class="flow-anim"><div class="ob-screen">
        <header class="ob-top">
          <button class="ob-back" id="ob-back"><span class="ob-arrow">←</span> <span>Back</span></button>
          <div class="ob-step">${cfg.step}</div>
          <div class="ob-count">0${i + 1} / 04</div>
        </header>
        <div class="ob-progress"><div class="ob-progress-fill" style="width:${(i + 1) / 4 * 100}%"></div></div>
        <main class="ob-body">
          <div class="ob-eyebrow">${cfg.eyebrow}</div>
          <h1 class="ob-title">${cfg.title}</h1>
          <p class="ob-sub">${cfg.sub}</p>
          <div class="ob-input-zone" id="ob-zone"></div>
        </main>
        <footer class="ob-footer">
          <button class="ob-continue" id="ob-next">${cfg.continueLabel || 'Continue'}</button>
          <button class="ob-skip" id="ob-skip">Skip for now</button>
        </footer>
      </div></div>`;
    document.getElementById('ob-back').onclick = () => go(i > 0 ? i - 1 : 'name');
  }

  function nextStage(i) { return i < STEPS.length - 1 ? i + 1 : 'done'; }

  function renderStep(i) {
    if (i === 0) return renderIcons(i);
    if (i === 1) return renderPhotoStep(i, {
      step: 'Step 02 · Colour', eyebrow: 'Colour harmony',
      title: 'Colour<br><em>harmony.</em>',
      sub: 'Upload a close-up and Robes reads your colouring — your season, undertone, contrast and the eighteen shades that are yours.',
      label: 'Your close-up', kind: 'colour', state: st.colour,
      busyMsg: 'Reading your colouring…',
      rejectMsg: 'Robes couldn’t find a face in that photo — try a clearer close-up.',
      readout: ['Season', 'Undertone', 'Contrast', 'Your eighteen shades'],
    });
    if (i === 2) return renderPhotoStep(i, {
      step: 'Step 03 · Silhouette', eyebrow: 'Silhouette &amp; proportions',
      title: 'Silhouette<br><em>&amp; proportions.</em>',
      sub: 'Upload a full-length photo and Robes reads your line — your body type, the cuts that flatter and the moves that always work on you.',
      label: 'Your full-length photo', kind: 'silhouette', state: st.sil,
      busyMsg: 'Reading your line…',
      rejectMsg: 'Robes couldn’t read a full-length figure — try a head-to-toe photo.',
      readout: ['Body line', 'Cuts that flatter', 'Signature moves'],
    });
    return renderKeyPiece(i);
  }

  /* ── Step 01 · Icons ────────────────────────────────────────────── */
  function renderIcons(i) {
    stepChrome(i, {
      step: 'Step 01 · Icons', eyebrow: 'Style',
      title: 'Who do you<br><em>dress like?</em>',
      sub: 'Add the people and brands whose style inspire you. The more you add, the faster Robes gets to know you.',
    });

    const zone = document.getElementById('ob-zone');
    zone.innerHTML = `
      <div class="v1-fieldwrap" id="ic-wrap">
        <div class="v1-field">
          <input class="v1-input" id="ic-input" placeholder="Add a name…" autocomplete="off">
          <span class="v1-hint">Press <kbd>Enter</kbd> to add</span>
        </div>
        <ul class="v2-drop" id="ic-drop" hidden></ul>
      </div>
      <div class="v1-selected-head">
        <span class="ob-label">Your icons</span>
        <span class="ob-tally" id="ic-tally"></span>
      </div>
      <div id="ic-selected"></div>
      <div class="v1-divider"></div>
      <div class="v1-pool-head"><span class="ob-label">Popular among stylists</span></div>
      <div class="chip-row" id="ic-pool"></div>`;

    const input = document.getElementById('ic-input');
    const drop = document.getElementById('ic-drop');
    let active = 0;

    const isSel = name => st.icons.some(x => normalize(x) === normalize(name));
    const add = raw => {
      const name = (raw || '').trim();
      if (!name || isSel(name)) return false;
      st.icons.push(name);
      return true;
    };

    function paintSelected() {
      document.getElementById('ic-tally').textContent = st.icons.length;
      const box = document.getElementById('ic-selected');
      if (!st.icons.length) {
        box.innerHTML = '<p class="v1-empty">Nothing yet — tap a name below or type your own.</p>';
      } else {
        box.innerHTML = '<div class="chip-row">' + st.icons.map((n, idx) =>
          `<span class="chip-solid">${esc(n)}<button class="chip-x" data-i="${idx}" aria-label="Remove ${esc(n)}">×</button></span>`).join('') + '</div>';
        box.querySelectorAll('.chip-x').forEach(btn => {
          btn.onclick = () => { st.icons.splice(Number(btn.dataset.i), 1); paintSelected(); paintPool(); };
        });
      }
    }

    function paintPool() {
      const pool = ROBES_ICONS.filter(n => !isSel(n)).slice(0, 10);
      const box = document.getElementById('ic-pool');
      box.innerHTML = pool.map(n => `<button class="chip-ghost">${esc(n)}</button>`).join('');
      box.querySelectorAll('.chip-ghost').forEach(btn => {
        btn.onclick = () => { add(btn.textContent); paintSelected(); paintPool(); };
      });
    }

    function opts() {
      const q = normalize(input.value);
      if (!q) return { matches: [], showNew: false };
      const matches = ROBES_ICONS.filter(n => !isSel(n) && normalize(n).includes(q)).slice(0, 6);
      const exact = ROBES_ICONS.some(n => normalize(n) === q);
      return { matches, showNew: !exact };
    }

    function paintDrop() {
      const { matches, showNew } = opts();
      const q = input.value.trim();
      if (!q || (!matches.length && !showNew)) { drop.hidden = true; return; }
      const total = matches.length + (showNew ? 1 : 0);
      if (active > total - 1) active = total - 1;
      if (active < 0) active = 0;
      drop.innerHTML = matches.map((n, idx) =>
        `<li class="v2-opt${idx === active ? ' is-active' : ''}" data-v="${esc(n)}"><span>${esc(n)}</span><span class="v2-opt-add">Add</span></li>`).join('') +
        (showNew ? `<li class="v2-opt v2-opt-new${active === matches.length ? ' is-active' : ''}" data-v="${esc(q)}"><span>Add “${esc(q)}”</span><span class="v2-opt-add">New</span></li>` : '');
      drop.hidden = false;
      drop.querySelectorAll('.v2-opt').forEach((li, idx) => {
        li.onmouseenter = () => { active = idx; paintDrop(); };
        li.onmousedown = e => { e.preventDefault(); commit(li.dataset.v); };
      });
    }

    function commit(val) {
      if (add(val)) { input.value = ''; active = 0; paintSelected(); paintPool(); }
      paintDrop();
    }

    input.oninput = () => { active = 0; paintDrop(); };
    input.onfocus = paintDrop;
    input.onkeydown = e => {
      const { matches, showNew } = opts();
      const total = matches.length + (showNew ? 1 : 0);
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, total - 1); paintDrop(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); paintDrop(); }
      else if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const pick = active < matches.length ? matches[active] : input.value;
        commit(pick);
      }
    };
    document.addEventListener('mousedown', function onDoc(e) {
      const wrap = document.getElementById('ic-wrap');
      if (!wrap) { document.removeEventListener('mousedown', onDoc); return; }
      if (!wrap.contains(e.target)) drop.hidden = true;
    });

    paintSelected();
    paintPool();

    const proceed = () => { if (st.icons.length) save({ style_icons: st.icons }); go(nextStage(i)); };
    document.getElementById('ob-next').onclick = proceed;
    document.getElementById('ob-skip').onclick = () => go(nextStage(i));
  }

  /* ── Steps 02/03 · Photo capture ────────────────────────────────── */
  async function fileToPayload(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
      bmp.close();
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return { mimeType: 'image/jpeg', data: dataUrl.split(',')[1], dataUrl };
    } catch (e) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const m = String(reader.result).match(/^data:(.+?);base64,(.+)$/);
          if (m) resolve({ mimeType: m[1], data: m[2], dataUrl: reader.result });
          else reject(new Error('unreadable'));
        };
        reader.onerror = () => reject(new Error('unreadable'));
        reader.readAsDataURL(file);
      });
    }
  }

  function renderPhotoStep(i, cfg) {
    stepChrome(i, cfg);
    const zone = document.getElementById('ob-zone');
    const state = cfg.state;

    function readVals() {
      if (state.busy) return cfg.readout.map(() => ({ txt: 'Reading', cls: ' is-on' }));
      if (state.done) {
        if (cfg.kind === 'colour') {
          const d = state.done;
          return [
            { txt: d.season || 'Read', cls: ' is-done' },
            { txt: d.undertone || 'Read', cls: ' is-done' },
            { txt: d.contrast || 'Read', cls: ' is-done' },
            { txt: 'Ready', cls: ' is-done' },
          ];
        }
        return [
          { txt: state.done.body_type || 'Read', cls: ' is-done' },
          { txt: 'Ready', cls: ' is-done' },
          { txt: 'Ready', cls: ' is-done' },
        ];
      }
      return cfg.readout.map(() => ({ txt: 'Awaiting', cls: '' }));
    }

    function paint() {
      const vals = readVals();
      zone.innerHTML = `
        <div class="cap">
          <div>
            <div class="cap-panel${state.photoUrl ? ' has-photo' : ''}" id="cap-panel">
              ${state.photoUrl
                ? `<img class="cap-img" src="${esc(state.photoUrl)}" alt="">
                   <div class="cap-actions">
                     <button class="cap-btn" id="cap-replace">Replace</button>
                     <button class="cap-btn cap-btn-ghost" id="cap-remove">Remove</button>
                   </div>`
                : `<div class="cap-empty">
                     <span class="cap-label">${cfg.label}</span>
                     <button class="cap-btn" id="cap-add">Add photo</button>
                   </div>`}
              ${state.busy ? `<div class="cap-scrim">${cfg.busyMsg}</div>` : ''}
            </div>
            <p class="cap-err${state.err ? ' on' : ''}" id="cap-err">${esc(state.err)}</p>
            <input type="file" accept="image/*" class="cap-file" id="cap-file">
          </div>
          <div class="cap-read-wrap">
            <span class="ob-label cap-read-head">What Robes reads</span>
            <ul class="cap-read">
              ${cfg.readout.map((r, idx) => `
                <li class="cap-read-row">
                  <span class="cap-read-num">${String(idx + 1).padStart(2, '0')}</span>
                  <span class="cap-read-label">${r}</span>
                  <span class="cap-read-val${vals[idx].cls}">${esc(vals[idx].txt)}</span>
                </li>`).join('')}
            </ul>
          </div>
        </div>`;

      const fileInput = document.getElementById('cap-file');
      const pick = () => fileInput.click();
      const addBtn = document.getElementById('cap-add');
      const repBtn = document.getElementById('cap-replace');
      const remBtn = document.getElementById('cap-remove');
      if (addBtn) addBtn.onclick = pick;
      if (repBtn) repBtn.onclick = pick;
      if (remBtn) remBtn.onclick = () => { state.photoUrl = ''; state.done = null; state.err = ''; paint(); };
      fileInput.onchange = () => onFile(fileInput);
    }

    async function onFile(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;
      state.err = '';
      let payload;
      try {
        payload = await fileToPayload(file);
      } catch (e) {
        state.err = 'Couldn’t read that image — try another file.';
        fileInput.value = '';
        if (st.stage === i) paint();
        return;
      }
      state.photoUrl = payload.dataUrl;
      state.busy = true;
      if (st.stage === i) paint();
      try {
        const [analysis, upload] = await Promise.all([
          fetch('/api/stylenotes/analyse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind: cfg.kind, data: payload.data, mimeType: payload.mimeType }),
          }).then(async r => {
            if (r.ok) return r.json();
            const body = await r.json().catch(() => ({}));
            throw new Error(body.reason || 'analysis_failed (' + r.status + ')');
          }),
          fetch('/api/wardrobe/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: payload.data, mimeType: payload.mimeType }),
          }).then(r => r.json()).catch(() => ({})),
        ]);
        if (cfg.kind === 'colour' ? analysis.no_face_detected : analysis.no_person_detected) {
          state.busy = false;
          state.photoUrl = '';
          state.err = cfg.rejectMsg;
          if (st.stage === i) paint();
          return;
        }
        const url = upload.url || null;
        if (url) state.photoUrl = url;
        const { style_dna: dnaFragment, ...render } = analysis;
        const patch = {};
        if (cfg.kind === 'colour') {
          if (dnaFragment) st.styleDna = { ...st.styleDna, color_harmony: dnaFragment };
          patch.colour_analysis = render;
          patch.style_dna = st.styleDna;
          patch.season = dnaFragment ? dnaFragment.archetype_name : render.season;
          patch.undertone = dnaFragment ? dnaFragment.verified_undertone : render.undertone;
          patch.contrast = dnaFragment ? dnaFragment.calculated_contrast : render.contrast;
          if (url) patch.headshot_url = url;
          state.done = { season: patch.season, undertone: patch.undertone, contrast: patch.contrast };
        } else {
          if (dnaFragment) st.styleDna = { ...st.styleDna, silhouette_proportions: dnaFragment };
          patch.silhouette_analysis = render;
          patch.style_dna = st.styleDna;
          patch.body_type = render.body_type;
          if (url) patch.full_length_url = url;
          state.done = { body_type: render.body_type };
        }
        save(patch);
      } catch (err) {
        console.error('Analysis failed:', err.message);
        state.err = 'Robes couldn’t read that photo just now — try again in a moment.';
      } finally {
        state.busy = false;
        fileInput.value = '';
        if (st.stage === i) paint();
      }
    }

    paint();
    document.getElementById('ob-next').onclick = () => go(nextStage(i));
    document.getElementById('ob-skip').onclick = () => go(nextStage(i));
  }

  /* ── Step 04 · Key piece ────────────────────────────────────────── */
  function renderKeyPiece(i) {
    stepChrome(i, {
      step: 'Step 04 · Key piece', eyebrow: 'A key piece',
      title: 'Style a key piece,<br><em>three ways.</em>',
      sub: 'Show Robes one piece you love — it’ll show you three ways to wear it. A little something to start with.',
      continueLabel: 'Style it three ways',
    });

    const zone = document.getElementById('ob-zone');
    zone.innerHTML = `
      <div class="kp">
        <button class="kp-drop${st.piece.img ? ' has-photo' : ''}" id="kp-drop" type="button">
          ${st.piece.img
            ? `<img class="kp-thumb" src="${esc(st.piece.img)}" alt="">`
            : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
                 <circle cx="12" cy="13" r="3.6"/>
               </svg>
               <span class="kp-drop-text">Snap or attach<br>your key piece</span>`}
        </button>
        <input type="file" accept="image/*" class="cap-file" id="kp-file">
        <div class="kp-textwrap">
          <textarea class="kp-text" id="kp-text" placeholder="Balmain waistcoat for office days, chic weekends and after dark.">${esc(st.piece.text)}</textarea>
          <div class="kp-note">An image helps, but words alone work fine.</div>
        </div>
      </div>
      <p class="kp-nudge" id="kp-nudge">Add a photo or a few words first — or skip for now.</p>`;

    const fileInput = document.getElementById('kp-file');
    document.getElementById('kp-drop').onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close();
        st.piece.img = canvas.toDataURL('image/jpeg', 0.8);
      } catch (e) {
        st.piece.img = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }
      fileInput.value = '';
      renderKeyPiece(i);
    };
    document.getElementById('kp-text').oninput = e => { st.piece.text = e.target.value; };

    document.getElementById('ob-next').onclick = () => {
      const prompt = st.piece.text.trim();
      if (!prompt && !st.piece.img) {
        document.getElementById('kp-nudge').classList.add('on');
        return;
      }
      try {
        sessionStorage.setItem('rb_onboard_piece', JSON.stringify({ prompt, photo: st.piece.img || null }));
        st.pieceStyled = true;
      } catch (e) {
        try {
          sessionStorage.setItem('rb_onboard_piece', JSON.stringify({ prompt, photo: null }));
          st.pieceStyled = true;
        } catch (e2) { st.pieceStyled = false; }
      }
      go('done');
    };
    document.getElementById('ob-skip').onclick = () => go('done');
  }

  /* ── Done ───────────────────────────────────────────────────────── */
  function renderDone() {
    if (!st.doneMarked) {
      st.doneMarked = true;
      try { sessionStorage.setItem('rb_onboarded', '1'); } catch (e) {}
      save({ onboarded_at: new Date().toISOString() });
    }
    const first = st.name.trim().split(/\s+/)[0];
    const sub = st.pieceStyled
      ? 'Robes is ready to style your piece three ways — it’ll meet you inside.'
      : 'Your style notes will keep growing as Robes gets to know you.';
    root.innerHTML = `
      <div class="flow-anim"><div class="done-screen">
        ${GRAIN}<div class="dk-glow"></div>
        <p class="done-eyebrow">Your style notes are ready</p>
        <h1 class="done-title">${first ? `Welcome in,<br><em>${esc(first)}.</em>` : 'Welcome in.'}</h1>
        <p class="done-sub">${sub}</p>
        <button class="done-restart" id="ob-enter">${st.pieceStyled ? 'See it styled' : 'Let’s get started'}</button>
        <div class="done-dots">${'<span class="done-dot on"></span>'.repeat(4)}</div>
      </div></div>`;
    document.getElementById('ob-enter').onclick = () => { window.location.href = '/dashboard'; };
  }

  /* ── Boot ───────────────────────────────────────────────────────── */
  (async function init() {
    render();

    const session = await new Promise(resolve => {
      let settled = false;
      const finish = s => { if (!settled) { settled = true; resolve(s); } };
      sbClient.auth.onAuthStateChange((_, s) => finish(s));
      sbClient.auth.getSession().then(({ data: { session: s } }) => finish(s));
      setTimeout(() => finish(null), 5000);
    });
    if (!session) { window.location.href = '/signup.html'; return; }
    st.uid = session.user.id;

    const meta = session.user.user_metadata || {};
    const metaName = meta.first_name || meta.given_name || String(meta.full_name || meta.name || '').split(/\s+/)[0] || '';

    const { data: profile } = await sbClient.from('profiles')
      .select('first_name, style_icons, style_dna').eq('id', st.uid).single();
    if (profile) {
      if (profile.first_name) st.savedName = profile.first_name;
      if (profile.style_icons && profile.style_icons.length) st.icons = profile.style_icons;
      if (profile.style_dna && typeof profile.style_dna === 'object') st.styleDna = profile.style_dna;
    }
    if (!st.name) st.name = st.savedName || metaName;

    if (st.stage === 'name') render();
  })();
</script>

</body>
</html>
