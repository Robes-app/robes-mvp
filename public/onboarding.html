<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome — Robes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/tokens.css">
<style>
    :root {
      --background: var(--cream);
      --foreground: var(--ink);
      --primary: var(--ink);
      --accent: var(--mauve);
      --muted: #E8D5D2;
      --cream-30: var(--cream);
      /* --cream-300 / --cream-400 come from tokens.css. They were redeclared
         here as var(--cream-300) / var(--cream-400) — a self-reference cycle,
         which computes to the guaranteed-invalid value, so every rule reading
         them was invalid at computed-value time and fell back to unset. That
         silently removed EVERY hairline in the flow (field, chips, dropdown,
         progress track, capture panels) — border-style resolved to none.
         Never re-alias a name tokens.css already defines. */
      --cream-500: #C4B8A4;
      --cream-600: var(--ink-faint);
      --fg-2: var(--cream-600);
      --font-serif: 'Cormorant', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--primary); }
    body { font-family: var(--font-sans); font-weight: 300; color: var(--foreground); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }

    .flow-anim { animation: flowFade .44s var(--ease-default) both; }
    @keyframes flowFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* ── Dark intro shell (splash · intro · name · done) ─────────── */
    .dk {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--primary); color: var(--cream-30); overflow: hidden;
    }
    .dk-glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(212,200,196,0.14) 0%, transparent 64%); }
    .dk-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.05; pointer-events: none; }
    .dk-inner { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 720px; margin: 0 auto; padding: 64px 64px 48px; }

    .dk-splash { animation: splashFade .8s var(--ease-default) both; }
    @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }
    .dk-splash .dk-inner { align-items: center; justify-content: center; }
    .dk-wordmark { font-family: var(--font-serif); font-weight: 300; font-size: 30px; letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase; color: var(--cream-30); }
    .dk-splash-sub { margin-top: 22px; font-weight: 400; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(250,248,245,0.32); }

    .dk-eyebrow { font-weight: 500; font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(250,248,245,0.34); margin: 0 0 28px; }
    .dk-heading { font-family: var(--font-serif); font-weight: 300; font-size: clamp(40px, 7vw, 60px); line-height: 1.05; letter-spacing: -0.01em; color: var(--cream-30); margin: 0 0 28px; }
    .dk-heading em { font-style: italic; color: var(--accent); display: block; }
    .dk-body { font-weight: 300; font-size: 16px; line-height: 1.75; color: rgba(250,248,245,0.55); max-width: 400px; margin: 0; }
    .dk-sub { font-weight: 400; font-size: 13px; color: rgba(250,248,245,0.34); margin: 0 0 56px; letter-spacing: 0.01em; }

    .dk-input {
      font-family: var(--font-serif); font-weight: 300; font-size: 32px; letter-spacing: -0.01em;
      color: var(--cream-30); background: transparent; border: none;
      border-bottom: 1px solid rgba(250,248,245,0.15); outline: none; width: 100%;
      padding: 8px 0 18px; transition: border-color .2s var(--ease-default);
    }
    .dk-input:focus { border-bottom-color: rgba(250,248,245,0.5); }
    .dk-input::placeholder { color: rgba(212,200,196,0.3); }

    .dk-spacer { flex: 1; min-height: 40px; }
    .dk-cta { margin-top: auto; padding-top: 32px; }
    .dk-btn {
      width: 100%; padding: 19px 24px; background: rgba(250,248,245,0.08); color: var(--cream-30);
      font-weight: 500; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid rgba(250,248,245,0.14); border-radius: 100px; cursor: pointer;
      transition: background .2s var(--ease-default), opacity .15s var(--ease-default);
    }
    .dk-btn:hover { background: rgba(250,248,245,0.16); }
    .dk-btn:disabled { opacity: 0.28; cursor: not-allowed; }
    .dk-back {
      background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 40px;
      display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
      font-weight: 500; font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(250,248,245,0.4); transition: color .2s var(--ease-default);
    }
    .dk-back:hover { color: var(--cream-30); }

    /* ── Completion ──────────────────────────────────────────────── */
    .done-screen {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 64px 28px; background: var(--primary); color: var(--cream-30);
      position: relative; overflow: hidden;
    }
    .done-eyebrow { position: relative; z-index: 2; font-weight: 500; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--accent); margin: 0 0 30px; }
    .done-title { position: relative; z-index: 2; font-family: var(--font-serif); font-weight: 300; font-size: clamp(40px, 8vw, 66px); line-height: 1.04; letter-spacing: -0.01em; margin: 0 0 24px; max-width: 16ch; }
    .done-title em { font-style: italic; color: var(--accent); }
    .done-sub { position: relative; z-index: 2; font-weight: 300; font-size: 16px; line-height: 1.7; color: rgba(250,248,245,0.55); max-width: 420px; margin: 0 0 44px; }
    .done-restart {
      position: relative; z-index: 2; background: none; border: 1px solid rgba(250,248,245,0.18); border-radius: 100px; cursor: pointer;
      font-weight: 500; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--cream-30); padding: 16px 34px; transition: background .2s var(--ease-default), color .2s var(--ease-default);
    }
    .done-restart:hover { background: var(--cream-30); color: var(--primary); }
    .done-dots { position: relative; z-index: 2; display: flex; gap: 8px; margin-top: 52px; }
    .done-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(250,248,245,0.22); }
    .done-dot.on { background: var(--accent); }

    /* ── Working-step chrome (cream) ─────────────────────────────── */
    .ob-screen { background: var(--background); color: var(--foreground); display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    .ob-top { display: flex; align-items: center; justify-content: space-between; padding: 30px 64px 0; }
    .ob-back {
      background: none; border: none; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 500; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);
      transition: color .2s var(--ease-default);
    }
    .ob-back:hover { color: var(--foreground); }
    .ob-arrow { font-size: 15px; }
    .ob-step { font-weight: 500; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--foreground); white-space: nowrap; }
    .ob-top-spacer { width: 44px; flex: none; }
    .ob-progress { height: 2px; background: var(--cream-200); margin: 24px 64px 0; position: relative; }
    .ob-progress-fill { position: absolute; left: 0; top: 0; height: 2px; background: var(--foreground); transition: width .4s var(--ease-default); }

    .ob-body { flex: 1; padding: 46px 64px 44px; max-width: 860px; width: 100%; margin: 0 auto; }
    .ob-eyebrow { font-weight: 400; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 14px; color: var(--ink-faint); }
    .ob-title { font-family: var(--font-serif); font-weight: 300; font-size: clamp(32px, 4.6vw, 42px); line-height: 1.05; letter-spacing: -0.01em; margin: 0; color: var(--foreground); }
    .ob-title em { font-style: italic; }
    .ob-sub { font-weight: 300; font-size: clamp(14px, 1.7vw, 16px); line-height: 1.7; color: var(--fg-2); max-width: 560px; margin: 18px 0 0; }
    .ob-input-zone { margin-top: 28px; }

    .ob-footer { padding: 0 64px 38px; max-width: 860px; width: 100%; margin: 0 auto; }
    .ob-continue {
      width: 100%; background: var(--primary); color: var(--background);
      border: none; border-radius: 100px; cursor: pointer;
      font-weight: 400; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; padding: 23px;
      transition: opacity .2s var(--ease-default);
    }
    .ob-continue:hover { opacity: .9; }
    .ob-skip {
      display: block; margin: 20px auto 0; background: none; border: none; cursor: pointer;
      font-weight: 300; font-size: 13px; color: var(--fg-2);
      transition: color .2s var(--ease-default);
    }
    .ob-skip:hover { color: var(--foreground); }

    .ob-label { font-weight: 500; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-600); white-space: nowrap; }
    .ob-tally { font-family: var(--font-serif); font-weight: 400; font-size: 17px; color: var(--cream-500); }

    /* ── Archetype cards (Step 01 · Archetype first) ─────────────── */
    /* The archetypes are the FIRST decision on the step; a card prints its
       descriptor only once selected. Selected state is the app-wide warm
       cream #F3EFE6 / #C9BCA6 convention. */
    .ac-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ac-card {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      padding: 13px 16px; text-align: left; cursor: pointer;
      background: #fff; border: 1px solid var(--rule); border-radius: var(--rad-sm);
      font-family: inherit; color: var(--foreground);
      transition: background .2s var(--ease-default), border-color .2s var(--ease-default);
    }
    .ac-card:hover { border-color: var(--cream-400); }
    .ac-card.on { background: #F3EFE6; border-color: #C9BCA6; }
    .ac-copy { display: flex; flex-direction: column; min-width: 0; }
    .ac-name { font-family: var(--font-serif); font-weight: 400; font-size: 18px; line-height: 1.15; }
    .ac-desc { font-weight: 300; font-size: 12px; line-height: 1.45; color: var(--ink-soft); text-wrap: pretty; margin-top: 4px; }
    .ac-mark {
      flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: var(--foreground); border: 1px solid var(--rule-mid);
      transition: background .2s var(--ease-default), border-color .2s var(--ease-default);
    }
    .ac-card.on .ac-mark { background: #E4DAC6; border-color: #C9BCA6; }

    /* Icons and brands sit below the archetypes as a refinement, behind a
       hairline — no longer the step's headline question. */
    .ic-refine { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--rule); }
    .ic-refine-head { margin-bottom: 12px; }

    /* ── Chips + typeahead (Step 01) ─────────────────────────────── */
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip-ghost {
      font-weight: 400; font-size: 14px; color: var(--foreground); background: var(--cream-30);
      border: 1px solid var(--cream-300); border-radius: 100px;
      padding: 11px 18px; line-height: 1; cursor: pointer;
      transition: background .2s var(--ease-default), color .2s var(--ease-default), border-color .2s var(--ease-default);
    }
    /* No ink fills on this step's chips — the system reserves the single
       ink fill for Continue. A chosen token wears the warm selected fill,
       and the pool hover previews it. */
    .chip-ghost:hover { background: #F3EFE6; border-color: #C9BCA6; }
    .chip-plus { color: var(--cream-500); margin-right: 8px; font-size: 13px; transition: color .2s var(--ease-default); }
    .chip-ghost:hover .chip-plus { color: var(--ink-faint); }
    .chip-solid {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 400; font-size: 14px; color: var(--foreground); background: #F3EFE6;
      border: 1px solid #C9BCA6; border-radius: 100px;
      padding: 11px 14px 11px 18px; line-height: 1;
    }
    .chip-x {
      background: none; border: none; cursor: pointer; padding: 0;
      width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-faint); font-size: 17px; line-height: 1;
      transition: color .2s var(--ease-default);
    }
    .chip-x:hover { color: var(--foreground); }

    /* ONE field, ONE pool: the chosen icons live as chips INSIDE the field
       (never a second "Your icons" shelf below it), the helper row under it
       carries how-to on the left and where-you-are on the right, and the
       pool is the only other thing on the screen. */
    .v1-fieldwrap { position: relative; }
    .v1-field {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; cursor: text;
      border: 1px solid var(--rule-mid); border-radius: var(--rad-sm); background: #fff;
      padding: 8px 10px; margin-bottom: 11px;
      transition: border-color .2s var(--ease-default);
    }
    /* The field IS the focus target — the chips and the input share it, so the
       indicator belongs on the wrapper. The input keeps its own ring
       suppressed (the page's :focus-visible rule would otherwise draw a
       second, heavier box just inside this border). */
    .v1-field:focus-within { border-color: var(--foreground); box-shadow: inset 0 0 0 1px var(--foreground); }
    .v1-input:focus, .v1-input:focus-visible { outline: none; }
    .ic-chips { display: contents; }
    .v1-field .chip-solid { font-size: 13px; padding: 9px 10px 9px 15px; }
    .v1-input {
      flex: 1 1 180px; min-width: 140px; border: none; background: none; outline: none;
      font-family: var(--font-sans); font-weight: 300; font-size: 16px;
      color: var(--foreground); padding: 11px 10px;
    }
    .v1-input::placeholder { color: var(--cream-500); }
    .ic-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .v1-hint { font-size: 11px; color: var(--cream-500); white-space: nowrap; }
    .v1-hint kbd { font-family: var(--font-sans); font-size: 10px; border: 1px solid var(--cream-300); border-radius: 2px; padding: 2px 6px; color: var(--fg-2); }
    .ic-tally { font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--cream-500); white-space: nowrap; }
    .v1-pool-head { margin-bottom: 16px; }

    .v2-drop {
      list-style: none; margin: 7px 0 0; padding: 6px; position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
      background: var(--cream-30); border: 1px solid var(--cream-300); border-radius: var(--rad-sm);
    }
    .v2-opt {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 4px; cursor: pointer;
      font-weight: 300; font-size: 15px; color: var(--foreground);
    }
    .v2-opt.is-active { background: var(--foreground); color: var(--background); }
    .v2-opt-add { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream-500); }
    .v2-opt.is-active .v2-opt-add { color: rgba(250,248,245,0.6); }
    .v2-opt-new { font-family: var(--font-serif); font-style: italic; font-size: 17px; }

    /* ── Photo capture (Steps 02/03) ─────────────────────────────── */
    .cap { display: flex; gap: 48px; align-items: flex-start; }
    .cap-file { display: none; }
    .cap-panel {
      position: relative; width: 300px; flex: none; aspect-ratio: 3 / 4;
      border: 1px solid var(--cream-300); border-radius: var(--rad-sm);
      background: #F4EEE8; overflow: hidden;
      transition: border-color .2s var(--ease-default);
    }
    .cap-panel:hover { border-color: var(--cream-500); }
    .cap-panel.drag-over { border-color: var(--foreground); background: var(--cream-30); }
    .cap-guide { font-weight: 300; font-size: 11px; line-height: 1.6; color: var(--cream-500); margin: 12px 0 0; max-width: 300px; }
    .cap-privacy { font-weight: 300; font-size: 11px; line-height: 1.6; color: var(--cream-500); font-style: italic; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--cream-300); max-width: 300px; }
    .cap-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .cap-label { font-family: var(--font-serif); font-style: italic; font-weight: 300; font-size: 18px; color: var(--cream-600); }
    .cap-btn {
      background: none; border: 1px solid var(--cream-400); border-radius: 100px; cursor: pointer;
      font-weight: 500; font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--fg-2); padding: 10px 18px;
      transition: background .2s var(--ease-default), color .2s var(--ease-default), border-color .2s var(--ease-default);
    }
    .cap-btn:hover { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
    .cap-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cap-actions {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; gap: 8px; justify-content: center; padding: 14px;
      background: linear-gradient(to top, rgba(32,32,33,0.55), transparent);
    }
    .cap-panel.has-photo .cap-btn { background: rgba(250,248,245,0.92); border-color: transparent; color: var(--primary); }
    .cap-panel.has-photo .cap-btn:hover { background: var(--cream-30); }
    .cap-btn-ghost { background: transparent; border-color: rgba(250,248,245,0.5); color: var(--cream-30); }
    .cap-panel.has-photo .cap-btn-ghost { background: transparent; color: var(--cream-30); }
    .cap-panel.has-photo .cap-btn-ghost:hover { background: rgba(250,248,245,0.14); }
    .cap-scrim {
      position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
      background: rgba(250,248,245,0.82); backdrop-filter: blur(3px);
      font-family: var(--font-serif); font-style: italic; font-size: 17px; color: var(--cream-600);
      animation: rbPulse 1.4s ease-in-out infinite; text-align: center; padding: 20px;
    }
    @keyframes rbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    .cap-err { font-weight: 300; font-size: 13px; line-height: 1.6; color: #8B3A30; margin: 12px 0 0; max-width: 300px; display: none; }
    .cap-err.on { display: block; }

    .cap-read-wrap { flex: 1; min-width: 0; max-width: 380px; padding-top: 6px; }
    .cap-read-head { display: block; margin-bottom: 18px; }
    .cap-read { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--cream-300); }
    .cap-read-row { display: flex; align-items: baseline; gap: 16px; padding: 16px 2px; border-bottom: 1px solid var(--cream-300); }
    .cap-read-num { font-family: var(--font-serif); font-weight: 300; font-size: 17px; color: var(--cream-500); width: 20px; flex: none; }
    /* Labels follow the page's label convention (.ob-label register); the
       generated reading keeps the serif so the output visibly stands apart. */
    .cap-read-label { flex: 1; font-weight: 500; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-600); align-self: center; }
    .cap-read-val { font-family: var(--font-serif); font-weight: 300; font-size: 17px; color: var(--cream-500); text-align: right; }
    .cap-read-val.is-on { color: var(--ink-faint); font-style: italic; }
    .cap-read-val.is-done { color: var(--foreground); }

    /* ── Key piece (Step 04) ─────────────────────────────────────── */
    .kp-scan {
      position: absolute; left: 0; right: 0; top: 2%; height: 2px; z-index: 4;
      background: linear-gradient(90deg, transparent, rgba(250,248,245,0.95), transparent);
      box-shadow: 0 0 18px 4px rgba(250,248,245,0.35);
      animation: kpScan 1.9s ease-in-out infinite;
    }
    @keyframes kpScan { 0% { top: 2%; } 50% { top: 96%; } 100% { top: 2%; } }
    .kp-reading {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 16px 14px;
      text-align: center; font-family: var(--font-serif); font-style: italic; font-size: 15px;
      color: var(--cream-30); background: linear-gradient(to top, rgba(32,32,33,0.6), transparent);
      animation: rbPulse 1.4s ease-in-out infinite;
    }
    .kp-tags { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .kp-tag {
      position: absolute; display: inline-flex; align-items: center; gap: 7px;
      background: rgba(250,248,245,0.94); border: 1px solid var(--cream-300); border-radius: 100px;
      padding: 6px 10px; font-weight: 500; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--foreground); white-space: nowrap; max-width: 84%; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 2px 10px rgba(32,32,33,0.18);
      opacity: 0; animation: kpTagPop .5s var(--ease-default) both;
    }
    .kp-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #AE9290; flex: none; }
    @keyframes kpTagPop {
      from { opacity: 0; transform: translateY(6px) scale(0.7); }
      60% { opacity: 1; transform: translateY(0) scale(1.04); }
      to { opacity: 1; transform: none; }
    }
    .kp-banner {

    const drop = document.getElementById('ic-drop');

    function syncSkip() {

    function paintArch() {

      const name = (raw || '').trim();

    function paintSelected() {
      const n = st.icons.length;

    // The pool leads with names seeded by her picked archetypes, then the
    // house list fills the rest — the refinement follows the decision.
    function poolSource() {
      const out = [];
      const push = n => { if (!out.some(x => normalize(x) === normalize(n))) out.push(n); };
      st.archetypes.forEach(a => (ARCH_SEED[a] || []).forEach(push));
      ROBES_ICONS.forEach(push);

    function paintPool() {
      const pool = poolSource().filter(n => !isSel(n)).slice(0, 10);
      const box = document.getElementById('ic-pool');
      box.innerHTML = pool.map(n =>
        `<button class="chip-ghost" data-v="${esc(n)}"><span class="chip-plus">+</span>${esc(n)}</button>`).join('');

      const q = normalize(input.value);
      if (!q) return { matches: [], showNew: false };
      const source = poolSource();
      const matches = source.filter(n => !isSel(n) && normalize(n).includes(q)).slice(0, 6);
      const exact = source.some(n => normalize(n) === q);
      return { matches, showNew: !exact };
    }

    function paintDrop() {
      const { matches, showNew } = opts();
      const q = input.value.trim();
      if (!q || (!matches.length && !showNew)) { drop.hidden = true; return; }
      const total = matches.length + (showNew ? 1 : 0);
      if (active > total - 1) active = total - 1;
      if (active < 0) active = 0;
      drop.innerHTML = matches.map((n, idx) =>
        `<li class="v2-opt${idx === active ? ' is-active' : ''}" data-v="${esc(n)}"><span>${esc(n)}</span><span class="v2-opt-add">Add</span></li>`).join('') +

      drop.hidden = false;

        // detached the li mid-tap on touch devices, so the follow-up
        // mousedown never landed and tapping a suggestion did nothing

        li.onmouseenter = () => {

        };

      if (add(val)) { input.value = ''; active = 0; paintSelected(); paintPool(); }

        e.preventDefault();

      // only write when there is something to record or clear, and merge so
      // an analysis-derived DNA fragment is never dropped.
      const prev = (st.styleDna && st.styleDna.style_archetypes) || [];
      if (st.archetypes.length || prev.length) {
        st.styleDna = Object.assign({}, st.styleDna, { style_archetypes: st.archetypes.slice() });
        save({ style_dna: st.styleDna });
      }
      go(nextStage(i));
    };
    document.getElementById('ob-next').onclick = proceed;
    document.getElementById('ob-skip').onclick = () => go(nextStage(i));
  }

  /* ── Steps 02/03 · Photo capture ────────────────────────────────── */
  // Wire desktop drag-and-drop onto any drop zone, routing the dropped file
  // through the same handler as the file input.
  function wireDrop(el, onDropFile) {
    if (!el || el._rbDropWired) return;
    el._rbDropWired = true;
    ['dragenter', 'dragover'].forEach(ev => el.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); el.classList.add('drag-over');
    }));
    ['dragleave', 'dragend'].forEach(ev => el.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
    }));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && (/^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name))) onDropFile(f);
    });
  }

  async function fileToPayload(file) {
    // A format the browser can paint in an <img> without transcoding.
    const renderableType = t => /^image\/(jpe?g|png|webp|gif|bmp|avif)$/i.test(t || '');
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
      bmp.close();
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return { mimeType: 'image/jpeg', data: dataUrl.split(',')[1], dataUrl, renderable: true };
    } catch (e) {
      // createImageBitmap can't decode HEIC/HEIF outside Safari — the raw data
      // URL still carries the bytes Gemini needs, but it can't be previewed in
      // an <img>. Flag it so callers show the hosted (transcoded) copy instead.
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const m = String(reader.result).match(/^data:(.+?);base64,(.+)$/);
          if (m) resolve({ mimeType: m[1], data: m[2], dataUrl: reader.result, renderable: renderableType(m[1]) });
          else reject(new Error('unreadable'));
        };
        reader.onerror = () => reject(new Error('unreadable'));
        reader.readAsDataURL(file);
      });
    }
  }

  /* renderPhotoStep (the removed colour/silhouette photo capture) was
     deleted in the Wave 5 sweep — Style Notes owns photo capture now.
     KP_SPOTS/KP_READ stayed in use by renderKeyPiece below and are
     restored here after the sweep took them along with it. */
  const KP_SPOTS = [
    { top: '10%', left: '8%' },
    { top: '30%', right: '8%' },
    { top: '52%', left: '10%' },
    { top: '68%', right: '12%' },
  ];
  const KP_READ = ['The piece', 'Category', 'Brand', 'Colour', 'Cut'];

  function renderKeyPiece(i) {
    const P = st.piece;
    // var, not let: paint() calls syncSkip() and runs BEFORE the skip wiring
    // at the foot of this function — a let here would be in the temporal
    // dead zone on that first call (the trap that once broke the dashboard).
    var skipArmed = false;

    // Same rule as step 01: once she has answered — a photo attached, a piece
    // filed — skipping is no longer on offer, so Continue is the only way
    // forward. Removing the photo (or an unreadable one clearing itself)
    // gives the skip back, disarmed.
    function syncSkip() {
      const skip = document.getElementById('ob-skip');
      if (!skip) return;
      const answered = !!(P.img || P.tag);
      skip.style.display = answered ? 'none' : '';
      if (answered) { skipArmed = false; skip.textContent = 'Skip for now'; }
    }

    // Header mirrors step 01's archetype-first register: the eyebrow repeats
    // the step label's section word, the headline closes on the serif-italic
    // accent — no style deviation across the two steps.
    stepChrome(i, {
      step: 'Step 02 · Wardrobe', eyebrow: 'Wardrobe',
      title: 'Add your <em>first piece.</em>',
      sub: 'Give Robes one piece you love — from your wardrobe, or you might be wearing it right now. This is where your wardrobe starts.',
      continueLabel: P.tag ? 'Continue to your dashboard' : 'Style my first piece',
    });

    function kpChips() {
      if (!P.tag) return [];
      const dna = P.tag.item_dna || {};
      const chips = [];
      if (P.tag.category) chips.push(P.tag.category);
      const colour = (dna.display && dna.display.editorial_color_name) || P.tag.color;
      if (colour) chips.push(colour);
      if (P.tag.brand) chips.push(P.tag.brand);
      ((dna.structural_dna && dna.structural_dna.silhouette_fit) || []).forEach(f => {
        if (chips.length < KP_SPOTS.length) chips.push(f);
      });
      return chips;
    }

    function doneVals() {
      const dna = P.tag.item_dna || {};
      const fit = (dna.structural_dna && dna.structural_dna.silhouette_fit) || [];
      return [
        { txt: P.tag.label || 'Read', cls: ' is-done' },
        { txt: P.tag.category || 'Read', cls: ' is-done' },
        { txt: P.tag.brand || (dna.display && dna.display.brand_raw) || 'Unlabelled', cls: ' is-done' },
        { txt: (dna.display && dna.display.editorial_color_name) || P.tag.color || 'Read', cls: ' is-done' },
        { txt: fit.slice(0, 2).join(' · ') || 'Read', cls: ' is-done' },
      ];
    }

    function readVals() {
      if (P.busy) return KP_READ.map(() => ({ txt: 'Reading', cls: ' is-on' }));
      if (P.tag) {
        const finals = doneVals();
        // During the staggered "filing" reveal, rows past the cursor still read
        // as being processed so the categorisation feels perceptible.
        if (P.revealing) return finals.map((v, idx) =>
          idx < P.revealCount ? v : { txt: 'Reading', cls: ' is-on' });
        return finals;
      }
      return KP_READ.map(() => ({ txt: 'Awaiting', cls: '' }));
    }

    // Reveal the five filed fields one at a time (Piece → Category → Brand →
    // Colour → Cut) so the user sees Robes "reading" the garment. Surgically
    // updates the value spans, so the tag-pop animation isn't restarted.
    function revealLedger() {
      const finals = doneVals();
      const stepMs = 480;
      P.revealing = true;
      P.revealCount = 0;
      const apply = () => {
        const spans = document.querySelectorAll('#ob-zone .cap-read-val');
        spans.forEach((sp, idx) => {
          const done = idx < P.revealCount;
          sp.textContent = done ? finals[idx].txt : 'Reading';
          sp.className = 'cap-read-val' + (done ? ' is-done' : ' is-on');
        });
      };
      apply();
      const tick = () => {
        if (st.stage !== i) { P.revealing = false; return; }
        P.revealCount++;
        apply();
        if (P.revealCount < finals.length) setTimeout(tick, stepMs);
        else P.revealing = false;
      };
      setTimeout(tick, 280);
      return 0.28 + finals.length * (stepMs / 1000);
    }

    function popTags(animated) {
      const box = document.getElementById('kp-tags');
      if (!box || !P.tag) return 0;
      const chips = kpChips();
      box.innerHTML = chips.map((c, idx) => {
        const s = KP_SPOTS[idx];
        const pos = `top:${s.top};` + (s.left ? `left:${s.left};` : `right:${s.right};`);
        return `<span class="kp-tag" style="${pos}animation-delay:${animated ? (0.15 + idx * 0.4).toFixed(2) : 0}s">${esc(c)}</span>`;
      }).join('') + (P.tag.label
        ? `<span class="kp-banner" style="animation-delay:${animated ? (0.35 + chips.length * 0.4).toFixed(2) : 0}s">${esc(P.tag.label)}</span>`
        : '');
      return chips.length;
    }

    function paint() {
      const zone = document.getElementById('ob-zone');
      if (!zone) return;
      syncSkip();
      const vals = readVals();
      zone.innerHTML = `
        <div class="cap">
          <div>
            <div class="cap-panel${P.img ? ' has-photo' : ''}" id="kp-panel">
              ${P.img
                ? `<img class="cap-img" src="${esc(P.renderable === false ? (P.url || P.img) : P.img)}" alt="">
                   <div class="kp-tags" id="kp-tags"></div>
                   ${P.busy ? '<div class="kp-scan"></div><div class="kp-reading">Reading your piece…</div>' : ''}
                   ${!P.busy && !P.tag ? `<div class="cap-actions">
                       <button class="cap-btn" id="kp-replace">Replace</button>
                       <button class="cap-btn cap-btn-ghost" id="kp-remove">Remove</button>
                     </div>` : ''}`
                : `<div class="cap-empty">
                     <span class="cap-label">Your key piece</span>
                     <button class="cap-btn" id="kp-add">Add photo</button>
                   </div>`}
            </div>
            <p class="cap-err${P.err ? ' on' : ''}">${esc(P.err)}</p>
            <input type="file" accept="image/*" class="cap-file" id="kp-file">
          </div>
          <div class="cap-read-wrap">
            <span class="ob-label cap-read-head">What Robes files</span>
            <ul class="cap-read">
              ${KP_READ.map((r, idx) => `
                <li class="cap-read-row">
                  <span class="cap-read-num">${String(idx + 1).padStart(2, '0')}</span>
                  <span class="cap-read-label">${r}</span>
                  <span class="cap-read-val${vals[idx].cls}">${esc(vals[idx].txt)}</span>
                </li>`).join('')}
            </ul>
          </div>
        </div>
        <p class="kp-nudge" id="kp-nudge">Add a photo of your piece first — or skip for now.</p>`;

      const fileInput = document.getElementById('kp-file');
      const pick = () => fileInput.click();
      const addBtn = document.getElementById('kp-add');
      const repBtn = document.getElementById('kp-replace');
      const remBtn = document.getElementById('kp-remove');
      if (addBtn) addBtn.onclick = pick;
      if (repBtn) repBtn.onclick = pick;
      if (remBtn) remBtn.onclick = () => { P.img = ''; P.data = ''; P.url = ''; P.err = ''; P.renderable = true; paint(); };
      fileInput.onchange = () => { handleFile(fileInput.files[0]); fileInput.value = ''; };
      wireDrop(document.getElementById('kp-panel'), handleFile);
      if (P.tag && !P.busy && !P.revealing) popTags(false);
    }

    async function handleFile(file) {
      if (!file) return;
      let payload;
      try {
        payload = await fileToPayload(file);
      } catch (e) {
        P.err = 'Couldn’t read that image — try another file.';
        if (st.stage === i) paint();
        return;
      }
      P.img = payload.dataUrl;
      P.data = payload.data;
      P.mimeType = payload.mimeType;
      P.renderable = payload.renderable !== false;
      P.url = '';
      P.err = '';
      if (st.stage === i) paint();
      // Auto-scan the moment a photo lands — no "Catalogue this piece" tap
      // needed. The CTA still triggers catalogue() as a fallback / to carry
      // on to the dashboard once a piece is filed.
      catalogue();
    }

    async function catalogue() {
      if (P.busy) return;
      if (P.tag) {
        // Give the wardrobe insert a beat to settle so the handoff carries
        // cataloged:true — otherwise the dashboard's legacy persist path can
        // file the same piece twice (the duplicate piece nº 1 race).
        if (!P.saved && P.savePromise) {
          const cta = document.getElementById('ob-next');
          if (cta) { cta.disabled = true; cta.textContent = 'Filing your piece…'; }
          try { await Promise.race([P.savePromise, new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
        }
        writeHandoff();
        // No done screen — the dashboard's "Your piece, styled" card is the
        // arrival moment now.
        const goCta = document.getElementById('ob-next');
        if (goCta) { goCta.disabled = true; goCta.textContent = 'Opening your dashboard…'; }
        finishToDashboard(); return;
      }
      if (!P.img || !P.data) {
        const nudge = document.getElementById('kp-nudge');
        if (nudge) nudge.classList.add('on');
        return;
      }
      P.err = '';
      P.busy = true;
      paint();
      const next = document.getElementById('ob-next');
      if (next) { next.disabled = true; next.textContent = 'Reading your piece…'; }

      const analyse = () => fetch('/api/wardrobe/analyse', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: P.data, mimeType: P.mimeType, userId: st.uid || undefined }),
      }).then(r => r.ok ? r.json() : null).catch(() => null);

      let [tag, up] = await Promise.all([
        analyse(),
        fetch('/api/wardrobe/upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: P.data, mimeType: P.mimeType }),
        }).then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      if (!tag || tag.analysisFailed || (!tag.noItemDetected && !tag.label)) {
        await new Promise(r => setTimeout(r, 1500));
        tag = (await analyse()) || tag;
      }

      P.busy = false;
      const nx = document.getElementById('ob-next');

      if (tag && tag.noItemDetected) {
        P.img = ''; P.data = ''; P.url = '';
        P.err = 'Robes couldn’t find a piece in that photo — try a clear shot of the garment.';
        if (nx) { nx.disabled = false; nx.textContent = 'Style my first piece'; }
        if (st.stage === i) paint();
        return;
      }
      if (!tag || tag.analysisFailed || !tag.label) {
        P.err = 'Robes couldn’t read that piece just now — try again in a moment.';
        if (nx) { nx.disabled = false; nx.textContent = 'Style my first piece'; }
        if (st.stage === i) paint();
        return;
      }

      P.tag = tag;
      if (up && up.url) P.url = up.url;
      const row = {
        user_id: st.uid,
        label: tag.label,
        category: tag.category || 'Other',
        category_l2: tag.category_l2 || null,
        category_l3: tag.category_l3 || null,
        color: tag.color || null,
        brand: tag.brand || null,
        notes: tag.notes || null,
        image_url: P.url || null,
        item_dna: tag.item_dna || {},
      };
      P.savePromise = sbClient.from('wardrobe_items').insert(row).then(({ error }) => {
        if (error && /category_l|column/i.test(error.message || '')) {
          // Migration 15 not run — retry without the taxonomy columns.
          delete row.category_l2;
          delete row.category_l3;
          return sbClient.from('wardrobe_items').insert(row).then(({ error: e2 }) => {
            if (e2) { console.warn('Wardrobe save failed:', e2.message); return false; }
            P.saved = true;
            return true;
          });
        }
        if (error) { console.warn('Wardrobe save failed:', error.message); return false; }
        P.saved = true;
        return true;
      }).catch(() => false);

      if (nx) { nx.disabled = false; nx.textContent = 'Continue to your dashboard'; }
      if (st.stage !== i) return;
      // The wow moment moved onto the dashboard (wardrobe-first PRD): styling
      // fires in the background NOW and the handoff payload is written, so the
      // "Your piece, styled" card is already loading when she lands.
      prefireStyle();
      writeHandoff();
      // Enter the reveal state BEFORE painting so the ledger renders every row
      // as still "Reading" — revealLedger() then fills them one by one.
      P.revealing = true;
      P.revealCount = 0;
      paint();
      popTags(true);
      revealLedger();
      // The filing "magic" plays out — ledger fills field by field, tags pop
      // staggered — and then she moves on HERSELF via the "Continue to your
      // dashboard" CTA. No confirmation modal, no full-screen styling gate,
      // and no auto-advance (yanking her mid-read tested badly): the styling
      // is already prefiring in the background either way.
    }

    // The dashboard handoff payload — written as soon as the piece is filed
    // (and refreshed on CONTINUE so a late stylist note still rides along).
    // `cataloged` is stamped in the background once the insert settles so the
    // dashboard never double-saves the piece.
    function writeHandoff() {
      const prompt = P.note.trim() || (P.tag && P.tag.label) || '';
      const put = cataloged => {
        const payload = { prompt, photo: P.img || null, cataloged: !!cataloged };
        try {
          sessionStorage.setItem('rb_onboard_piece', JSON.stringify(payload));
          st.pieceStyled = true;
        } catch (e) {
          try {
            sessionStorage.setItem('rb_onboard_piece', JSON.stringify({ prompt, photo: null, cataloged: !!cataloged }));
            st.pieceStyled = true;
          } catch (e2) { st.pieceStyled = false; }
        }
      };
      put(P.saved);
      if (!P.saved && P.savePromise) {
        Promise.race([P.savePromise, new Promise(r => setTimeout(() => r(false), 3000))])
          .then(ok => { if (ok) put(true); })
          .catch(() => {});
      }
    }

    // Fire the "style key piece" pipeline the moment the piece is filed —
    // the looks generate while the reveal animation and done screen play, and
    // the dashboard's "Your piece, styled" card picks up the finished result
    // instead of starting from zero.
    function prefireStyle() {
      if (st.stylePrefired) return;
      st.stylePrefired = true;
      const t = P.tag || {};
      const prompt = P.note.trim() || t.label || '';
      try { sessionStorage.removeItem('rb_onboard_styled'); } catch (e) {}
      fetch('/api/style', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          photo: P.img || null,
          styleDna: (st.styleDna && (st.styleDna.color_harmony || st.styleDna.silhouette_proportions)) ? st.styleDna : null,
          styleIcons: st.icons || [],
          wardrobeCount: 1,
          wardrobeItems: t.label ? [{ label: t.label, category: t.category || '', color: t.color || '', times_worn: 0 }] : [],
          intent: 'style',
          userId: st.uid || undefined,
        }),
      }).then(r => r.ok ? r.json() : null).then(d => {
        if (!d) return;
        try { sessionStorage.setItem('rb_onboard_styled', JSON.stringify({ prompt, data: d, ts: Date.now() })); } catch (e) {}
      }).catch(() => {});
    }

    paint();
    const next = document.getElementById('ob-next');
    if (P.busy) { next.disabled = true; next.textContent = 'Reading your piece…'; }
    next.onclick = catalogue;
    // Skipping the first piece leaves the wardrobe empty — the whole dashboard
    // styles from catalogued pieces, so make it a deliberate two-tap choice.
    // Only ever reachable with nothing attached: syncSkip takes the control
    // away the moment a photo lands.
    const skip = document.getElementById('ob-skip');
    skip.onclick = () => {
      if (P.busy) return; // a mid-read skip would abandon the piece being filed
      if (skipArmed) { skip.style.pointerEvents = 'none'; finishToDashboard(); return; }
      skipArmed = true;
      skip.textContent = 'Skip anyway — Robes styles only what you add';
    };
    syncSkip();
  }

  /* ── Done ───────────────────────────────────────────────────────── */
  // UNREACHED since 2026-08-18 (kept, like renderPhotoStep, should the
  // screen return): finishToDashboard() sends the flow straight from the
  // key-piece step onto the dashboard — no intermediary "Welcome in".
  function renderDone() {
    if (!st.doneMarked) {
      st.doneMarked = true;
      try { sessionStorage.setItem('rb_onboarded__' + st.uid, '1'); } catch (e) {}
      save({ onboarded_at: new Date().toISOString() });
    }
    const first = st.name.trim().split(/\s+/)[0];
    const sub = st.pieceStyled
      ? 'Your first piece is filed — your looks are composing and will appear on your dashboard in a moment.'
      : st.piece.tag
        ? 'Your first piece is filed in your wardrobe — Robes builds from here.'
        : 'Your style notes will keep growing as Robes gets to know you.';
    root.innerHTML = `
      <div class="flow-anim"><div class="done-screen">
        ${GRAIN}<div class="dk-glow"></div>
        <p class="done-eyebrow">Your style notes are ready</p>
        <h1 class="done-title">${first ? `Welcome in,<br><em>${esc(first)}.</em>` : 'Welcome in.'}</h1>
        <p class="done-sub">${sub}</p>
        <button class="done-restart" id="ob-enter">${st.pieceStyled ? 'Enter your dashboard' : 'Let’s get started'}</button>
        <div class="done-dots">${'<span class="done-dot on"></span>'.repeat(STEPS.length)}</div>
      </div></div>`;
    const enter = document.getElementById('ob-enter');
    enter.onclick = () => { window.location.href = '/dashboard'; };
    // No hold: the CTA stays live even while the prefire is in flight — the
    // dashboard's "Your piece, styled" card carries the composing state, and
    // the done-sub copy already says the looks are on their way.
  }

  /* ── Boot ───────────────────────────────────────────────────────── */
  (async function init() {
    render();

    const session = await new Promise(resolve => {
      let settled = false;
      const finish = s => { if (!settled) { settled = true; resolve(s); } };
      sbClient.auth.onAuthStateChange((_, s) => finish(s));
      sbClient.auth.getSession().then(({ data: { session: s } }) => finish(s));
      setTimeout(() => finish(null), 5000);
    });
    if (!session) { window.location.href = '/signup.html?mode=signin'; return; }
    st.uid = session.user.id;

    // Already-onboarded users land here directly now (OAuth + email-confirm
    // redirects target /onboarding) — pass them straight through to the
    // dashboard rather than re-running the flow.
    // The flag is scoped PER USER: an unscoped key let a tab that had already
    // onboarded one account skip the flow entirely for the next account signed
    // up in it, because this guard runs BEFORE the onboarded_at lookup. Same
    // bug class as the lookbook's `__anon` keys — purge the legacy global.
    let alreadyOnboarded = false;
    try {
      sessionStorage.removeItem('rb_onboarded');
      alreadyOnboarded = !!sessionStorage.getItem('rb_onboarded__' + st.uid);
    } catch (e) {}
    if (alreadyOnboarded) { window.location.href = '/dashboard'; return; }

    const meta = session.user.user_metadata || {};
    const metaName = meta.first_name || meta.given_name || String(meta.full_name || meta.name || '').split(/\s+/)[0] || '';

    const { data: profile } = await sbClient.from('profiles')
      .select('first_name, style_icons, style_dna, onboarded_at').eq('id', st.uid).single();
    if (profile && profile.onboarded_at) { window.location.href = '/dashboard'; return; }
    if (profile) {
      if (profile.first_name) st.savedName = profile.first_name;
      if (profile.style_icons && profile.style_icons.length) st.icons = profile.style_icons;
      if (profile.style_dna && typeof profile.style_dna === 'object') {
        st.styleDna = profile.style_dna;
        if (Array.isArray(profile.style_dna.style_archetypes)) st.archetypes = profile.style_dna.style_archetypes.slice();
      }
    }
    if (!st.name) st.name = st.savedName || metaName;

    if (st.stage === 'name') render();
  })();
</script>

</body>
