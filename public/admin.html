<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Robes — Admin</title>
  <link rel="icon" href="/images/robes-icon-64.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    :root {
      /* Shared tokens come from /css/tokens.css; admin-only ones here */
      --card: #FFFFFF; --red: #A54242; --amber: #B07E36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif; background: var(--cream); color: var(--ink); font-size: 13px; -webkit-font-smoothing: antialiased; }
    body.rb-boot { visibility: hidden; }
    a { color: inherit; }

    .topbar { position: sticky; top: 0; z-index: 50; background: rgba(250,248,245,0.94); backdrop-filter: blur(8px); border-bottom: 0.5px solid var(--rule-mid); }
    .topbar-in { max-width: 1360px; margin: 0 auto; padding: 0 28px; height: 56px; display: flex; align-items: center; gap: 22px; }
    .wordmark { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; letter-spacing: 0.18em; font-weight: 500; text-decoration: none; }
    .wordmark span { color: var(--ink-faint); letter-spacing: 0.04em; font-size: 12px; font-family: inherit; margin-left: 8px; text-transform: uppercase; }
    .tabs { display: flex; gap: 4px; margin-left: 10px; }
    .tab { border: none; background: none; font: inherit; font-size: 13px; color: var(--ink-soft); padding: 7px 12px; border-radius: 100px; cursor: pointer; text-decoration: none; }
    .tab.active { background: var(--ink); color: #fff; }
    .topbar-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .envsel { font: inherit; font-size: 12px; border: 0.5px solid var(--rule-mid); border-radius: 100px; background: #fff; padding: 6px 10px; color: var(--ink); }
    .who { font-size: 12px; color: var(--ink-faint); }
    .signout { border: none; background: none; font: inherit; font-size: 12px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; }

    .main { max-width: 1360px; margin: 0 auto; padding: 26px 28px 80px; }
    .page-h { display: flex; align-items: baseline; gap: 14px; margin: 6px 0 18px; flex-wrap: wrap; }
    .page-h h1 { font-family: Georgia, serif; font-weight: 400; font-size: 24px; }
    .page-h .sub { color: var(--ink-faint); font-size: 13px; }
    .page-h .grow { flex: 1; }

    .card { background: var(--card); border: 0.5px solid var(--rule); border-radius: 10px; }
    .searchrow { display: flex; gap: 10px; margin-bottom: 14px; }
    .search { flex: 0 0 320px; font: inherit; padding: 9px 14px; border: 0.5px solid var(--rule-mid); border-radius: 100px; background: #fff; outline: none; }
    .btn { font: inherit; font-size: 12px; padding: 8px 16px; border-radius: 100px; border: 0.5px solid var(--rule-mid); background: #fff; cursor: pointer; color: var(--ink); }
    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; padding: 10px 14px; border-bottom: 0.5px solid var(--rule-mid); white-space: nowrap; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--ink); }
    .sort-ind { font-size: 8px; color: var(--ink); }
    td { padding: 10px 14px; border-bottom: 0.5px solid var(--rule); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr.row { cursor: pointer; }
    tr.row:hover td { background: var(--cream-100); }
    .num { font-variant-numeric: tabular-nums; }
    .dim { color: var(--ink-faint); }
    .nowrap { white-space: nowrap; }

    .chip { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 100px; border: 0.5px solid var(--rule-mid); background: #fff; white-space: nowrap; }
    .chip.ok { color: var(--sage); border-color: rgba(111,125,106,0.4); }
    .chip.bad { color: var(--red); border-color: rgba(165,66,66,0.4); }
    .chip.warn { color: var(--amber); border-color: rgba(176,126,54,0.4); }
    .chip.env-beta { background: var(--cream-100); }
    .chip.ink { background: var(--ink); color: #fff; border-color: var(--ink); }

    .pager { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
    .empty { padding: 34px 18px; text-align: center; color: var(--ink-faint); }
    .err { padding: 14px 18px; color: var(--red); font-size: 12px; }

    .grid2 { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .topbar-in, .main { padding-left: 16px; padding-right: 16px; } }
    .sec { margin-bottom: 22px; }
    .sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .sec-h h2 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rose); font-weight: 500; }
    .sec-h .cnt { color: var(--ink-faint); font-size: 12px; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; padding: 16px; font-size: 12.5px; }
    .kv dt { color: var(--ink-faint); }
    .kv dd { overflow-wrap: anywhere; }

    .thumbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .titem { background: #fff; border: 0.5px solid var(--rule); border-radius: 8px; overflow: hidden; }
    .titem .im { aspect-ratio: 3/4; background: var(--cream-100); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-family: Georgia, serif; font-size: 22px; position: relative; }
    .titem .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .titem .im .star { position: absolute; top: 6px; right: 6px; font-size: 12px; }
    .titem .tx { padding: 8px 10px; }
    .titem .tx .l1 { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .titem .tx .l2 { font-size: 11px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

    .tl { list-style: none; }
    .tl li { display: flex; gap: 12px; padding: 8px 14px; border-bottom: 0.5px solid var(--rule); align-items: baseline; }
    .tl li:last-child { border-bottom: none; }
    .tl .t { flex: 0 0 118px; color: var(--ink-faint); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tl .m { color: var(--ink-faint); font-size: 12px; overflow-wrap: anywhere; }

    .statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: #fff; border: 0.5px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
    .stat .v { font-family: Georgia, serif; font-size: 26px; }
    .stat .l { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px; }

    .modal-wrap { position: fixed; inset: 0; z-index: 200; background: rgba(32,32,33,0.45); display: flex; align-items: center; justify-content: center; padding: 30px; }
    .modal { background: #fff; border-radius: 12px; max-width: 860px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 22px 24px; }
    .modal h3 { font-family: Georgia, serif; font-weight: 400; font-size: 18px; margin-bottom: 12px; }
    .modal pre { background: var(--cream-100); border: 0.5px solid var(--rule); border-radius: 8px; padding: 14px; font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 16px; max-height: 320px; overflow-y: auto; }
    .modal .x { float: right; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--ink-faint); }

    .note { font-size: 12px; color: var(--ink-faint); margin: 10px 0 0; }

    /* expand / collapse on long lists */
    .xtra[hidden] { display: none; }
    .more-row { padding: 10px 14px; border-top: 0.5px solid var(--rule); }
    .more-btn { font: inherit; font-size: 12px; color: var(--ink-soft); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }

    /* output viewer — the saved artifact, rendered */
    .titem.open, .saved-btn { cursor: pointer; }
    .titem.open:hover { border-color: var(--ink); }
    .saved-btn { font: inherit; font-size: 12.5px; background: none; border: none; padding: 0; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-mid); text-underline-offset: 3px; }
    .saved-btn:hover { text-decoration-color: var(--ink); }
    .modal.wide { max-width: 1120px; }
    .vw-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .vw-head h3 { margin: 0; font-size: 22px; }
    .vw-head .meta { color: var(--ink-faint); font-size: 12px; }
    .vw-prompt { font-family: Georgia, serif; font-style: italic; font-size: 14px; color: var(--ink-soft); margin: 0 0 16px; }
    .vw-ed { font-size: 13px; line-height: 1.6; color: var(--ink-soft); max-width: 720px; margin: 0 0 18px; }
    .vw-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
    .vw-hero { width: 100%; max-height: 460px; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 18px; background: var(--cream-100); }
    .vw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .vw-grid.ways { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .vw-it { border: 0.5px solid var(--rule); border-radius: 8px; overflow: hidden; background: #fff; }
    .vw-it .im { aspect-ratio: 3/4; background: var(--cream-100); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-family: Georgia, serif; font-size: 24px; position: relative; }
    .vw-it .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vw-it .im .own { position: absolute; top: 6px; left: 6px; font-size: 10px; background: rgba(255,255,255,0.92); border-radius: 100px; padding: 2px 7px; color: var(--sage); }
    .vw-it .tx { padding: 8px 10px; }
    .vw-it .ey { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px; }
    .vw-it .l1 { font-size: 12.5px; font-weight: 500; }
    .vw-it .l2 { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
    .vw-it .how { font-size: 11.5px; color: var(--ink-soft); font-style: italic; margin-top: 5px; line-height: 1.45; }
    .vw-it .tx p { font-size: 12px; line-height: 1.55; color: var(--ink-soft); margin: 6px 0 0; }
    .vw-it.way .tx h4 { font-family: Georgia, serif; font-weight: 400; font-size: 17px; margin: 2px 0 4px; }
    .vw-look { border: 0.5px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .vw-look .lh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .vw-look .lh h4 { font-family: Georgia, serif; font-weight: 400; font-size: 17px; margin: 0; }
    .vw-look .strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .vw-look .strip .pc { width: 84px; }
    .vw-look .strip .pc .im { aspect-ratio: 3/4; border-radius: 6px; overflow: hidden; background: var(--cream-100); display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; color: var(--ink-faint); }
    .vw-look .strip .pc .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vw-look .strip .pc .nm { font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .vw-piece-photo { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    .vw-piece-photo img { width: 72px; height: 96px; object-fit: cover; border-radius: 8px; border: 0.5px solid var(--rule); }
    .vw-piece-photo .cap { font-size: 12px; color: var(--ink-faint); }
    .bk { text-decoration: none; color: var(--ink-soft); font-size: 12.5px; display: inline-block; margin-bottom: 12px; }
  </style>
</head>
<body class="rb-boot">
  <div class="topbar">
    <div class="topbar-in">
      <a class="wordmark" href="/admin#users">ROBES<span>Admin</span></a>
      <nav class="tabs">
        <a class="tab" data-tab="users" href="#users">Users</a>
        <a class="tab" data-tab="health" href="#health">Generation health</a>
        <a class="tab" data-tab="feedback" href="#feedback">Feedback</a>
      </nav>
      <div class="topbar-r">
        <select class="envsel" id="envsel" title="Environment filter (events + generation log)">
          <option value="all">All environments</option>
          <option value="beta">Beta only</option>
          <option value="production">Production only</option>
        </select>
        <span class="who" id="who"></span>
        <button class="signout" id="signout">Sign out</button>
      </div>
    </div>
  </div>
  <div class="main" id="main"><div class="empty">Loading…</div></div>

<script>
(function () {
  const SUPA_URL = 'https://ayowpaknssulsqqvwpqx.supabase.co';
  const SUPA_KEY = 'sb_publishable_D_iIPtp_R6kjN_711jfyTg_sFmRdpwJ';
  const sbClient = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  const HOME = 'https://byrobes.com';
  const PAGE = 50;

  const main = document.getElementById('main');
  let me = null;
  let env = localStorage.getItem('rb_admin_env') || 'all';
  const envSel = document.getElementById('envsel');
  envSel.value = env;
  envSel.onchange = () => { env = envSel.value; localStorage.setItem('rb_admin_env', env); route(); };
  document.getElementById('signout').onclick = async () => { await sbClient.auth.signOut(); location.replace(HOME); };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function fmtDT(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
  function ago(iso) {
    if (!iso) return '—';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(s)) return '—';
    if (s < 90) return 'just now';
    if (s < 5400) return Math.round(s / 60) + 'm ago';
    if (s < 129600) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function firstImg(row) {
    if (row.img && /^https?:/.test(row.img)) return row.img;
    try {
      const m = JSON.stringify(row.data || {}).match(/https?:\/\/[^"\\]+/);
      if (m) return m[0];
    } catch (_) {}
    return null;
  }
  function envChip(e) { return '<span class="chip env-' + esc(e) + '">' + esc(e || '—') + '</span>'; }
  function ratingGlyph(r) { return r === 1 ? '👍' : r === 0 ? '👎' : '—'; }
  const TYPE_LABEL = { 'key-piece': 'Key piece', 'daily-look': 'Daily look', 'weekly-plan': 'Weekly plan', 'weekly-plan-archived': 'Weekly plan (archived)', 'travel-edit': 'Travel edit', 'moodboard': 'Moodboard', 'look': 'Look' };

  /* ── gate: session + is_admin ─────────────────────────────── */
  async function gate() {
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) { location.replace(HOME); return false; }
    me = session.user;
    try {
      const { data, error } = await sbClient.from('profiles').select('is_admin, first_name').eq('id', me.id).single();
      if (error || !data || data.is_admin !== true) { location.replace(HOME); return false; }
      document.getElementById('who').textContent = (data.first_name ? data.first_name + ' · ' : '') + (me.email || '');
    } catch (_) { location.replace(HOME); return false; }
    return true;
  }

  /* ── routing ──────────────────────────────────────────────── */
  function setTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  }
  function route() {
    const h = location.hash || '#users';
    const mUser = h.match(/^#user\/([0-9a-f-]{36})$/i);
    if (mUser) { setTab('users'); renderUser(mUser[1]); return; }
    if (h.startsWith('#health')) { setTab('health'); renderHealth(); return; }
    if (h.startsWith('#feedback')) { setTab('feedback'); renderFeedback(); return; }
    setTab('users'); renderUsers();
  }
  window.addEventListener('hashchange', route);

  /* ── users list ───────────────────────────────────────────── */
  let usersPage = 0, usersSearch = '';
  let usersSort = 'created_at', usersDir = 'desc', usersSortServer = true;
  // key = p_sort value the RPC understands; field = row field for the
  // page-local fallback sort; asc = default direction on first click
  const U_COLS = [
    { key: 'name',         label: 'Name',         field: 'first_name',      asc: true },
    { key: 'email',        label: 'Email',        field: 'email',           asc: true },
    { key: 'created_at',   label: 'Joined',       field: 'created_at' },
    { key: 'onboarded',    label: 'Onboarded',    field: 'onboarded_at' },
    { key: 'wardrobe',     label: 'Wardrobe',     field: 'wardrobe_count',  num: true },
    { key: 'lookbook',     label: 'Lookbook',     field: 'lookbook_count',  num: true },
    { key: 'feedback',     label: 'Feedback',     field: 'feedback_count',  num: true },
    { key: 'last_event',   label: 'Last action',  field: 'last_event_at' },
    { key: 'last_sign_in', label: 'Last sign-in', field: 'last_sign_in_at' },
  ];
  function sortRowsLocal(rows) {
    const col = U_COLS.find(c => c.key === usersSort);
    if (!col) return rows;
    const dir = usersDir === 'asc' ? 1 : -1;
    return rows.slice().sort((a, b) => {
      let va = a[col.field], vb = b[col.field];
      if (col.num) { va = Number(va) || 0; vb = Number(vb) || 0; return (va - vb) * dir; }
      if (col.field.indexOf('_at') !== -1) { va = va ? Date.parse(va) : 0; vb = vb ? Date.parse(vb) : 0; return (va - vb) * dir; }
      return String(va || '').toLowerCase().localeCompare(String(vb || '').toLowerCase()) * dir;
    });
  }
  async function renderUsers() {
    main.innerHTML = '<div class="page-h"><h1>Users</h1><span class="sub" id="u-total"></span><span class="grow"></span></div>' +
      '<div class="searchrow"><input class="search" id="u-search" placeholder="Search name or email…" value="' + esc(usersSearch) + '"><button class="btn" id="u-go">Search</button></div>' +
      '<div class="card" id="u-card"><div class="empty">Loading…</div></div>' +
      '<div class="pager"><button class="btn" id="u-prev">‹ Prev</button><span class="dim num" id="u-page"></span><button class="btn" id="u-next">Next ›</button></div>';
    const doSearch = () => { usersSearch = document.getElementById('u-search').value.trim(); usersPage = 0; loadUsers(); };
    document.getElementById('u-go').onclick = doSearch;
    document.getElementById('u-search').onkeydown = e => { if (e.key === 'Enter') doSearch(); };
    document.getElementById('u-prev').onclick = () => { if (usersPage > 0) { usersPage--; loadUsers(); } };
    document.getElementById('u-next').onclick = () => { usersPage++; loadUsers(); };
    loadUsers();
  }
  async function loadUsers() {
    const card = document.getElementById('u-card');
    if (!card) return;
    card.innerHTML = '<div class="empty">Loading…</div>';
    // Sort rides to the RPC so ordering is correct across pages; if the
    // deployed function predates the sort params (PGRST202), fall back to
    // the 4-arg call + a page-local sort and say what to run.
    let { data, error } = await sbClient.rpc('admin_user_overview', { p_limit: PAGE, p_offset: usersPage * PAGE, p_search: usersSearch || null, p_sort: usersSort, p_dir: usersDir });
    usersSortServer = !error;
    if (error) {
      const legacy = await sbClient.rpc('admin_user_overview', { p_limit: PAGE, p_offset: usersPage * PAGE, p_search: usersSearch || null });
      data = legacy.data; error = legacy.error;
    }
    if (error) { card.innerHTML = '<div class="err">Couldn\'t load users — has migration 11 (admin_capture_migration.sql) been run, and is your account flagged is_admin? (' + esc(error.message) + ')</div>'; return; }
    let rows = data || [];
    if (!usersSortServer) rows = sortRowsLocal(rows);
    const total = rows.length ? Number(rows[0].total_count) : 0;
    document.getElementById('u-total').textContent = total + ' user' + (total === 1 ? '' : 's');
    document.getElementById('u-page').textContent = total ? ('Page ' + (usersPage + 1) + ' of ' + Math.max(1, Math.ceil(total / PAGE))) : '';
    document.getElementById('u-prev').disabled = usersPage === 0;
    document.getElementById('u-next').disabled = (usersPage + 1) * PAGE >= total;
    if (!rows.length) { card.innerHTML = '<div class="empty">' + (usersSearch ? 'No users match that search.' : 'No users yet.') + '</div>'; return; }
    const ths = U_COLS.map(c =>
      '<th class="sortable" data-sort="' + c.key + '" title="Sort by ' + esc(c.label.toLowerCase()) + '">' + esc(c.label) +
      (usersSort === c.key ? ' <span class="sort-ind">' + (usersDir === 'asc' ? '▲' : '▼') + '</span>' : '') + '</th>').join('');
    card.innerHTML = '<table><thead><tr>' + ths + '</tr></thead><tbody>' +
      rows.map(u => '<tr class="row" data-id="' + esc(u.id) + '">' +
        '<td class="nowrap">' + esc(u.first_name || '—') + (u.is_admin ? ' <span class="chip ink">admin</span>' : '') + '</td>' +
        '<td>' + esc(u.email || '—') + '</td>' +
        '<td class="nowrap dim">' + fmtDate(u.created_at) + '</td>' +
        '<td>' + (u.onboarded_at ? '<span class="chip ok">✓</span>' : '<span class="dim">—</span>') + '</td>' +
        '<td class="num">' + Number(u.wardrobe_count) + (Number(u.wishlist_count) ? ' <span class="dim">+' + Number(u.wishlist_count) + ' wish</span>' : '') + '</td>' +
        '<td class="num">' + Number(u.lookbook_count) + '</td>' +
        '<td class="num">' + Number(u.feedback_count) + '</td>' +
        '<td class="nowrap dim">' + ago(u.last_event_at) + '</td>' +
        '<td class="nowrap dim">' + ago(u.last_sign_in_at) + '</td>' +
      '</tr>').join('') + '</tbody></table>' +
      (!usersSortServer && (usersSort !== 'created_at' || usersDir !== 'desc')
        ? '<div class="note" style="padding:10px 14px">Sorting this page only — re-run the <code>admin_user_overview</code> block of <code>supabase/admin_capture_migration.sql</code> to sort across all pages.</div>' : '');
    card.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => { location.hash = '#user/' + tr.dataset.id; });
    card.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
      const key = th.dataset.sort;
      if (usersSort === key) { usersDir = usersDir === 'asc' ? 'desc' : 'asc'; }
      else { usersSort = key; usersDir = (U_COLS.find(c => c.key === key) || {}).asc ? 'asc' : 'desc'; }
      usersPage = 0;
      loadUsers();
    });
  }

  /* ── user detail ──────────────────────────────────────────── */
  async function renderUser(uid) {
    main.innerHTML = '<a class="bk" href="#users">‹ All users</a><div class="empty">Loading…</div>';
    const evQuery = sbClient.from('events').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(100);
    let glQuery = sbClient.from('generation_log').select('id,endpoint,model,status,latency_ms,tokens_used,environment,created_at,detail').eq('user_id', uid).order('created_at', { ascending: false }).limit(300);
    if (env !== 'all') glQuery = glQuery.eq('environment', env);
    const [ov, prof, wardrobe, wishlist, lookbook, fb, events, gens, mails] = await Promise.all([
      sbClient.rpc('admin_user_overview', { p_limit: 1, p_offset: 0, p_user: uid }),
      sbClient.from('profiles').select('*').eq('id', uid).single(),
      sbClient.from('wardrobe_items').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(200),
      sbClient.from('wishlist_items').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(100),
      sbClient.from('lookbook_items').select('id,type,title,subtitle,img,share_id,is_public,created_at,data').eq('user_id', uid).order('created_at', { ascending: false }).limit(100),
      sbClient.from('feedback').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(100),
      env === 'all' ? evQuery : evQuery.eq('environment', env),
      glQuery,
      sbClient.from('notifications').select('kind,ref,sent_at').eq('user_id', uid).order('sent_at', { ascending: false }).limit(100),
    ]);
    const o = (ov.data && ov.data[0]) || {};
    const p = prof.data || {};
    const dna = p.style_dna || {};
    const season = (dna.color_harmony && (dna.color_harmony.archetype_name || dna.color_harmony.season)) || p.season || null;
    const body = (dna.silhouette_proportions && (dna.silhouette_proportions.archetype_name || dna.silhouette_proportions.body_type)) || p.body_type || null;

    let html = '<a class="bk" href="#users">‹ All users</a>' +
      '<div class="page-h"><h1>' + esc(p.first_name || o.email || uid.slice(0, 8)) + '</h1>' +
      '<span class="sub">' + esc(o.email || '') + '</span><span class="grow"></span>' +
      '<span class="sub">Joined ' + fmtDate(o.created_at) + (o.onboarded_at ? ' · onboarded' : ' · not onboarded') + ' · last sign-in ' + ago(o.last_sign_in_at) + '</span></div>';

    html += '<div class="grid2"><div>';
    // profile + DNA
    html += '<div class="sec"><div class="sec-h"><h2>Profile · Style DNA</h2></div><div class="card"><dl class="kv">' +
      '<dt>Season</dt><dd>' + esc(season || '—') + '</dd>' +
      '<dt>Undertone</dt><dd>' + esc(p.undertone || '—') + (p.contrast ? ' <span class="dim">· ' + esc(p.contrast) + ' contrast</span>' : '') + '</dd>' +
      '<dt>Body</dt><dd>' + esc(body || '—') + '</dd>' +
      '<dt>Style icons</dt><dd>' + ((p.style_icons || []).length ? esc(p.style_icons.join(', ')) : '—') + '</dd>' +
      '<dt>Budget</dt><dd>' + esc(p.budget || '—') + (p.annual_spend ? ' <span class="dim">· ' + esc(p.annual_spend) + '</span>' : '') + '</dd>' +
      '<dt>Instagram</dt><dd>' + (p.instagram_handle ? '@' + esc(p.instagram_handle) : '—') + '</dd>' +
      '<dt>Analyses</dt><dd>' + ([p.colour_analysis ? 'colour' : null, p.silhouette_analysis ? 'silhouette' : null].filter(Boolean).join(' + ') || '—') + '</dd>' +
      '</dl></div></div>';
    // feedback
    const fbRows = fb.data || [];
    html += '<div class="sec"><div class="sec-h"><h2>Feedback</h2><span class="cnt">' + fbRows.length + '</span></div><div class="card">' +
      (fb.error ? '<div class="err">feedback table unavailable — run migration 11</div>'
        : fbRows.length ? '<ul class="tl">' + fbRows.map(f =>
            '<li><span class="t">' + fmtDT(f.created_at) + '</span><span>' + ratingGlyph(f.rating) + ' <span class="chip">' + esc(f.track || '—') + '</span> ' + esc(f.note || '') + '</span></li>').join('') + '</ul>'
        : '<div class="empty">No feedback yet.</div>') + '</div></div>';
    // events
    const evRows = events.data || [];
    html += '<div class="sec"><div class="sec-h"><h2>Activity</h2><span class="cnt">last ' + evRows.length + (env !== 'all' ? ' · ' + esc(env) : '') + '</span></div><div class="card">' +
      (events.error ? '<div class="err">events table unavailable — run migration 11</div>'
        : evRows.length ? '<ul class="tl">' + evRows.map((e, i) =>
            '<li' + xtra(i, ACT_SHOW) + '><span class="t">' + fmtDT(e.created_at) + '</span><span><span class="chip">' + esc(e.event_type) + '</span> <span class="m">' + esc(metaLine(e.metadata)) + '</span></span></li>').join('') + '</ul>' + moreRow(evRows.length, ACT_SHOW, 'actions')
        : '<div class="empty">No tracked actions yet.</div>') + '</div></div>';
    // emails — the notifications ledger (slice 6): kind · sent_at · ref
    const mRows = mails.data || [];
    html += '<div class="sec"><div class="sec-h"><h2>Emails</h2><span class="cnt">' + mRows.length + '</span></div><div class="card">' +
      (mails.error ? '<div class="err">notifications table unavailable — run migration 22</div>'
        : mRows.length ? '<ul class="tl">' + mRows.map((m, i) =>
            '<li' + xtra(i, ACT_SHOW) + '><span class="t">' + fmtDT(m.sent_at) + '</span><span><span class="chip">' + esc(m.kind) + '</span> <span class="m dim">' + esc(m.ref || '') + '</span></span></li>').join('') + '</ul>' + moreRow(mRows.length, ACT_SHOW, 'emails')
        : '<div class="empty">No emails sent yet.</div>') + '</div></div>';
    html += '</div><div>';
    // wardrobe
    const wRows = wardrobe.data || [];
    html += '<div class="sec"><div class="sec-h"><h2>Wardrobe</h2><span class="cnt">' + wRows.length + '</span></div>' +
      (wRows.length ? '<div class="thumbgrid">' + wRows.map(w =>
        '<div class="titem"><div class="im">' + (w.image_url ? '<img loading="lazy" src="' + esc(w.image_url) + '">' : esc((w.label || '?')[0].toUpperCase())) + (w.hero_position != null ? '<span class="star">★</span>' : '') + '</div>' +
        '<div class="tx"><div class="l1" title="' + esc(w.label) + '">' + esc(w.label || '—') + '</div><div class="l2">' + esc([w.category, w.brand].filter(Boolean).join(' · ')) + (Number(w.times_worn) ? ' · worn ' + Number(w.times_worn) + '×' : '') + '</div></div></div>').join('') + '</div>'
      : '<div class="card"><div class="empty">No wardrobe items.</div></div>') + '</div>';
    // wishlist
    const wlRows = wishlist.data || [];
    if (wlRows.length) {
      html += '<div class="sec"><div class="sec-h"><h2>Wishlist</h2><span class="cnt">' + wlRows.length + '</span></div><div class="thumbgrid">' +
        wlRows.map(w => '<div class="titem"><div class="im">' + (w.image_url ? '<img loading="lazy" src="' + esc(w.image_url) + '">' : esc((w.label || '?')[0].toUpperCase())) + '</div>' +
          '<div class="tx"><div class="l1">' + esc(w.label || '—') + '</div><div class="l2">' + esc([w.source_label || w.source_type, w.brand].filter(Boolean).join(' · ')) + '</div></div></div>').join('') + '</div></div>';
    }
    // lookbook
    const lbRows = lookbook.data || [];
    html += '<div class="sec"><div class="sec-h"><h2>Lookbook</h2><span class="cnt">' + lbRows.length + '</span></div>' +
      (lbRows.length ? '<div class="thumbgrid">' + lbRows.map(l => {
        const im = firstImg(l);
        return '<div class="titem open" data-view="' + esc(l.id) + '" title="Open the full output"><div class="im">' + (im ? '<img loading="lazy" src="' + esc(im) + '">' : esc((l.title || '?')[0].toUpperCase())) + '</div>' +
          '<div class="tx"><div class="l1" title="' + esc(l.title) + '">' + esc(l.title || '—') + '</div>' +
          '<div class="l2">' + esc(TYPE_LABEL[l.type] || l.type) + ' · ' + fmtDate(l.created_at) + (l.share_id && l.is_public ? ' · shared' : '') + '</div></div></div>';
      }).join('') + '</div>'
      : '<div class="card"><div class="empty">Nothing saved yet.</div></div>') + '</div>';
    html += '</div></div>';

    // Generations — one row per generation, joined by gen_id: her typed
    // prompt → each LLM call (click a chip for full prompt/response) → the
    // saved lookbook artifact carrying the same gen_id in its data.
    const gRows = gens.data || [];
    const groups = [];
    const byGid = {};
    gRows.forEach(r => {
      const gid = (r.detail && r.detail.gen_id) || r.id;
      if (!byGid[gid]) { byGid[gid] = { gid, rows: [] }; groups.push(byGid[gid]); }
      byGid[gid].rows.push(r);
    });
    html += '<div class="sec"><div class="sec-h"><h2>Generations</h2><span class="cnt">' + groups.length + (env !== 'all' ? ' · ' + esc(env) : '') + ' · a call chip opens the prompt/response · the saved title opens the output</span></div><div class="card">' +
      (gens.error ? '<div class="err">generation_log unavailable — run migration 11 + set SUPABASE_SERVICE_ROLE_KEY</div>'
      : groups.length ? '<table><thead><tr><th>When</th><th>Endpoint</th><th>Her prompt</th><th>Calls</th><th>Saved as</th></tr></thead><tbody>' +
        groups.slice(0, GEN_MAX).map((g, gi) => {
          const first = g.rows[g.rows.length - 1];
          const uPrompt = g.rows.map(r => r.detail && r.detail.user_prompt).find(Boolean);
          const isRealGid = typeof g.gid === 'string' && g.gid.length < 30;
          const art = isRealGid ? lbRows.find(l => JSON.stringify(l.data || {}).indexOf('"' + g.gid + '"') !== -1) : null;
          const chips = g.rows.slice().reverse().map(r => {
            const img = String(r.model || '').indexOf('image') !== -1;
            const cls = r.status === 'ok' ? 'ok' : r.status === 'partial' ? 'warn' : 'bad';
            const label = (img ? 'img' : 'text') + ' ' + (r.status === 'ok' ? '✓' : esc(r.status)) + (r.latency_ms != null ? ' · ' + (r.latency_ms / 1000).toFixed(1) + 's' : '');
            return '<button class="chip ' + cls + '" style="cursor:pointer;font-family:inherit;margin:1px 2px 1px 0" data-gen="' + esc(r.id) + '">' + label + '</button>';
          }).join('');
          return '<tr' + xtra(gi, GEN_SHOW) + '>' +
            '<td class="nowrap dim">' + fmtDT(first.created_at) + '</td>' +
            '<td class="nowrap">' + esc(first.endpoint) + '</td>' +
            '<td style="max-width:340px">' + (uPrompt ? '<em>“' + esc(uPrompt) + '”</em>' : '<span class="dim">—</span>') + '</td>' +
            '<td style="min-width:180px">' + chips + '</td>' +
            '<td>' + (art ? '<button class="saved-btn" data-view="' + esc(art.id) + '" title="Open the full output">' + esc(art.title || TYPE_LABEL[art.type] || art.type) + '</button>' + (art.share_id && art.is_public ? ' · <a href="/board/' + esc(art.share_id) + '" target="_blank">shared ↗</a>' : '') : '<span class="dim">—</span>') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table>' + moreRow(Math.min(groups.length, GEN_MAX), GEN_SHOW, 'generations') + (groups.length > GEN_MAX ? '<div class="note" style="padding:0 14px 12px">Showing the ' + GEN_MAX + ' most recent generations.</div>' : '')
      : '<div class="empty">No generations logged yet' + (env !== 'all' ? ' in ' + esc(env) : '') + '.</div>') + '</div></div>';
    main.innerHTML = html;
    main.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => inspectGen(b.dataset.gen));
    main.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
      const row = lbRows.find(l => String(l.id) === b.dataset.view);
      if (row) viewOutput(row, gRows);
    });
    main.querySelectorAll('[data-more]').forEach(b => b.onclick = () => toggleMore(b));
  }
  // Long lists render collapsed: the first N rows show, the rest carry
  // `xtra` + hidden until "Show all" flips them (and back).
  const ACT_SHOW = 8, GEN_SHOW = 10, GEN_MAX = 100;
  function xtra(i, n) { return i >= n ? ' class="xtra" hidden' : ''; }
  function moreRow(total, n, noun) {
    if (total <= n) return '';
    return '<div class="more-row"><button class="more-btn" data-more="' + n + '" data-noun="' + esc(noun) + '" data-total="' + total + '">Show all ' + total + ' ' + esc(noun) + ' ↓</button></div>';
  }
  function toggleMore(b) {
    const card = b.closest('.card');
    if (!card) return;
    const open = b.dataset.open === '1';
    card.querySelectorAll('.xtra').forEach(el => { el.hidden = open; });
    b.dataset.open = open ? '' : '1';
    b.textContent = open ? 'Show all ' + b.dataset.total + ' ' + b.dataset.noun + ' ↓' : 'Show the latest ' + b.dataset.more + ' ↑';
  }

  /* ── output viewer: the saved artifact as she saw it ───────── */
  // Renders the lookbook row's data blob visually — the generated frames
  // and wardrobe photos, the pieces, the stylist copy — per type. Image
  // resolution mirrors the app's own ladders: a piece shows its wardrobe
  // photo first, else the generated still at its image_index.
  function viewOutput(row, gRows) {
    const d = row.data && typeof row.data === 'object' ? row.data : {};
    const type = row.type || 'key-piece';
    const http = u => (typeof u === 'string' && /^https?:/.test(u)) ? u : null;
    const gid = (() => { try { const m = JSON.stringify(d).match(/"genId":"([^"]+)"/); return m && m[1]; } catch (_) { return null; } })();
    const uPrompt = gid ? ((gRows || []).map(r => r.detail && r.detail.gen_id === gid && r.detail.user_prompt).find(Boolean) || null) : null;
    const tile = (im, ey, l1, l2, how, own) =>
      '<div class="vw-it"><div class="im">' + (im ? '<img loading="lazy" src="' + esc(im) + '">' : esc((l1 || '?')[0].toUpperCase())) + (own ? '<span class="own">✓ yours</span>' : '') + '</div>' +
      '<div class="tx">' + (ey ? '<div class="ey">' + esc(ey) + '</div>' : '') + '<div class="l1">' + esc(l1 || '—') + '</div>' + (l2 ? '<div class="l2">' + esc(l2) + '</div>' : '') + (how ? '<div class="how">' + esc(how) + '</div>' : '') + '</div></div>';
    const prov = it => it.wardrobe_match ? 'In her wardrobe' : [it.brand, it.retailer_hint, it.price_point].filter(Boolean).join(' · ');
    const itemImg = (it, gen) => http(it.wardrobe_match && it.wardrobe_match.image_url) || (Number.isInteger(it.image_index) ? http(gen[it.image_index]) : null) || http(it.image_url) || http(it.img);

    let body = '';
    let subtitle = row.subtitle || '';
    if (type === 'key-piece') {
      const kp = d.kpData || {};
      const gen = Array.isArray(kp.generatedImages) ? kp.generatedImages : [];
      const ways = Array.isArray(kp.ways) ? kp.ways : [];
      if (http(kp.photoUrl)) body += '<div class="vw-piece-photo"><img src="' + esc(kp.photoUrl) + '"><span class="cap">Her piece, as attached</span></div>';
      body += '<div class="vw-grid ways">' + ways.map((w, i) =>
        '<div class="vw-it way"><div class="im">' + (http(gen[i]) ? '<img loading="lazy" src="' + esc(gen[i]) + '">' : '<span style="font-size:12px">no frame landed</span>') + '</div>' +
        '<div class="tx">' + (w.eyebrow ? '<div class="ey">' + esc(w.eyebrow) + '</div>' : '') + '<h4>' + esc(w.title || 'Look ' + (i + 1)) + '</h4>' +
        (w.outfit ? '<p>' + esc(w.outfit) + '</p>' : '') + (w.details ? '<p>' + esc(w.details) + '</p>' : '') + (w.accessories ? '<p><span class="ey" style="display:block">Accessories</span>' + esc(w.accessories) + '</p>' : '') +
        '</div></div>').join('') + '</div>';
      if (!ways.length) body += '<div class="empty">No looks stored on this entry.</div>';
    } else if (type === 'daily-look') {
      const dl = d.dlData || {};
      const gen = Array.isArray(dl.generatedImages) ? dl.generatedImages : [];
      subtitle = [dl.occasion_label, dl.anchor_date, dl.context && dl.context.city].filter(Boolean).join(' · ') || subtitle;
      if (dl.stylist_summary) body += '<p class="vw-ed">' + esc(dl.stylist_summary) + (dl.transition_tip ? ' <span class="dim">— ' + esc(dl.transition_tip) + '</span>' : '') + '</p>';
      const items = [];
      (Array.isArray(dl.steps) ? dl.steps : []).forEach(s => (Array.isArray(s && s.items) ? s.items : []).forEach(it => it && items.push({ it, role: s.title })));
      body += items.length ? '<div class="vw-grid">' + items.map(x => tile(itemImg(x.it, gen), x.role, x.it.name, prov(x.it), x.it.how, !!x.it.wardrobe_match)).join('') + '</div>'
        : '<div class="empty">No pieces stored on this entry.</div>';
    } else if (type === 'travel-edit') {
      const tv = d.tvData || {};
      const gen = Array.isArray(tv.generatedImages) ? tv.generatedImages : [];
      const cap = Array.isArray(tv.capsule) ? tv.capsule : [];
      subtitle = [tv.destination, tv.dateLine, tv.vibe].filter(Boolean).join(' · ') || subtitle;
      if (http(gen[0]) && !cap.some(c => c && c.image_index === 0)) body += '<img class="vw-hero" src="' + esc(gen[0]) + '">';
      if (tv.stylist_summary) body += '<p class="vw-ed">' + esc(tv.stylist_summary) + '</p>';
      const looks = Array.isArray(tv.looks) ? tv.looks : [];
      if (looks.length) {
        body += '<div class="sec-h"><h2>Looks</h2><span class="cnt">' + looks.length + '</span></div>';
        body += looks.map(l => {
          const pins = Array.isArray(l.pins) && l.pins.length ? 'pinned to day ' + l.pins.map(p => p + 1).join(', ') : 'unpinned';
          const entries = Array.isArray(l.formula) ? l.formula : (Array.isArray(l.pieces) ? l.pieces : []);
          const strip = entries.map(f => {
            const c = Number.isInteger(f.item_index) ? cap[f.item_index] : null;
            const nm = (c && c.name) || f.name || '—';
            const im = c ? itemImg(c, gen) : http(f.image);
            return '<div class="pc"><div class="im">' + (im ? '<img loading="lazy" src="' + esc(im) + '">' : esc(nm[0].toUpperCase())) + '</div><div class="nm">' + esc(nm) + '</div></div>';
          }).join('');
          return '<div class="vw-look"><div class="lh"><h4>' + esc(l.title || l.occasion || 'Look') + '</h4>' + (l.occasion && l.occasion !== l.title ? '<span class="chip">' + esc(l.occasion) + '</span>' : '') + '<span class="dim">' + esc(pins) + (l.imported ? ' · her own look, packed whole' : '') + '</span></div>' +
            (l.how ? '<div class="vw-ed" style="margin:0 0 4px">' + esc(l.how) + '</div>' : '') + (strip ? '<div class="strip">' + strip + '</div>' : '') + '</div>';
        }).join('');
      }
      if (cap.length) {
        body += '<div class="sec-h" style="margin-top:16px"><h2>The capsule</h2><span class="cnt">' + cap.length + ' · ' + cap.filter(c => c && c.wardrobe_match).length + ' hers' + (cap.some(c => c && c.packed) ? ' · ' + cap.filter(c => c && c.packed).length + ' packed' : '') + '</span></div>';
        body += '<div class="vw-grid">' + cap.map(c => c && tile(itemImg(c, gen), c.tier ? String(c.tier).replace(/_/g, ' ') : '', c.name, prov(c), c.reason || c.bridge, !!c.wardrobe_match)).filter(Boolean).join('') + '</div>';
      }
      if (!looks.length && !cap.length) body += '<div class="empty">Nothing stored on this trip yet.</div>';
    } else if (type === 'moodboard') {
      const imgs = [http(d.hero_image)].concat((Array.isArray(d.grid_images) ? d.grid_images : []).map(g => http(g && g.url))).filter(Boolean);
      if (Array.isArray(d.aesthetic_tags) && d.aesthetic_tags.length) body += '<div class="vw-tags">' + d.aesthetic_tags.map(t => '<span class="chip">' + esc(t) + '</span>').join('') + '</div>';
      if (d.editorial_direction) body += '<p class="vw-ed">' + esc(d.editorial_direction) + '</p>';
      if (imgs.length) body += '<div class="vw-grid">' + imgs.map(u => '<div class="vw-it"><div class="im"><img loading="lazy" src="' + esc(u) + '"></div></div>').join('') + '</div>';
      const look = Array.isArray(d.the_look) ? d.the_look : [];
      if (look.length) body += '<div class="sec-h"><h2>The rack</h2></div><div class="vw-grid">' + look.map(i => i && tile(http(i.wardrobe_match && i.wardrobe_match.image_url), i.category, i.name, i.wardrobe_match ? 'In her wardrobe' : [i.brand_name || i.retailer_hint, i.price_point].filter(Boolean).join(' · '), '', !!i.wardrobe_match)).filter(Boolean).join('') + '</div>';
    } else {
      body += '<div class="note" style="margin:0 0 10px">No visual renderer for this type — raw data below.</div>';
    }
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = '<div class="modal wide"><button class="x">✕</button>' +
      '<div class="vw-head"><h3>' + esc(row.title || TYPE_LABEL[type] || type) + '</h3><span class="meta">' + esc(TYPE_LABEL[type] || type) + ' · ' + fmtDT(row.created_at) + (subtitle ? ' · ' + esc(subtitle) : '') +
      (row.share_id && row.is_public ? ' · <a href="/board/' + esc(row.share_id) + '" target="_blank">public page ↗</a>' : '') + '</span></div>' +
      (uPrompt ? '<p class="vw-prompt">“' + esc(uPrompt) + '”</p>' : '') +
      body +
      '<details style="margin-top:14px"><summary class="dim" style="cursor:pointer;font-size:12px">Raw data</summary><pre>' + esc(JSON.stringify(d, null, 2).slice(0, 60000)) + '</pre></details>' +
      '</div>';
    wrap.onclick = e => { if (e.target === wrap || e.target.classList.contains('x')) wrap.remove(); };
    document.body.appendChild(wrap);
  }
  function metaLine(m) {
    if (!m || typeof m !== 'object') return '';
    return Object.keys(m).slice(0, 4).map(k => k + ': ' + String(m[k]).slice(0, 60)).join(' · ');
  }

  /* ── generation health ────────────────────────────────────── */
  async function renderHealth() {
    main.innerHTML = '<div class="page-h"><h1>Generation health</h1><span class="sub">Gemini call trail · last 7 days' + (env !== 'all' ? ' · ' + esc(env) : '') + '</span></div><div id="h-body"><div class="empty">Loading…</div></div>';
    const since = new Date(Date.now() - 7 * 86400000).toISOString();
    let q = sbClient.from('generation_log')
      .select('id,endpoint,model,status,latency_ms,tokens_used,environment,user_id,created_at,detail')
      .gte('created_at', since).order('created_at', { ascending: false }).limit(1000);
    if (env !== 'all') q = q.eq('environment', env);
    const { data, error } = await q;
    const body = document.getElementById('h-body');
    if (error) { body.innerHTML = '<div class="card"><div class="err">generation_log unavailable — run migration 11. (' + esc(error.message) + ')</div></div>'; return; }
    const rows = data || [];
    if (!rows.length) {
      body.innerHTML = '<div class="card"><div class="empty">No generation logs in the last 7 days.<div class="note">Logging needs migration 11 run in Supabase AND <code>SUPABASE_SERVICE_ROLE_KEY</code> set on the Railway service (check <code>/api/health</code> → <code>generation_log: true</code>).</div></div></div>';
      return;
    }
    // aggregate by endpoint
    const agg = {};
    rows.forEach(r => {
      const a = agg[r.endpoint] || (agg[r.endpoint] = { calls: 0, ok: 0, partial: 0, fail: 0, lat: [], tokens: 0 });
      a.calls++;
      if (r.status === 'ok') a.ok++; else if (r.status === 'partial') a.partial++; else a.fail++;
      if (r.latency_ms != null) a.lat.push(r.latency_ms);
      a.tokens += Number(r.tokens_used) || 0;
    });
    const fails = rows.filter(r => r.status !== 'ok');
    const failUsers = new Set(fails.filter(f => f.user_id).map(f => f.user_id)).size;
    let html = '<div class="statrow">' +
      '<div class="stat"><div class="v num">' + rows.length + '</div><div class="l">calls (7d' + (rows.length === 1000 ? ', capped' : '') + ')</div></div>' +
      '<div class="stat"><div class="v num">' + fails.filter(f => f.status !== 'partial').length + '</div><div class="l">errors / timeouts</div></div>' +
      '<div class="stat"><div class="v num">' + fails.filter(f => f.status === 'partial').length + '</div><div class="l">partial (no image)</div></div>' +
      '<div class="stat"><div class="v num">' + failUsers + '</div><div class="l">users affected</div></div>' +
      '</div>';
    html += '<div class="sec"><div class="sec-h"><h2>By endpoint</h2></div><div class="card"><table><thead><tr><th>Endpoint</th><th>Calls</th><th>OK</th><th>Partial</th><th>Failed</th><th>Median latency</th><th>Tokens</th></tr></thead><tbody>' +
      Object.keys(agg).sort((a, b) => agg[b].calls - agg[a].calls).map(ep => {
        const a = agg[ep];
        const med = a.lat.length ? a.lat.slice().sort((x, y) => x - y)[Math.floor(a.lat.length / 2)] : null;
        return '<tr><td>' + esc(ep) + '</td><td class="num">' + a.calls + '</td><td class="num">' + a.ok + '</td>' +
          '<td class="num">' + (a.partial ? '<span class="chip warn">' + a.partial + '</span>' : '<span class="dim">0</span>') + '</td>' +
          '<td class="num">' + (a.fail ? '<span class="chip bad">' + a.fail + '</span>' : '<span class="dim">0</span>') + '</td>' +
          '<td class="num">' + (med != null ? (med / 1000).toFixed(1) + 's' : '—') + '</td>' +
          '<td class="num dim">' + (a.tokens ? a.tokens.toLocaleString() : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    html += '<div class="sec"><div class="sec-h"><h2>Not-OK calls</h2><span class="cnt">' + fails.length + ' · click a row for the full prompt/response</span></div><div class="card">' +
      (fails.length ? '<table><thead><tr><th>When</th><th>Endpoint</th><th>Model</th><th>Status</th><th>Env</th><th>User</th><th>Detail</th></tr></thead><tbody>' +
        fails.slice(0, 200).map(f => '<tr class="row" data-id="' + esc(f.id) + '">' +
          '<td class="nowrap dim">' + fmtDT(f.created_at) + '</td><td>' + esc(f.endpoint) + '</td><td class="dim">' + esc(f.model || '—') + '</td>' +
          '<td><span class="chip ' + (f.status === 'partial' ? 'warn' : 'bad') + '">' + esc(f.status) + '</span></td>' +
          '<td>' + envChip(f.environment) + '</td>' +
          '<td class="dim">' + (f.user_id ? '<a href="#user/' + esc(f.user_id) + '" onclick="event.stopPropagation()">' + esc(f.user_id.slice(0, 8)) + '…</a>' : '—') + '</td>' +
          '<td class="dim">' + esc((f.detail && f.detail.error) || '') + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">Everything green — no failed calls in the window.</div>') + '</div></div>';
    body.innerHTML = html + '<div id="h-mail"></div>';
    body.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => inspectGen(tr.dataset.id));
    renderMailHealth(since);
  }
  // Emails · last 7 days — one row per kind from the notifications ledger
  // (slice 6). No environment filter: the ledger is per user, not per
  // service, which is what stops beta and production mailing twice.
  async function renderMailHealth(since) {
    const host = document.getElementById('h-mail');
    if (!host) return;
    const { data, error } = await sbClient.from('notifications').select('user_id,kind,sent_at').gte('sent_at', since).order('sent_at', { ascending: false }).limit(2000);
    if (error) { host.innerHTML = '<div class="sec"><div class="sec-h"><h2>Emails</h2></div><div class="card"><div class="err">notifications unavailable — run migration 22. (' + esc(error.message) + ')</div></div></div>'; return; }
    const rows = data || [];
    const agg = {};
    rows.forEach(r => { const a = agg[r.kind] || (agg[r.kind] = { n: 0, users: new Set(), last: null }); a.n++; a.users.add(r.user_id); if (!a.last || r.sent_at > a.last) a.last = r.sent_at; });
    host.innerHTML = '<div class="sec"><div class="sec-h"><h2>Emails</h2><span class="cnt">' + rows.length + ' sent · last 7 days</span></div><div class="card">' +
      (rows.length ? '<table><thead><tr><th>Kind</th><th>Sent</th><th>People</th><th>Last</th></tr></thead><tbody>' +
        Object.keys(agg).sort((a, b) => agg[b].n - agg[a].n).map(k => '<tr><td>' + esc(k) + '</td><td class="num">' + agg[k].n + '</td><td class="num">' + agg[k].users.size + '</td><td class="nowrap dim">' + fmtDT(agg[k].last) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">No emails in the window.<div class="note">Sending needs migration 22 run in Supabase AND <code>RESEND_API_KEY</code> set on the Railway service (check <code>/api/health</code> → <code>email: true</code>).</div></div>') + '</div></div>';
  }
  async function inspectGen(id) {
    const { data, error } = await sbClient.from('generation_log').select('*').eq('id', id).single();
    if (error || !data) return;
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = '<div class="modal"><button class="x">✕</button>' +
      '<h3>' + esc(data.endpoint) + ' · ' + esc(data.model || '') + '</h3>' +
      '<div class="dim" style="margin-bottom:10px">' + fmtDT(data.created_at) + ' · ' + esc(data.status) + ' · ' + (data.latency_ms != null ? (data.latency_ms / 1000).toFixed(1) + 's' : '—') + (data.tokens_used ? ' · ' + data.tokens_used + ' tokens' : '') + ' · ' + esc(data.environment) + '</div>' +
      '<div class="sec-h"><h2>Prompt</h2></div><pre>' + esc(data.prompt || '—') + '</pre>' +
      '<div class="sec-h"><h2>Response</h2></div><pre>' + esc(data.response ? JSON.stringify(data.response, null, 2) : '—') + '</pre>' +
      (data.detail && Object.keys(data.detail).length ? '<div class="sec-h"><h2>Detail</h2></div><pre>' + esc(JSON.stringify(data.detail, null, 2)) + '</pre>' : '') +
      '</div>';
    wrap.onclick = e => { if (e.target === wrap || e.target.classList.contains('x')) wrap.remove(); };
    document.body.appendChild(wrap);
  }

  /* ── feedback feed ────────────────────────────────────────── */
  let fbPage = 0;
  async function renderFeedback() {
    main.innerHTML = '<div class="page-h"><h1>Feedback</h1><span class="sub">newest first, all users</span></div>' +
      '<div class="card" id="f-card"><div class="empty">Loading…</div></div>' +
      '<div class="pager"><button class="btn" id="f-prev">‹ Prev</button><span class="dim num" id="f-page"></span><button class="btn" id="f-next">Next ›</button></div>';
    document.getElementById('f-prev').onclick = () => { if (fbPage > 0) { fbPage--; loadFeedback(); } };
    document.getElementById('f-next').onclick = () => { fbPage++; loadFeedback(); };
    loadFeedback();
  }
  async function loadFeedback() {
    const card = document.getElementById('f-card');
    if (!card) return;
    card.innerHTML = '<div class="empty">Loading…</div>';
    const { data, error, count } = await sbClient.from('feedback').select('*', { count: 'exact' })
      .order('created_at', { ascending: false }).range(fbPage * PAGE, fbPage * PAGE + PAGE - 1);
    if (error) { card.innerHTML = '<div class="err">feedback table unavailable — run migration 11. (' + esc(error.message) + ')</div>'; return; }
    const rows = data || [];
    document.getElementById('f-page').textContent = count ? 'Page ' + (fbPage + 1) + ' of ' + Math.max(1, Math.ceil(count / PAGE)) : '';
    document.getElementById('f-prev').disabled = fbPage === 0;
    document.getElementById('f-next').disabled = (fbPage + 1) * PAGE >= (count || 0);
    if (!rows.length) { card.innerHTML = '<div class="empty">No in-app feedback yet — it starts collecting once this build is live.</div>'; return; }
    // names for this page
    const ids = Array.from(new Set(rows.filter(r => r.user_id).map(r => r.user_id)));
    let names = {};
    if (ids.length) {
      const { data: profs } = await sbClient.from('profiles').select('id, first_name').in('id', ids);
      (profs || []).forEach(p => { names[p.id] = p.first_name; });
    }
    card.innerHTML = '<table><thead><tr><th>When</th><th>User</th><th>Surface</th><th></th><th>Note</th></tr></thead><tbody>' +
      rows.map(f => '<tr>' +
        '<td class="nowrap dim">' + fmtDT(f.created_at) + '</td>' +
        '<td class="nowrap">' + (f.user_id ? '<a href="#user/' + esc(f.user_id) + '">' + esc(names[f.user_id] || f.user_id.slice(0, 8) + '…') + '</a>' : '—') + '</td>' +
        '<td><span class="chip">' + esc(f.track || '—') + '</span></td>' +
        '<td>' + ratingGlyph(f.rating) + '</td>' +
        '<td>' + esc(f.note || '') + '</td>' +
      '</tr>').join('') + '</tbody></table>';
  }

  /* ── boot ─────────────────────────────────────────────────── */
  (async () => {
    if (!(await gate())) return;
    document.body.classList.remove('rb-boot');
    route();
  })();
})();
</script>
</body>
</html>
