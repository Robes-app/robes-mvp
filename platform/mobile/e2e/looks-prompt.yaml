# The look prompt on a new look for today, on iOS's own sheet (docked prompt PRD phase 3): the
# bar's field is the real one, its place and weather in the box; her send puts the dock away to
# the sparkle while Robes dresses the look, and the sparkle's dot says when Robes asks (Annie,
# 18 Nov). Signed in on Home, from sign-in.yaml.
appId: host.exp.Exponent
---
# iOS's own tab bar names its tabs, with no test ids.
- tapOn: 'HOME'
- scrollUntilVisible:
    element:
      id: 'disc-create'
    timeout: 15000
- tapOn:
    id: 'disc-create'
# New look opens at the bar: iOS's sheet, its field the real one (no second sheet to type in).
- extendedWaitUntil:
    visible:
      id: 'prompt-dock'
    timeout: 15000
- assertVisible:
    id: 'draft-context'
- tapOn:
    id: 'draft-prompt'
- inputText: 'Dinner with friends'
- assertVisible: 'Dinner with friends'
# With a place, the weather can be left out and brought back while she types (B5). A fresh
# account may have no place yet ("Type a city"), when there is no weather to leave out.
- runFlow:
    when:
      visible: 'Leave the weather out'
    commands:
      - tapOn: 'Leave the weather out'
      - assertVisible:
          id: 'weather-chip'
      - tapOn:
          id: 'weather-chip'
      - assertVisible: 'Leave the weather out'
- tapOn:
    id: 'prompt-send'
# Sent: the dock waits as the sparkle while Robes dresses the look.
- extendedWaitUntil:
    visible:
      id: 'prompt-spark'
    timeout: 10000
- assertNotVisible:
    id: 'prompt-dock'
# Robes asks once the picture lands: the sparkle's dot, and a tap opens the bar on the question.
- extendedWaitUntil:
    visible:
      id: 'prompt-spark-dot'
    timeout: 180000
- tapOn:
    id: 'prompt-spark'
- extendedWaitUntil:
    visible: 'How does this feel for .*|How does it feel\?'
    timeout: 10000
- assertVisible:
    id: 'thumb-up'
# Leave with the bar up: the close puts it away first, then asks what to do with the draft.
- tapOn:
    id: 'draft-close'
- extendedWaitUntil:
    visible: 'Discard this draft?'
    timeout: 10000
- tapOn: 'Discard'
- extendedWaitUntil:
    visible:
      id: 'disc-create'
    timeout: 10000
# "Draft let go." with its Undo sits over the tab bar until it times out: a tap on a tab before
# then is a tap on Undo, and the draft comes back.
- extendedWaitUntil:
    notVisible:
      id: 'toast-frame'
    timeout: 20000
