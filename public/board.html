<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--__OG__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  :root { --ink:var(--ink); --cream:var(--cream); --faint:var(--ink-faint); --rule:#E5DED2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--ink); font-family:'Inter',sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:18px clamp(20px,5vw,48px); border-bottom:0.5px solid var(--rule); }
  .wordmark { font-family:'Cormorant',Georgia,serif; font-size:19px; letter-spacing:0.26em; text-transform:uppercase; color:var(--ink); text-decoration:none; }
  .top-cta { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--cream); background:var(--ink); border-radius:100px; padding:10px 20px; text-decoration:none; white-space:nowrap; }
  main { max-width:920px; margin:0 auto; padding:clamp(32px,6vw,64px) clamp(20px,5vw,48px) 40px; }
  .eyebrow { font-size:10px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase; color:var(--faint); margin-bottom:14px; }
  h1 { font-family:'Cormorant',Georgia,serif; font-weight:300; font-size:clamp(34px,6vw,54px); line-height:1.08; letter-spacing:-0.01em; margin-bottom:12px; }
  .sub { font-size:14px; color:var(--faint); margin-bottom:8px; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0; }
  .tag { font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); border:0.5px solid var(--rule); border-radius:100px; padding:6px 13px; }
  .editorial { font-family:'Cormorant',Georgia,serif; font-style:italic; font-weight:300; font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:560px; margin:26px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin:36px 0 0; }
  .grid img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; display:block; background:#EFEAE1; }
  /* Mobile: single-column feed — images flow at their natural ratio; the
     old 16/10 (wide) and 3/4 cover boxes cropped the head and feet off
     portrait editorial shots. Desktop keeps the 3/4 tile grid. */
  .grid img.wide { grid-column:1/-1; aspect-ratio:auto; height:auto; }
  @media (max-width:639px){ .grid img { aspect-ratio:auto; height:auto; } }
  @media (min-width:640px){ .grid img.wide { grid-column:span 2; aspect-ratio:auto; height:100%; } }
  .pieces { margin:44px 0 0; border-top:0.5px solid var(--rule); }
  .pieces-h { font-size:10px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase; color:var(--faint); padding:22px 0 6px; }
  .piece { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:0.5px solid var(--rule); }
  .piece-name { font-size:14px; }
  .piece-meta { font-size:12px; color:var(--faint); white-space:nowrap; }
  .join { margin:56px 0 0; padding:44px clamp(20px,5vw,48px); background:var(--ink); border-radius:14px; text-align:center; }
  .join h2 { font-family:'Cormorant',Georgia,serif; font-weight:300; font-size:clamp(26px,4.5vw,36px); color:var(--cream); line-height:1.15; margin-bottom:10px; }
  .join h2 em { font-style:italic; }
  .join p { font-size:13px; color:rgba(250,248,245,0.65); margin-bottom:24px; }
  .join a { display:inline-block; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink); background:var(--cream); border-radius:100px; padding:14px 32px; text-decoration:none; }
  footer { text-align:center; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--faint); padding:32px 0 40px; }
  .nf { text-align:center; padding:80px 20px 40px; }
  .nf h1 { margin-bottom:14px; }
  .nf p { font-size:14px; color:var(--faint); }

/* a11y: keyboard focus + no-zoom-needed input sizing (Wave 2) */
:focus-visible{outline:2px solid var(--ink,var(--ink));outline-offset:2px}

</style>
  <link rel="icon" type="image/png" sizes="64x64" href="/images/robes-icon-64.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-title" content="Robes">
  <meta name="theme-color" content="#202021">
</head>
<body>
<header class="top">
  <a class="wordmark" href="https://www.byrobes.com">Robes</a>
  <a class="top-cta" href="https://www.byrobes.com">Join Robes</a>
</header>
<main id="main"></main>
<footer>byrobes.com</footer>
<script id="board-data" type="application/json">__BOARD_JSON__</script>
<script>
(function () {
  var b = {};
  try { b = JSON.parse(document.getElementById('board-data').textContent || '{}'); } catch (e) {}
  var main = document.getElementById('main');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  if (!b || b.notFound || !b.title) {
    main.innerHTML = '<div class="nf"><h1>This look isn’t shared<br><em>any more.</em></h1><p>The owner has taken it private — but you can style your own.</p></div>' +
      '<div class="join"><h2>Your wardrobe,<br><em>styled by Robes.</em></h2><p>One prompt. Dressed for anything.</p><a href="https://www.byrobes.com">Create your own</a></div>';
    return;
  }
  var typeLabel = { 'moodboard':'Moodboard', 'key-piece':'Key piece — styled three ways', 'daily-look':'Daily look', 'travel-edit':'Travel edit' }[b.type] || 'Look';
  var imgs = (b.images || []).slice(0, 9);
  var html = '';
  html += '<p class="eyebrow">' + esc(typeLabel) + ' · Styled by Robes</p>';
  html += '<h1>' + esc(b.title) + '</h1>';
  if (b.subtitle) html += '<p class="sub">' + esc(b.subtitle) + '</p>';
  if (b.tags && b.tags.length) html += '<div class="tags">' + b.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  if (b.editorial) html += '<p class="editorial">' + esc(b.editorial) + '</p>';
  if (imgs.length) html += '<div class="grid">' + imgs.map(function (u, i) { return '<img src="' + esc(u) + '" alt="' + esc(b.title) + '"' + (i === 0 && imgs.length > 2 ? ' class="wide"' : '') + ' loading="' + (i < 2 ? 'eager' : 'lazy') + '">'; }).join('') + '</div>';
  if (b.pieces && b.pieces.length) {
    html += '<section class="pieces"><p class="pieces-h">The look — ' + b.pieces.length + ' pieces</p>' +
      b.pieces.map(function (p) {
        var meta = [p.brand, p.price].filter(Boolean).join(' · ');
        return '<div class="piece"><span class="piece-name">' + esc(p.name) + '</span>' + (meta ? '<span class="piece-meta">' + esc(meta) + '</span>' : '') + '</div>';
      }).join('') + '</section>';
  }
  html += '<div class="join"><h2>Want this styled<br><em>for you?</em></h2><p>Robes reads your wardrobe, your colouring and your taste — then dresses you for anything.</p><a href="https://www.byrobes.com">Join Robes</a></div>';
  main.innerHTML = html;
})();
</script>
</body>
</html>
