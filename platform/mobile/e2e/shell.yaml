# Signed in on Home: every tab and You are reachable (sign-out is in sign-in.yaml). No Create button.
appId: host.exp.Exponent
---
- tapOn:
    id: 'wardrobe-tab'
- extendedWaitUntil:
    visible: 'Every look starts with a photograph.'
    timeout: 10000
- tapOn:
    id: 'looks-tab'
- extendedWaitUntil:
    visible: 'Your ideas land here.'
    timeout: 10000
- tapOn:
    id: 'plan-tab'
- extendedWaitUntil:
    visible: 'Nothing planned yet.'
    timeout: 10000
- assertNotVisible:
    id: 'create-tab'
- tapOn:
    id: 'today-tab'
- assertVisible: '.*, Niall\.'
# Expo Go's floating Tools button sits over the avatar, so You is opened by deep link here;
# the avatar → You path is covered by __tests__/shell.test.tsx.
- openLink: ${EXPO_URL}/--/you
- extendedWaitUntil:
    visible: 'Style DNA'
    timeout: 10000
- tapOn: 'Account'
- assertVisible: 'Privacy and data'
- tapOn: 'Back'
