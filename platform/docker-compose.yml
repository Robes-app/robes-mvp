# Local services for `pnpm dev`: Postgres, S3-compatible storage and a mail catcher.
name: robes-platform

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robes
    ports: ['55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d robes']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: robes
      MINIO_ROOT_PASSWORD: robes-local-secret
    ports: ['59000:9000', '59001:9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['51025:1025', '58025:8025']

volumes:
  postgres-data:
  minio-data:
