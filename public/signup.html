<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — Robes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    ::placeholder { color: #C4B8A4; opacity: 1; }

    @keyframes robesFadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #EDE7DE;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
      position: relative;
    }

    /* Blurred wardrobe backdrop */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 50% at 18% 30%, rgba(212,200,196,0.55), transparent 70%),
        radial-gradient(55% 45% at 82% 68%, rgba(232,213,210,0.5), transparent 70%),
        radial-gradient(50% 40% at 60% 12%, rgba(227,225,204,0.45), transparent 70%),
        linear-gradient(135deg, #E7E0CF, #EFE9DC 50%, #E8D5D2);
      filter: blur(2px);
      transform: scale(1.05);
      z-index: 0;
    }

    /* Grid overlay */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.5;
      background:
        linear-gradient(90deg, rgba(32,32,33,0.06) 1px, transparent 1px) 0 0 / 120px 100%,
        linear-gradient(0deg, rgba(32,32,33,0.05) 1px, transparent 1px) 0 0 / 100% 140px;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 470px;
      background: #FAF8F5;
      border: 1px solid #E7E0CF;
      border-radius: 2px;
      padding: 28px 36px 24px;
      animation: robesFadeUp 0.7s cubic-bezier(0.4,0,0.2,1) both;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .logo {
      font-family: 'Cormorant', serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #202021;
    }

    .topbar-bars {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-bars span:first-child {
      width: 22px;
      height: 4px;
      border-radius: 1px;
      background: #A89880;
    }

    .topbar-bars span:last-child {
      width: 6px;
      height: 4px;
      border-radius: 1px;
      background: #D8CFC0;
    }

    .btn-close {
      background: none;
      border: none;
      cursor: pointer;
      color: #A89880;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-close:hover { color: #202021; }

    /* Hero */
    h1 {
      margin: 0 0 14px;
      font-family: 'Cormorant', serif;
      font-weight: 300;
      font-size: 50px;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: #202021;
    }

    h1 em {
      font-style: italic;
      color: #A89880;
    }

    /* Subtext */
    .subtext {
      margin: 0 0 22px;
      font-weight: 300;
      font-size: 14px;
      line-height: 1.65;
      color: #A89880;
    }

    /* OAuth */
    .oauth {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid #E7E0CF;
      border-radius: 2px;
      background: #FAF8F5;
      padding: 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: #202021;
      transition: all 0.2s;
    }

    .btn-oauth:hover {
      background: #F5F0E8;
      border-color: #D8CFC0;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #E7E0CF;
    }

    .divider-label {
      font-weight: 400;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #C4B8A4;
    }

    /* Form fields */
    .field {
      display: block;
      margin-bottom: 18px;
    }

    .field-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .field-label {
      display: block;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #A89880;
    }

    .btn-show {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #C4B8A4;
      padding: 0;
      transition: color 0.2s;
    }

    .btn-show:hover { color: #202021; }

    .field input {
      width: 100%;
      border: 1px solid #E7E0CF;
      border-radius: 2px;
      background: #FAF8F5;
      padding: 14px 16px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 15px;
      color: #202021;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: #A89880; }

    .field-password {
      margin-bottom: 26px;
    }

    /* CTA */
    .btn-cta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: none;
      border-radius: 2px;
      background: #E3DCCB;
      padding: 18px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #202021;
      transition: all 0.2s;
      margin-bottom: 18px;
    }

    .btn-cta:hover {
      background: #202021;
      color: #FAF8F5;
    }

    .btn-cta:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Sign in link */
    .signin-prompt {
      margin: 0 0 16px;
      text-align: center;
      font-weight: 300;
      font-size: 13px;
      color: #A89880;
    }

    .signin-prompt a {
      color: #202021;
      text-decoration: none;
      border-bottom: 1px solid #D8CFC0;
      padding-bottom: 1px;
      transition: border-color 0.2s;
    }

    .signin-prompt a:hover { border-color: #202021; }

    /* Legal */
    .legal {
      border-top: 1px solid #E7E0CF;
      padding-top: 16px;
    }

    .legal p {
      margin: 0;
      text-align: center;
      font-weight: 300;
      font-size: 11px;
      line-height: 1.6;
      color: #C4B8A4;
    }

    .legal a {
      color: #A89880;
      text-decoration: none;
      border-bottom: 1px solid #E7E0CF;
    }

    .legal a:hover { border-color: #A89880; }

    /* Error / success messages */
    .message {
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 300;
      margin-bottom: 16px;
      display: none;
    }

    .message.error {
      background: #FDF0EE;
      border: 1px solid #E8C8C2;
      color: #8B3A30;
    }

    .message.success {
      background: #F0F5EF;
      border: 1px solid #C2D8BE;
      color: #2E5C28;
    }

    .message.visible { display: block; }
  </style>
</head>
<body>

  <div class="card">

    <!-- Top bar -->
    <div class="topbar">
      <span class="logo">Robes</span>
      <div class="topbar-bars">
        <span></span>
        <span></span>
      </div>
      <button class="btn-close" aria-label="Close" onclick="window.location.href='/'">✕</button>
    </div>

    <!-- Hero -->
    <h1 id="form-heading">
      Creating your<br>
      <em>style notes…</em>
    </h1>

    <p class="subtext" id="form-subtext"></p>

    <!-- Error / success message -->
    <div class="message" id="message"></div>

    <!-- Google OAuth -->
    <div class="oauth">
      <button class="btn-oauth" id="btn-google">
        <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-label">Or with email</span>
      <span class="divider-line"></span>
    </div>

    <!-- First name (sign-up only) -->
    <label class="field" id="field-first-name">
      <span class="field-label">First name</span>
      <input type="text" id="first-name" placeholder="Annie" autocomplete="given-name">
    </label>

    <!-- Email -->
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </label>

    <!-- Password -->
    <label class="field field-password">
      <div class="field-header">
        <span class="field-label">Password</span>
        <button class="btn-show" id="btn-show" type="button">Show</button>
      </div>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </label>

    <!-- CTA -->
    <button class="btn-cta" id="btn-submit">
      Reveal my dashboard <span>→</span>
    </button>

    <!-- Sign in / sign up toggle -->
    <p class="signin-prompt" id="mode-toggle">
      Already have an account? <a href="?mode=signin" id="link-signin">Sign in</a>
    </p>

    <!-- Legal -->
    <div class="legal">
      <p>By continuing you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Notice</a>.</p>
    </div>

  </div>

  <script>
    // ─── Supabase config ────────────────────────────────────────────────────
    // Replace these with your actual Supabase project URL and anon key.
    // These are public values — safe to include in client-side code.
    const SUPABASE_URL  = 'https://ayowpaknssulsqqvwpqx.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_D_iIPtp_R6kjN_711jfyTg_sFmRdpwJ';

    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ─── Mode: sign-up vs sign-in ────────────────────────────────────────────
    const isSignIn = new URLSearchParams(window.location.search).get('mode') === 'signin';
    const firstNameField = document.getElementById('field-first-name');
    const heading  = document.getElementById('form-heading');
    const subtext  = document.getElementById('form-subtext');
    const toggle   = document.getElementById('mode-toggle');

    if (isSignIn) {
      firstNameField.style.display = 'none';
      heading.innerHTML = 'Welcome<br><em>back.</em>';
      subtext.textContent = '';
      document.getElementById('btn-submit').innerHTML = 'Sign in <span>→</span>';
      toggle.innerHTML = 'New to Robes? <a href="?mode=signup">Create an account</a>';
      document.title = 'Sign In — Robes';
    }

    // ─── UI refs ────────────────────────────────────────────────────────────
    const firstNameEl = document.getElementById('first-name');
    const emailEl     = document.getElementById('email');
    const passwordEl  = document.getElementById('password');
    const btnShow     = document.getElementById('btn-show');
    const btnGoogle   = document.getElementById('btn-google');
    const btnSubmit   = document.getElementById('btn-submit');
    const msgEl       = document.getElementById('message');

    // ─── Show / hide password ───────────────────────────────────────────────
    btnShow.addEventListener('click', () => {
      const isPassword = passwordEl.type === 'password';
      passwordEl.type  = isPassword ? 'text' : 'password';
      btnShow.textContent = isPassword ? 'Hide' : 'Show';
    });

    // ─── Message helper ─────────────────────────────────────────────────────
    function showMessage(text, type = 'error') {
      msgEl.textContent = text;
      msgEl.className = `message ${type} visible`;
    }

    function clearMessage() {
      msgEl.className = 'message';
    }

    function setLoading(loading) {
      btnSubmit.disabled = loading;
      btnSubmit.innerHTML = loading
        ? (isSignIn ? 'Signing in…' : 'Creating your wardrobe…')
        : (isSignIn ? 'Sign in <span>→</span>' : 'Reveal my dashboard <span>→</span>');
    }

    // ─── Google OAuth ───────────────────────────────────────────────────────
    btnGoogle.addEventListener('click', async () => {
      clearMessage();
      const { error } = await sbClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/dashboard' }
      });
      if (error) showMessage(error.message);
    });

    // ─── Email / password submit (sign-up or sign-in) ───────────────────────
    btnSubmit.addEventListener('click', async () => {
      clearMessage();

      const email    = emailEl.value.trim();
      const password = passwordEl.value;

      if (!email)    { showMessage('Please enter your email address.'); return; }
      if (!password) { showMessage('Please enter a password.'); return; }

      setLoading(true);

      if (isSignIn) {
        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        setLoading(false);
        if (error) { showMessage(error.message); return; }
        window.location.href = '/dashboard';
        return;
      }

      const firstName = firstNameEl.value.trim();
      if (!firstName) { showMessage('Please enter your first name.'); return; }
      if (password.length < 8) { showMessage('Password must be at least 8 characters.'); return; }

      const { data, error } = await sbClient.auth.signUp({
        email,
        password,
        options: {
          data: { first_name: firstName },
          emailRedirectTo: window.location.origin + '/dashboard'
        }
      });

      setLoading(false);

      if (error) { showMessage(error.message); return; }

      if (data.session) {
        window.location.href = '/dashboard';
      } else {
        showMessage(
          'Check your email — we sent you a confirmation link to activate your wardrobe.',
          'success'
        );
      }
    });

    // ─── Enter key submits form ─────────────────────────────────────────────
    [firstNameEl, emailEl, passwordEl].filter(Boolean).forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') btnSubmit.click();
      });
    });
  </script>

</body>
</html>
