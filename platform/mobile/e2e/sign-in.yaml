# Passwordless sign-in → two-screen onboarding → the shell (tabs, Create, You) → sign out,
# in Expo Go against the local API.
# Run with: pnpm --filter @robes/mobile e2e (starts nothing; needs dev:web + expo start running).
# EMAIL and EXPO_URL come from e2e/run.sh (a flow-level env block would override them).
appId: host.exp.Exponent
---
# SecureStore lives in the keychain; start signed out.
- clearKeychain
# A running Expo Go keeps the previous bundle and session; start cold.
- stopApp
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 90000
- tapOn: 'you@example.com'
- inputText: ${EMAIL}
- tapOn: 'Email me a code'
- assertVisible: 'Check your email.'
- runScript: scripts/otp.js
- tapOn:
    text: 'Code'
    index: 0
- inputText: ${output.code}
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'What should Robes call you?'
    timeout: 15000
- tapOn:
    below: 'First name'
- inputText: 'Niall'
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Add your first piece.'
    timeout: 15000
- tapOn: 'Skip for now'
- tapOn: 'Skip anyway — Robes styles only what you add'
- extendedWaitUntil:
    visible: '.*, Niall\.'
    timeout: 15000
- runFlow: shell.yaml
- runFlow: looks-plan.yaml
- openLink: ${EXPO_URL}/--/you
- extendedWaitUntil:
    visible: 'Style DNA'
    timeout: 10000
- tapOn: 'Account'
- scrollUntilVisible:
    element: 'Sign out'
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 10000
