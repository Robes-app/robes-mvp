name: platform-deploy-prod

# Manual only. The `production` GitHub environment requires a reviewer and holds the
# vars/secrets listed in platform/docs/runbooks/environments.md §5.
on:
  workflow_dispatch:

concurrency:
  group: platform-deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ROBES_PRODUCTION_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ROBES_PRODUCTION_CF_PUBLIC_KEY: ${{ vars.CLOUDFRONT_PUBLIC_KEY }}
      ROBES_PRODUCTION_MEDIA_DOMAIN: ${{ vars.MEDIA_DOMAIN }}
      ROBES_PRODUCTION_MEDIA_CERT_ARN: ${{ vars.MEDIA_CERT_ARN }}
      ROBES_PRODUCTION_ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      ROBES_PRODUCTION_BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      ROBES_PRODUCTION_BUDGETS: ${{ vars.BUDGETS }}
      ROBES_PRODUCTION_GENERATE_RESERVED_CONCURRENCY: ${{ vars.GENERATE_RESERVED_CONCURRENCY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/platform-setup
      - run: pnpm --filter @robes/infra test

      # Migration role URL (owns the schema), never the runtime robes_app URL (ADR-020).
      - name: db migrate
        env:
          DATABASE_ADMIN_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm db:migrate

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: robes-deploy-prod-${{ github.run_id }}

      - name: cdk deploy (Production)
        working-directory: platform/infra
        # A script, not `pnpm exec`: exec puts a relative .bin on PATH and esbuild bundling breaks.
        # Stacks live inside the Production Stage, so select them by path; --all only sees top-level stacks.
        run: pnpm cdk deploy 'Production/*' -c stage=production --require-approval never --ci

      - name: smoke
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "$APP_URL/api/v1/health" | tee /dev/stderr | grep -q '"ok":true'
