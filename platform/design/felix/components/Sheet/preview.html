ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(Frame, { title: 'New look', actions: [{ icon: 'sparkle', label: 'Describe' }, { icon: 'photo', label: 'Photo' }, { icon: 'wardrobe', label: 'From pieces' }] }),
