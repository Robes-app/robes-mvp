# Passwordless sign-in → Getting to know you (name, identity; styles and brands left empty;
# each capture step skipped) → the shell (tabs, Create, You) → sign out,
# in Expo Go against the local API.
# Run with: pnpm --filter @robes/mobile e2e (starts nothing; needs dev:web + expo start running).
# EMAIL and EXPO_URL come from e2e/run.sh (a flow-level env block would override them).
appId: host.exp.Exponent
---
# SecureStore lives in the keychain; start signed out.
- clearKeychain
# A running Expo Go keeps the previous bundle and session; start cold.
- stopApp
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 90000
# Expo Go's floating tools button sits over whatever is under it (the draft's Save disc, the
# prompt's send) and stays where it was dragged. Turn it off once per simulator: its menu ›
# Tools button. Expo Go keeps that.
- assertNotVisible:
    id: 'gearshape.fill'
    label: "Expo Go's Tools button is off (its menu › Tools button)"
- tapOn: 'you@example.com'
- inputText: ${EMAIL}
- tapOn: 'Email me a code'
- assertVisible: 'Check your email.'
- runScript: scripts/otp.js
- tapOn:
    text: 'Code'
    index: 0
- inputText: ${output.code}
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'What should Robes call you?'
    timeout: 15000
- tapOn:
    below: 'First name'
- inputText: 'Niall'
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'How do you identify?'
    timeout: 15000
- tapOn: 'Woman'
- tapOn: 'Continue'
- assertVisible: 'Which styles feel like you?'
- tapOn: 'Continue'
- assertVisible: 'Any favourite brands?'
- tapOn: 'Continue'
# The capture steps (onboarding PRD, 17 Nov), each skippable; the last one's Skip lands on Home.
- extendedWaitUntil:
    visible: 'Saved looks on your phone?'
    timeout: 15000
- tapOn: 'Skip'
- assertVisible: 'The pieces you love most.'
- tapOn: 'Skip'
- extendedWaitUntil:
    visible: 'Capture what you’re wearing now.'
    timeout: 15000
- tapOn: 'Skip'
# Usage counts are asked once, on arrival, and the question sits over Home until answered.
- extendedWaitUntil:
    visible: 'Allow usage counts?'
    timeout: 15000
- tapOn: 'Not now'
- extendedWaitUntil:
    visible: '.*, Niall\.'
    timeout: 15000
- runFlow: looks-prompt.yaml
- runFlow: shell.yaml
- runFlow: looks-plan.yaml
- openLink: ${EXPO_URL}/--/you
- extendedWaitUntil:
    visible: 'Style DNA'
    timeout: 10000
- tapOn: 'Account'
- scrollUntilVisible:
    element: 'Sign out'
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Email me a code'
    timeout: 10000
