<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Felix Design System — cover</title>
<style>
  html,body{margin:0;background:var(--cream)}
  .cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--cream)}
  .cv svg{position:absolute;inset:0}
  .ink{fill:var(--ink)} .rose{fill:var(--rose)} .sage{fill:var(--sage)} .mauve{fill:var(--mauve)} .warm{fill:var(--cream-200)}
  .tile{rx:var(--rad)} .well{rx:var(--rad-sm)}
  .disc{fill:var(--white);stroke:var(--rule-mid);stroke-width:1}
  .hair{stroke:var(--rule-mid);stroke-width:1}
  .txt{position:absolute;left:48px;bottom:40px;max-width:440px}
  .name{font:300 64px/0.95 var(--font-serif);color:var(--ink);margin:0}
  .tag{font:400 13px/1.5 var(--font-sans);color:var(--ink-soft);margin:16px 0 0}
</style></head>
<body>
<div class="cv">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <!-- blocks: ink 160×200 (the look card), rose 112×140, mauve 96×120, sage 72×90, cream-200 well 96×120 — all 4:5 like the look photos
       arrangement: a staggered row of portrait cards, the ink card tallest at centre, rose bleeding toward the right edge
       pattern: the literal motif — three action discs riding the bottom edge of the ink card (ActionDisc), over three hairline rules (`rule-mid`): editorial, "borders not shadows"
       scales: corners rad (12) and rad-sm (8); disc r=22 (56px disc at cover scale); gaps space-6 (24) -->
  <line class="hair" x1="480" y1="48" x2="960" y2="48"/>
  <line class="hair" x1="480" y1="168" x2="960" y2="168"/>
  <line class="hair" x1="480" y1="264" x2="960" y2="264"/>
  <rect class="mauve tile" x="512" y="64" width="96" height="120"/>
  <rect class="warm well" x="536" y="196" width="72" height="68"/>
  <rect class="ink tile" x="632" y="24" width="160" height="200"/>
  <rect class="rose tile" x="816" y="72" width="112" height="140"/>
  <rect class="sage tile" x="896" y="196" width="72" height="90"/>
  <circle class="disc" cx="666" cy="224" r="22"/>
  <circle class="disc" cx="712" cy="224" r="22"/>
  <circle class="disc" cx="758" cy="224" r="22"/>
</svg>
<div class="txt">
  <h1 class="name">Felix Design<br>System</h1>
  <p class="tag">Warm neutrals, Cormorant and Inter, soft-rounded surfaces.</p>
</div>
</div>
</body>
</html>
